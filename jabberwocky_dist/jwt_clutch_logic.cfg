# =====================================================================
# JABBERWOCKY APPS — TIMED TEST LOOP ENGINE (DATA GATHERING AUTOMATION)
# VERSION: 1.7.0 [Unified JABBERWOCKY_ Prefix Auto-Grouping Active]
# Location: jabberwocky_dist/jwt_clutch_logic.cfg
# =====================================================================

[respond]

[include ../jabberwocky_dist/jwt_hardware.cfg]

[delayed_gcode _JABBERWOCKY_WELCOME_TRIGGER]
initial_duration: 3.0
gcode:
    JABBERWOCKY_WELCOME

[gcode_macro JABBERWOCKY_WELCOME]
gcode:
    {action_respond_info(
        "─── 🐉 JABBERWOCKY PRINT PROTECTION SUITE ───\n"
        "  • STATUS     : SYSTEM READY / ARMED\n"
        "  • CORE LAYER : v1.7.0 (Mainsail Prefix Aligned)\n"
        "  ➔ Type 'JABBERWOCKY_HELP' for command index.\n"
        "──────────────────────────────────────────"
    )}

[gcode_macro JABBERWOCKY_HELP]
gcode:
    {action_respond_info(
        "═══════════════ JABBERWOCKY COMMAND DIRECTORY ═══════════════\n"
        "  • JABBERWOCKY_TEST_LOAD_RAW               : Runs the 10s load data gathering tool\n"
        "  • JABBERWOCKY_SAVE_BUILD                  : Commits pitch calibration to user profile\n"
        "═════════════════════════════════════════════════════════════"
    )}

[gcode_macro JABBERWOCKY_TEST_LOAD_RAW]
description: Warning, this is strictly for testing load, intended for data gathering. Runs a safe macro-spaced loop.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_respond_info("❌ JABBERWOCKY ERROR: Cannot run diagnostic while printing!")}
    {% else %}
        M118 ===========================================================================
        M118 ⚠️  WARNING: STRICTLY FOR TESTING LOAD, INTENDED FOR DATA GATHERING ONLY
        M118   • Mode        : Direct Silicon Status Object Map Pass
        M118   • Duration    : 10 Seconds Continuous Execution
        M118   • Instruction : Apply finger pressure to test deflection tracking limits.
        M118 ===========================================================================
        _JABBERWOCKY_RUN_SAFE_TEST_LOOP
    {% endif %}

[gcode_macro _JABBERWOCKY_RUN_SAFE_TEST_LOOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_ASC_SETUP_VARIABLES VARIABLE=test_current_tick VALUE=0
    SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=1048575
    UPDATE_DELAYED_GCODE ID=_JABBERWOCKY_TEST_LOOP_HANDLER DURATION=0.1

[delayed_gcode _JABBERWOCKY_TEST_LOOP_HANDLER]
initial_duration: 0
gcode:
    {% set VARS = printer["gcode_macro _ASC_SETUP_VARIABLES"] %}
    {% set current = VARS.test_current_tick|default(0)|int + 1 %}
    
    SET_GCODE_VARIABLE MACRO=_ASC_SETUP_VARIABLES VARIABLE=test_current_tick VALUE={current}
    
    G1 E5 F300
    M400  
    G4 P50  
    
    ASC_POLL_UART_DATA
    
    {% if current < 100 %}
        UPDATE_DELAYED_GCODE ID=_JABBERWOCKY_TEST_LOOP_HANDLER DURATION=0.1
    {% else %}
        SET_TMC_FIELD STEPPER=extruder FIELD=TPWMTHRS VALUE=0
        M118 ===========================================================================
        M118 ✅ SAFE DATA GATHERING COMPLETE: Core boards secured and stable.
        M118 ===========================================================================
    {% endif %}


