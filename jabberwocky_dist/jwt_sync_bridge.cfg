# =====================================================================
# JABBERWOCKY APPS — DASHBOARD SYNC BRIDGE (jwt_sync_bridge.cfg) v5.9.0
# Included only when the gcode_shell_command Klipper extension is present.
# Placeholders are filled in by the installer; do not edit paths by hand.
#
# How it works:
#   * A few seconds after Klipper becomes ready, the dashboard is checked.
#     If any toggle differs from the config files, they are updated and
#     Klipper is restarted ONCE so the change takes effect.
#   * JABBERWOCKY_SYNC_NOW does the same on demand from the Mainsail console.
# =====================================================================
[gcode_shell_command jws_sync_core]
command: __JWS_PYTHON__ __JWS_CORE_PATH__ --config-dir __JWS_CONFIG_DIR__ --sync --restart-if-changed --moonraker-url http://127.0.0.1:__JWS_MOONRAKER_PORT__
timeout: 60.0
verbose: True

[delayed_gcode _JWS_STARTUP_SYNC]
initial_duration: 10.0
gcode:
    RUN_SHELL_COMMAND CMD=jws_sync_core

[gcode_macro JABBERWOCKY_SYNC_NOW]
description: Apply jwt_macro_manager.conf toggles to the config files, then restart Klipper if anything changed.
gcode:
    {action_respond_info("JABBERWOCKY: checking the dashboard. Klipper restarts only if something changed.")}
    RUN_SHELL_COMMAND CMD=jws_sync_core
