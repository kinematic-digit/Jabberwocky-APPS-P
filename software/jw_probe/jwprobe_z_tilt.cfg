# =====================================================================
# JABBERWOCKY PROBE 2.0 — Z-TILT ADJUST BUTTON OVERRIDE
# Include this file ONLY if your printer uses [z_tilt].
# Add to printer.cfg or jwprobe_entry.cfg: [include jwprobe_z_tilt.cfg]
# =====================================================================

[gcode_macro Z_TILT_ADJUST]
rename_existing: _JWP_NATIVE_Z_TILT_ADJUST
description: Intercepts Mainsail/Fluidd Z-Tilt button and G-code commands to automatically deploy and retract the Jabberwocky Probe.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set was_deployed = V.probe_deployed %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # See jwprobe_bed_mesh.cfg for why DEPLOY_PROBE is always called here
    # rather than gated on the possibly-stale was_deployed flag.
    DEPLOY_PROBE
    _JWP_NATIVE_Z_TILT_ADJUST {rawparams}
    {% if not was_deployed %}
        RETRACT_PROBE
    {% endif %}
