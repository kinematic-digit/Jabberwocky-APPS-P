# =====================================================================
# JABBERWOCKY PROBE 2.0 — AUTO-Z CALIBRATION INTEGRATION
# =====================================================================
# Klipper renders a macro's Jinja template before executing its G-code.
# Measurements are therefore captured only by a subsequent macro stage,
# after PROBE or the nozzle-switch touch has completed.

[gcode_macro _JWP_TOUCH_NOZZLE_AT_SWITCH]
description: Measures the nozzle touch height on the frame Z switch pin via G28 Z.
gcode:
    # jwprobe_homing.cfg captures the native frame-switch trigger coordinate
    # in a subsequent macro stage before its post-home Z hop.
    G28 Z

[gcode_macro _JWP_AUTOZ_STATE]
description: Internal staged Auto-Z measurement state
variable_switch_x: 0.0
variable_switch_y: 0.0
variable_bed_x: 0.0
variable_bed_y: 0.0
variable_nozzle_z: 0.0
variable_probe_z: 0.0
variable_candidate_offset: 0.0
variable_continue_full_prep: False
variable_continue_force_full: False
gcode:

[gcode_macro JWP_MEASURE_PROBE_NOZZLE_OFFSET]
description: ONE-TIME SETUP. With sheet removed, bed cold, and no filament loaded, derives the fixed probe-to-nozzle offset and saves it. Once a value is already saved, this is trusted as a fixed hardware constant (per the two-verification Auto-Z design -- see Master Doc 2.md) and CALIBRATE_Z reads it back on every run without ever re-measuring it. Re-running this macro is only needed after a real hardware change (e.g. probe remounted/replaced, switch remounted) -- pass REDO=1 to explicitly confirm you intend to overwrite the existing saved constant.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% if SAVED.get("probe_nozzle_z_offset", 0.0)|float != 0.0 and params.REDO|default(0)|int != 1 %}
        { action_raise_error("JWP_MEASURE_PROBE_NOZZLE_OFFSET already has a saved value: probe_nozzle_z_offset=" ~ "%.4f"|format(SAVED.get("probe_nozzle_z_offset", 0.0)|float) ~ "mm.\nThis is a fixed hardware constant -- CALIBRATE_Z trusts it on every run and never re-measures it automatically. Re-running this is normally unnecessary and NOT part of routine recalibration.\nOnly redo this if the probe or Auto-Z switch was physically remounted/replaced.\nFix: pass REDO=1 to confirm you intend to overwrite the existing saved value, e.g. JWP_MEASURE_PROBE_NOZZLE_OFFSET REDO=1.") }
    {% endif %}
    {% set switch_x = params.SWITCH_X|default(SAVED.get("autoz_switch_x", V.bed_max_x|float / 2.0))|float %}
    {% set switch_y = params.SWITCH_Y|default(SAVED.get("autoz_switch_y", V.switch_y_pos))|float %}
    {% if not SAVED.get("autoz_switch_confirmed", False) and (params.SWITCH_X is not defined or params.SWITCH_Y is not defined) %}
        { action_raise_error("Auto-Z switch location has not been confirmed. Run JWP_ALIGN_AUTOZ_SWITCH (onboarding Step 2, park+jog) or JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] (direct entry) followed by JWP_VERIFY_AUTOZ_SWITCH_LOCATION, or pass SWITCH_X= and SWITCH_Y= explicitly.") }
    {% endif %}
    {% set bed_x = params.BED_X|default(V.bed_max_x|float / 2.0)|float %}
    {% set bed_y = params.BED_Y|default(V.bed_max_y|float / 2.0)|float %}
    {% set needs_initial_home = "xyz" not in printer.toolhead.homed_axes %}
    {% if printer.heater_bed.target|float > 0.0 %}
        { action_raise_error("JWP_MEASURE_PROBE_NOZZLE_OFFSET requires a cold bed: set bed target to 0 and let it cool before retrying.") }
    {% endif %}
    {% if printer.extruder.target|float > 0.0 %}
        { action_raise_error("JWP_MEASURE_PROBE_NOZZLE_OFFSET requires no hotend target and NO filament loaded.") }
    {% endif %}
    M118 JWP setup: sheet REMOVED, bed COLD, and NO filament loaded are required.
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=switch_x VALUE={switch_x}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=switch_y VALUE={switch_y}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=bed_x VALUE={bed_x}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=bed_y VALUE={bed_y}
    {% if needs_initial_home %}
        # Full G28 already travels to and triggers the frame switch. The
        # homing override captures that trigger before its safety hop, so use
        # it directly instead of repeating a second G28 Z at the same switch.
        G28
        _JWP_SETUP_CAPTURE_NOZZLE
    {% else %}
        G90
        G1 X{switch_x} Y{switch_y} F{V.xy_speed|float * 60}
        M400
        _JWP_TOUCH_NOZZLE_AT_SWITCH
        _JWP_SETUP_CAPTURE_NOZZLE
    {% endif %}

[gcode_macro _JWP_SETUP_CAPTURE_NOZZLE]
description: Internal stage: captures completed nozzle-switch measurement
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_AUTOZ_STATE"] %}
    {% set nozzle_z = printer["gcode_macro _JWP_FRAME_SWITCH_STATE"].last_trigger_z|float %}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=nozzle_z VALUE={nozzle_z}
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M400
    # DEPLOY_PROBE queries the live switch state and actuates only when needed.
    # Never trust the runtime mirror at a new probing boundary.
    DEPLOY_PROBE
    G1 X{S.bed_x|float} Y{S.bed_y|float} F{V.xy_speed|float * 60}
    M400
    PROBE
    _JWP_SETUP_CAPTURE_PROBE

[gcode_macro _JWP_SETUP_CAPTURE_PROBE]
description: Internal stage: saves completed bare-bed setup measurement
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_AUTOZ_STATE"] %}
    {% set probe_z = printer.probe.last_z_result|float %}
    {% set mechanical_offset = probe_z - S.nozzle_z|float %}
    G90
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M400
    RETRACT_PROBE
    # Lift Z generously to 50mm above bed so the build sheet can be easily reinstalled
    G1 Z50 F{V.z_speed|float * 60}
    M400
    SAVE_VARIABLE VARIABLE=probe_nozzle_z_offset VALUE={mechanical_offset}
    SAVE_VARIABLE VARIABLE=probe_nozzle_offset_capture_version VALUE=2
    M118 JWP setup complete: nozzle_z={"%.4f"|format(S.nozzle_z|float)}mm, bare-bed probe_z={"%.4f"|format(probe_z)}mm, saved probe_nozzle_z_offset={"%.4f"|format(mechanical_offset)}mm.
    # NOTE: this is Step 4 of 5 -- JWP_TEST_REPEATABILITY/JWP_CONFIRM_REPEATABILITY
    # (Step 3) must already be passing BEFORE this macro is ever reachable in the
    # normal onboarding order (JWP_CONFIRM_REPEATABILITY's own success message is
    # what sends the operator here). Do not re-point back to Step 3 -- that sent
    # a bench operator into a real back-and-forth loop even though nothing was
    # actually wrong. The only remaining step is CALIBRATE_Z.
    {% if printer.save_variables.variables.get("repeatability_validated", False) %}
        M118 Reinstall the sheet before normal printing. NEXT: run CALIBRATE_Z (repeatability is already confirmed -- no need to redo it).
    {% else %}
        M118 Reinstall the sheet before normal printing. NEXT: complete JWP_TEST_REPEATABILITY and JWP_CONFIRM_REPEATABILITY (Step 3), then CALIBRATE_Z.
    {% endif %}

[gcode_macro CALIBRATE_Z]
description: Two-verification Auto-Z: nozzle-to-switch plus probe-to-bed, applying the persisted setup offset.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set P = printer.save_variables.variables %}
    {% set SAVED = printer.save_variables.variables %}
    {% set switch_x = params.SWITCH_X|default(SAVED.get("autoz_switch_x", V.bed_max_x|float / 2.0))|float %}
    {% set switch_y = params.SWITCH_Y|default(SAVED.get("autoz_switch_y", V.switch_y_pos))|float %}
    {% if not SAVED.get("autoz_switch_confirmed", False) and (params.SWITCH_X is not defined or params.SWITCH_Y is not defined) %}
        { action_raise_error("Auto-Z switch location has not been confirmed. Run JWP_ALIGN_AUTOZ_SWITCH (onboarding Step 2, park+jog) or JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] (direct entry) followed by JWP_VERIFY_AUTOZ_SWITCH_LOCATION, or pass SWITCH_X= and SWITCH_Y= explicitly.") }
    {% endif %}
    {% set bed_x = params.BED_X|default(V.bed_max_x|float / 2.0)|float %}
    {% set bed_y = params.BED_Y|default(V.bed_max_y|float / 2.0)|float %}
    {% set needs_initial_home = "xyz" not in printer.toolhead.homed_axes %}
    {% set continue_full_prep = params.CONTINUE_FULL_PREP|default(0)|int == 1 %}
    {% set continue_force_full = params.CONTINUE_FORCE_FULL|default(0)|int == 1 %}
    {% if P.get("probe_nozzle_z_offset", 0.0)|float == 0.0 %}
        { action_raise_error("CALIBRATE_Z requires JWP_MEASURE_PROBE_NOZZLE_OFFSET to be completed first.") }
    {% endif %}
    {% if P.get("probe_nozzle_offset_capture_version", 0)|int < 2 %}
        { action_raise_error("CALIBRATE_Z REFUSED the saved probe/nozzle constant because it predates the frame-switch render-timing fix and may produce a dangerously incorrect first-layer height.\nRemove the build sheet, cool the bed, unload filament, then run: JWP_MEASURE_PROBE_NOZZLE_OFFSET REDO=1\nReinstall the sheet and run CALIBRATE_Z before printing.") }
    {% endif %}
    {% if not P.get("repeatability_validated", False) or P.get("repeatability_last_spread", 999.0)|float > V.accuracy_max_spread|float %}
        { action_raise_error("CALIBRATE_Z requires a current passing JWP_TEST_REPEATABILITY result.\nRun JWP_TEST_REPEATABILITY, then confirm the exact reported range with JWP_CONFIRM_REPEATABILITY SPREAD=<range>.\nThe current acceptance ceiling is 0.0060mm; 0.0030mm or lower is ideal.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=bed_x VALUE={bed_x}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=bed_y VALUE={bed_y}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=continue_full_prep VALUE={continue_full_prep}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=continue_force_full VALUE={continue_force_full}
    {% if needs_initial_home %}
        # Full G28 already performs and captures the frame-switch touch.
        G28
        _JWP_CALIBRATE_CAPTURE_NOZZLE
    {% else %}
        G90
        G1 X{switch_x} Y{switch_y} F{V.xy_speed|float * 60}
        M400
        _JWP_TOUCH_NOZZLE_AT_SWITCH
        _JWP_CALIBRATE_CAPTURE_NOZZLE
    {% endif %}

[gcode_macro _JWP_CALIBRATE_CAPTURE_NOZZLE]
description: Internal stage: captures nozzle-switch reading before bed probe
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_AUTOZ_STATE"] %}
    {% set nozzle_z = printer["gcode_macro _JWP_FRAME_SWITCH_STATE"].last_trigger_z|float %}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=nozzle_z VALUE={nozzle_z}
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M400
    # This is a new probing boundary after a nozzle-switch touch. Re-verify
    # physical deployment even if the runtime mirror still says deployed.
    DEPLOY_PROBE
    G1 X{S.bed_x|float} Y{S.bed_y|float} F{V.xy_speed|float * 60}
    M400
    PROBE
    _JWP_CALIBRATE_CAPTURE_PROBE

[gcode_macro _JWP_CALIBRATE_CAPTURE_PROBE]
description: Internal stage: applies a completed bed-probe reading
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_AUTOZ_STATE"] %}
    {% set stored_offset = printer.save_variables.variables.get("probe_nozzle_z_offset", 0.0)|float %}
    {% set probe_z = printer.probe.last_z_result|float %}
    {% set new_offset = probe_z - (S.nozzle_z|float + stored_offset) %}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=probe_z VALUE={probe_z}
    SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=candidate_offset VALUE={new_offset}
    G90
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M400
    RETRACT_PROBE
    _JWP_CALIBRATE_APPLY_OFFSET

[gcode_macro _JWP_CALIBRATE_APPLY_OFFSET]
description: Internal staged Auto-Z sanity check and offset application after the probe is safely retracted.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_AUTOZ_STATE"] %}
    {% set stored_offset = printer.save_variables.variables.get("probe_nozzle_z_offset", 0.0)|float %}
    {% set new_offset = S.candidate_offset|float %}
    {% set abs_offset = new_offset if new_offset >= 0 else 0.0 - new_offset %}
    {% if abs_offset > V.autoz_max_offset|float %}
        { action_raise_error("JWP Auto-Z REFUSED an implausible Z correction of " ~ "%.4f"|format(new_offset) ~ "mm (safety limit +/-" ~ "%.3f"|format(V.autoz_max_offset|float) ~ "mm).\nNo offset was applied and the probe was retracted safely.\nThe saved probe/nozzle constant may have been captured by the previous render-timing bug. Re-run the one-time cold bare-plate measurement with: JWP_MEASURE_PROBE_NOZZLE_OFFSET REDO=1, then run CALIBRATE_Z again before printing.") }
    {% endif %}
    SET_GCODE_OFFSET Z=0
    SET_GCODE_OFFSET Z_ADJUST={new_offset}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=last_autoz_offset VALUE={new_offset}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=autoz_session_valid VALUE=True
    M118 JWP Auto-Z: nozzle_z={"%.4f"|format(S.nozzle_z|float)}mm, probe_z={"%.4f"|format(S.probe_z|float)}mm, stored_offset={"%.4f"|format(stored_offset)}mm, Z offset={"%.4f"|format(new_offset)}mm.
    {% if S.continue_full_prep %}
        SET_GCODE_VARIABLE MACRO=_JWP_AUTOZ_STATE VARIABLE=continue_full_prep VALUE=False
        _JWP_FULL_PREP_AFTER_AUTOZ FORCE_FULL={1 if S.continue_force_full else 0} AUTOZ_OFFSET={new_offset}
    {% else %}
        # Rough starting estimate from this machine's scanned nozzle travel
        # (Step 0). This is NOT the confirmed physical plate size -- travel
        # can extend past the plate edges or the plate can be offset from
        # where CAD/travel implies -- so it is only a fill-in-the-blanks
        # starting point for the command below, not a substitute for the
        # Step 5 visual measurement.
        {% set est_plate_x = (V.bed_max_x|float - V.bed_min_x|float)|round(0)|int %}
        {% set est_plate_y = (V.bed_max_y|float - V.bed_min_y|float)|round(0)|int %}
        { action_respond_info("==================================================\nJWP AUTO-Z CALIBRATION COMPLETE\n==================================================\nThe sanity-checked Z correction was applied.\n\nNEXT - STEP 5: VERIFY THE INSTALLED BED ENVELOPE\nJWP_ALIGN_BED_ENVELOPE PLATE_X=<plate_width_mm> PLATE_Y=<plate_depth_mm>\n\nStarting estimate from this machine's scanned nozzle travel (Step 0),\nNOT the confirmed plate size -- measure your actual plate and adjust:\nJWP_ALIGN_BED_ENVELOPE PLATE_X=" ~ est_plate_x|string ~ " PLATE_Y=" ~ est_plate_y|string ~ "\n==================================================") }
    {% endif %}

[gcode_macro JWP_TEST_REPEATABILITY]
description: REQUIRED install-time probe repeatability screen. Runs Klipper's native PROBE_ACCURACY at bed center; use JWP_CONFIRM_REPEATABILITY with its reported range.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% if params.SPREAD is defined %}
        { action_raise_error("JWP_TEST_REPEATABILITY does not accept SPREAD.\nYou already ran the test; now confirm the reported range with:\n   JWP_CONFIRM_REPEATABILITY SPREAD=" ~ params.SPREAD|string ~ "\n\nWhy: JWP_TEST_REPEATABILITY runs PROBE_ACCURACY again every time. JWP_CONFIRM_REPEATABILITY is the separate save/confirm step.") }
    {% endif %}
    {% if not (SAVED.get("actuation_dock_deploy_confirmed", False) and SAVED.get("actuation_dock_retract_confirmed", False)) %}
        { action_raise_error("JWP_TEST_REPEATABILITY requires the actuation dock to be aligned and confirmed first (JWP_ALIGN_ACTUATION_DOCK / JWP_ALIGN_SAVE_POSITION for both MODE=DEPLOY and MODE=RETRACT). Any repeatability measurement taken before the dock is mechanically confirmed would reflect dock slop, not true probe accuracy.") }
    {% endif %}
    {% set target_x = params.X|default(V.bed_max_x|float / 2.0)|float %}
    {% set target_y = params.Y|default(V.bed_max_y|float / 2.0)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Every standalone probing entry point verifies the physical probe state.
    DEPLOY_PROBE
    G90
    G1 X{target_x} Y{target_y} F{V.xy_speed|float * 60}
    M400
    G4 P{V.accuracy_settle_ms|int}
    {% set samples = params.SAMPLES|default(V.accuracy_samples)|int %}
    {% set retract_dist = params.SAMPLE_RETRACT_DIST|default(printer.configfile.settings.probe.sample_retract_dist)|float %}
    {% set probe_speed = params.PROBE_SPEED|default(params.SPEED|default(printer.configfile.settings.probe.speed))|float %}
    {% set lift_speed = params.LIFT_SPEED|default(printer.configfile.settings.probe.lift_speed)|float %}
    { action_respond_info("=== JWP REPEATABILITY TEST (PROBE_ACCURACY) ===") }
    { action_respond_info("Requested settings: SAMPLES=" ~ samples|string ~ ", PROBE_SPEED=" ~ probe_speed|string ~ "mm/s, SAMPLE_RETRACT_DIST=" ~ retract_dist|string ~ "mm, LIFT_SPEED=" ~ lift_speed|string ~ "mm/s.") }
    { action_respond_info("Tip: SPEED=[mm/s] is accepted as a shortcut for PROBE_SPEED=[mm/s]. If Klipper's PROBE_ACCURACY line below does not match these values, the printer is running an older installed copy of this macro or needs FIRMWARE_RESTART.") }
    { action_respond_info("Probing bed center... Klipper will print the sample results and a 'range' value below.") }
    PROBE_ACCURACY SAMPLES={samples} SAMPLE_RETRACT_DIST={retract_dist} PROBE_SPEED={probe_speed} LIFT_SPEED={lift_speed}
    _JWP_TEST_REPEATABILITY_FINISH

[gcode_macro _JWP_TEST_REPEATABILITY_FINISH]
description: Internal stage: retracts probe and prints clear instructions for confirming repeatability range.
gcode:
    RETRACT_PROBE
    { action_respond_info("==================================================================") }
    { action_respond_info("HOW TO CONFIRM REPEATABILITY:") }
    { action_respond_info("1. Look at the line above ending with: '... range 0.00XXXX'") }
    { action_respond_info("2. Copy that range number and run:") }
    { action_respond_info("      JWP_CONFIRM_REPEATABILITY SPREAD=[number]") }
    { action_respond_info("   Do NOT run JWP_TEST_REPEATABILITY SPREAD=[number] -- that starts a new PROBE_ACCURACY test.") }
    { action_respond_info("Expected result: 0.0030mm or lower is ideal; up to 0.0060mm passes.") }
    { action_respond_info("   Example (if range is 0.0060):") }
    { action_respond_info("      JWP_CONFIRM_REPEATABILITY SPREAD=0.0060") }
    { action_respond_info("==================================================================") }

[gcode_macro JWP_CONFIRM_REPEATABILITY]
description: Confirms a JWP_TEST_REPEATABILITY result. Pass the native PROBE_ACCURACY reported range as SPREAD=[mm].
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if "SPREAD" not in params %}
        { action_raise_error("JWP_CONFIRM_REPEATABILITY missing SPREAD parameter!\n\nCopy the exact 'range' value printed by PROBE_ACCURACY and run:\n   JWP_CONFIRM_REPEATABILITY SPREAD=[range_value]\n\nExample:\n   JWP_CONFIRM_REPEATABILITY SPREAD=0.0060\n\nGuidance: 0.0030mm or lower is ideal; the acceptance ceiling is 0.0060mm.") }
    {% endif %}
    {% set spread = params.SPREAD|float %}
    {% set passed = spread <= V.accuracy_max_spread|float %}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeatability_last_spread VALUE={spread}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeatability_validated VALUE={passed}
    SAVE_VARIABLE VARIABLE=repeatability_last_spread VALUE={spread}
    SAVE_VARIABLE VARIABLE=repeatability_validated VALUE={passed}
    {% if passed %}
        M118 JWP repeatability PASSED: {"%.4f"|format(spread)}mm <= {"%.4f"|format(V.accuracy_max_spread|float)}mm.
        { action_respond_info("Repeatability guidance: 0.0030mm or lower is ideal; 0.0031-0.0060mm is acceptable.") }
        {% if printer.save_variables.variables.get("use_auto_z", V.use_auto_z) %}
            { action_respond_info("NEXT - STEP 4: MEASURE THE FIXED PROBE/NOZZLE OFFSET\n\nPreparation:\n  1. REMOVE the build sheet.\n  2. Let the bed cool completely.\n  3. Unload filament; the nozzle must not ooze.\n\nThen run:\nJWP_MEASURE_PROBE_NOZZLE_OFFSET\n\nAfter it completes, reinstall the sheet and run CALIBRATE_Z.") }
        {% else %}
            { action_respond_info("NEXT: standalone-probe install path -- set Z zero with DEPLOY_PROBE, then PROBE_CALIBRATE. Run JWP_STATUS for the full picture.") }
        {% endif %}
    {% else %}
        M118 JWP repeatability FAILED: {"%.4f"|format(spread)}mm exceeds {"%.4f"|format(V.accuracy_max_spread|float)}mm. Do not use CALIBRATE_Z.
    {% endif %}

[gcode_macro JWP_MEASURE_BED_THERMAL_VARIANCE]
description: OPTIONAL diagnostic. Staged cold-to-hot single-point probe test (sheet installed); captures readings after each PROBE completes.
variable_cold_z: 0.0
variable_target_x: 0.0
variable_target_y: 0.0
variable_hot_temp: 60.0
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set x = params.X|default(V.bed_max_x|float / 2.0)|float %}
    {% set y = params.Y|default(V.bed_max_y|float / 2.0)|float %}
    {% set temp = params.BED_TEMP|default(60)|float %}
    {% if printer.heater_bed.target|float > 0.0 %}
        { action_raise_error("JWP_MEASURE_BED_THERMAL_VARIANCE must start with bed target 0 and a cold bed.") }
    {% endif %}
    M118 JWP Bed Thermal Variance: informational diagnostic only. Start with sheet installed, bed cold, and bed target 0.
    M118 JWP Bed Thermal Variance: probing X={"%.2f"|format(x)} Y={"%.2f"|format(y)} cold, then heating to {"%.1f"|format(temp)}C and probing the same point hot.
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_VARIABLE MACRO=JWP_MEASURE_BED_THERMAL_VARIANCE VARIABLE=target_x VALUE={x}
    SET_GCODE_VARIABLE MACRO=JWP_MEASURE_BED_THERMAL_VARIANCE VARIABLE=target_y VALUE={y}
    SET_GCODE_VARIABLE MACRO=JWP_MEASURE_BED_THERMAL_VARIANCE VARIABLE=hot_temp VALUE={temp}
    DEPLOY_PROBE
    G90
    G1 X{x} Y{y} F{V.xy_speed|float * 60}
    M400
    PROBE
    _JWP_BED_THERMAL_CAPTURE_COLD

[gcode_macro _JWP_BED_THERMAL_CAPTURE_COLD]
description: Internal stage: captures cold bed reading and starts heat soak
gcode:
    {% set D = printer["gcode_macro JWP_MEASURE_BED_THERMAL_VARIANCE"] %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set cold_z = printer.probe.last_z_result|float %}
    SET_GCODE_VARIABLE MACRO=JWP_MEASURE_BED_THERMAL_VARIANCE VARIABLE=cold_z VALUE={cold_z}
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M140 S{D.hot_temp|float}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={D.hot_temp|float}
    G4 P60000
    G1 X{D.target_x|float} Y{D.target_y|float} F{V.xy_speed|float * 60}
    M400
    PROBE
    _JWP_BED_THERMAL_CAPTURE_HOT

[gcode_macro _JWP_BED_THERMAL_CAPTURE_HOT]
description: Internal stage: reports completed hot bed reading
gcode:
    {% set D = printer["gcode_macro JWP_MEASURE_BED_THERMAL_VARIANCE"] %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set hot_z = printer.probe.last_z_result|float %}
    {% set variance = hot_z - D.cold_z|float %}
    G90
    G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
    M400
    RETRACT_PROBE
    M118 JWP Bed Thermal Variance: cold={"%.4f"|format(D.cold_z|float)}mm, hot={"%.4f"|format(hot_z)}mm, delta={"%.4f"|format(variance)}mm.

[gcode_macro JWP_MESH_THERMAL_VARIANCE_REPORT]
description: OPTIONAL mesh diagnostic. Run one explicit stage at a time: STAGE=bare_cold, sheet_cold, bare_hot, or sheet_hot. This prevents unattended sheet changes.
gcode:
    {% set stage = params.STAGE|default("")|lower %}
    {% set temp = params.BED_TEMP|default(60)|float %}
    {% if printer["configfile"].settings.get("bed_mesh") is none %}
        { action_raise_error("JWP_MESH_THERMAL_VARIANCE_REPORT requires a configured [bed_mesh] section.") }
    {% endif %}
    {% if stage not in ["bare_cold", "sheet_cold", "bare_hot", "sheet_hot"] %}
        { action_raise_error("Use exactly one stage: STAGE=bare_cold, sheet_cold, bare_hot, or sheet_hot. Change the removable sheet only while the printer is idle.") }
    {% endif %}
    {% if "cold" in stage and printer.heater_bed.target|float > 0.0 %}
        { action_raise_error("Cold mesh stages require bed target 0 and a cooled bed.") }
    {% endif %}
    {% if "hot" in stage %}
        M140 S{temp}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={temp}
        G4 P60000
    {% endif %}
    {% if stage == "bare_cold" %}
        M118 JWP mesh diagnostic bare_cold: informational only. REMOVE sheet, bed cold, bed target 0.
    {% elif stage == "sheet_cold" %}
        M118 JWP mesh diagnostic sheet_cold: informational only. INSTALL sheet, bed cold, bed target 0.
    {% elif stage == "bare_hot" %}
        M118 JWP mesh diagnostic bare_hot: informational only. REMOVE sheet, bed heated/soaked to {"%.1f"|format(temp)}C.
    {% elif stage == "sheet_hot" %}
        M118 JWP mesh diagnostic sheet_hot: informational only. INSTALL sheet, bed heated/soaked to {"%.1f"|format(temp)}C.
    {% endif %}
    JWP_BED_MESH_CALIBRATE PROFILE=jwp_diag_{stage} ADAPTIVE=0
    M118 JWP mesh profile jwp_diag_{stage} saved. Compare all four profiles in Mainsail/Fluidd after completing the stages.

[gcode_macro JWP_DIAG_BED_THERMAL]
description: Button: optional single-point cold-to-hot bed thermal variance diagnostic at bed center.
gcode:
    JWP_MEASURE_BED_THERMAL_VARIANCE

[gcode_macro JWP_DIAG_MESH_BARE_COLD]
description: Button: optional mesh diagnostic stage, bare bed cold.
gcode:
    JWP_MESH_THERMAL_VARIANCE_REPORT STAGE=bare_cold

[gcode_macro JWP_DIAG_MESH_SHEET_COLD]
description: Button: optional mesh diagnostic stage, sheet installed cold.
gcode:
    JWP_MESH_THERMAL_VARIANCE_REPORT STAGE=sheet_cold

[gcode_macro JWP_DIAG_MESH_BARE_HOT]
description: Button: optional mesh diagnostic stage, bare bed hot at default 60C.
gcode:
    JWP_MESH_THERMAL_VARIANCE_REPORT STAGE=bare_hot

[gcode_macro JWP_DIAG_MESH_SHEET_HOT]
description: Button: optional mesh diagnostic stage, sheet installed hot at default 60C.
gcode:
    JWP_MESH_THERMAL_VARIANCE_REPORT STAGE=sheet_hot
