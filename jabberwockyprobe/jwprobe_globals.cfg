# =====================================================================
# JABBERWOCKY PROBE 2.0 — RUNTIME GLOBALS & CENTRAL REGISTER
# =====================================================================

[gcode_macro JWProbe_Variables]
description: Master tracking registry and velocity controller for the Jabberwocky Probe engine

# --- USER HARDWARE & CALIBRATION INTELLIGENCE TOGGLES ---
variable_use_auto_z:            True
variable_use_gantry_leveling:    True
variable_use_bed_mesh:           True
variable_use_adaptive_mesh:      True  ; auto-shrink bed mesh to the current print's objects when [exclude_object] is configured and the slicer defined objects; gracefully falls back to a full mesh otherwise
variable_adaptive_mesh_margin_mm: 0.0  ; extra margin (mm) around print objects for adaptive mesh; 0 = use [bed_mesh] adaptive_margin from printer.cfg
variable_repeat_print_fast_enabled: False
variable_repeat_print_trust_window_s: 900
variable_repeat_print_sanity_max_delta: 0.050
variable_bypass_mode:         "Auto"  ; "Auto" = Intelligent Delta, "Always" = Force Calibration
variable_accuracy_mode_enabled: True
variable_accuracy_samples:      5
variable_accuracy_max_spread:   0.006  ; install acceptance ceiling; <=0.003mm is the ideal target range
variable_accuracy_settle_ms:    250
variable_accuracy_retries:      2
variable_accuracy_screen_samples: 3  ; fast coarse batch before committing to the full verify batch (JWP_TEST_REPEATABILITY)

# --- TWO-VERIFICATION AUTO-Z (§17a-i) — REPEATABILITY GATE & STORED OFFSET ---
# `probe_nozzle_z_offset` is the fixed mechanical constant between the probe
# trigger point and the nozzle tip, derived ONCE at setup time via
# JWP_MEASURE_PROBE_NOZZLE_OFFSET (bare bed, cold, sheet removed) and
# persisted with SAVE_VARIABLE (see jwprobe_runtime_vars.cfg) rather than stored
# here, since gcode_macro variables reset to their config default on every
# restart. Read directly from printer.save_variables.variables in any
# macro that needs it; never re-derived automatically per print.
# `repeatability_validated`/`repeatability_last_spread` are runtime mirrors
# of values persisted by JWP_CONFIRM_REPEATABILITY after the REQUIRED
# JWP_TEST_REPEATABILITY install-time step. The native PROBE_ACCURACY command
# reports the samples because Klipper/Jinja cannot safely aggregate readings
# generated later in the same macro render. These mirrors gate routing during
# the current session; persisted values gate it after restarts.
variable_repeatability_validated:    False
variable_repeatability_last_spread:  0.0
variable_last_autoz_offset:          0.0
variable_autoz_session_valid:        False
variable_autoz_max_offset:           3.0  ; hard safety limit: refuse implausible runtime Z corrections
variable_last_full_prep_time:       -999999.0
variable_last_full_prep_autoz_offset: 0.0

# --- COLLISION DETECTION (PLUNGER, MECHANICALLY LINKED TO PROBE LEVER) ---
# variable_collision_plunger_offset: measured manually at install time
# (calipers/feeler gauge) from nozzle plane to plunger tip, entered here.
# Because the plunger is mounted on the same spring lever as the probe,
# it is only physically capable of sitting at this active height while
# the probe is retracted; no live guided-touch calibration is required
# for normal setup. Accepted working range ~0.6mm - 0.8mm pending final
# mechanical validation.
variable_collision_plunger_offset: 0.7
variable_collision_check_enabled:  True
# variable_collision_sensitivity: single user-facing dial. "Low",
# "Medium", or "High". Internally resolves to a hybrid time-interval AND
# layer-interval pair; whichever threshold is reached first triggers the
# next check. If no slicer layer-change signal is present, the layer
# threshold is skipped and only the time threshold is used (graceful
# degradation, same philosophy as QGL auto-skip elsewhere in this
# framework). See jwprobe_logic.cfg _JWP_COLLISION_SENSITIVITY_MAP and
# Master Doc 2.md for the concrete Low/Medium/High -> seconds/layers table.
variable_collision_sensitivity:    "Medium"
variable_collision_confirm_touches: 3
variable_collision_confirm_required: 2  ; 2-of-3 confirmation
# --- internal bookkeeping (not user-facing) ---
variable_collision_current_layer:    0  ; updated by slicer LAYER_CHANGE hook if available; 0 = unknown/unused
variable_collision_last_check_layer: 0
variable_collision_last_check_time:  0.0
# --- reactive-trigger state (unexpected mid-print switch activity) ---
variable_collision_pending:          False  ; True while an unconfirmed reactive trigger awaits revisit/confirmation
variable_collision_pending_x:        0.0
variable_collision_pending_y:        0.0
variable_collision_pending_z:        0.0
# --- last-known in-print XY (source for the scheduled pass-by check).
# Captured every watchdog poll tick while printing (probe undeployed) --
# deliberately X/Y only, no Z, since the scheduled check must NEVER
# command Z (see _JWP_RUN_SCHEDULED_COLLISION_CHECK). valid becomes True
# only after the first capture of a given print, so a scheduled check
# can't fire against stale 0,0 data before this print's first poll tick.
variable_collision_last_known_x:     0.0
variable_collision_last_known_y:     0.0
variable_collision_last_known_valid: False

# --- PHYSICAL MECHANICAL BOUNDARIES ---
# `deploy_x_strike`/`retract_x_strike` below are FACTORY DEFAULT fallbacks
# only. The authoritative, bench-fit values are found once per physical
# build via the onboarding alignment tool (JWP_ALIGN_ACTUATION_DOCK /
# JWP_ALIGN_NUDGE / JWP_ALIGN_SAVE_POSITION in jwprobe_onboarding.cfg) and
# persisted to disk (jwprobe_runtime_vars.cfg: deploy_x_strike, retract_x_strike,
# actuation_dock_deploy_confirmed, actuation_dock_retract_confirmed).
# _EXECUTE_DEPLOY_PROBE/_EXECUTE_RETRACT_PROBE read the persisted value
# when present, falling back to these config defaults only until the
# dock has been aligned for the first time on a given build.
#
# IMPORTANT — these are NOT far-apart bed-edge positions. The actuation
# dock is a small two-tine fork (~7.73mm nominal gap between tines per
# CAD); deploy_x_strike and retract_x_strike are the two X positions
# where the pin contacts tine 1 (deploy) and tine 2 (retract) within
# that small gap, only a few mm apart from each other. The placeholders
# below are dummy near-bed-center values and MUST be replaced via
# alignment before first use — do not treat them as physically meaningful.
variable_deploy_x_strike:      100.00
variable_retract_x_strike:      92.27
variable_dock_deploy_overtravel_mm: 5.0 ; bench-confirmed (single-tine model): rough head-start distance used by MODE=RETRACT re-confirm search.
variable_align_first_install_headstart_mm: 12.0 ; first-time MODE=RETRACT search head-start above rear-center reference (e.g. 88 + 12 = 100).
variable_align_deploy_search_headstart_mm: 16.0 ; staging distance below retract_x_strike for MODE=DEPLOY search (e.g. 91 - 16 = 75).
variable_align_approach_feed_mm_min: 600 ; feed rate (mm/min) for cautious alignment staging moves.
variable_probe_strike_backoff_mm: 5.0 ; bench-confirmed (§17a-iv): back-off distance away from tine before Y retreat.
variable_deploy_overtravel_mm: 5.0 ; extra travel past first-trigger to fully seat the deployed probe.
variable_retract_overtravel_mm: 5.0 ; extra travel past first-trigger to fully lock the retracted probe.
variable_safe_clear_x:           15.0
variable_switch_y_pos:         160.0
variable_autoz_align_clearance_mm: 5.0 ; safe clearance above the JWP-probed bed Z used for close-range Auto-Z switch XY alignment (Step 2) -- the switch sits flush with the bed plane, so this height applies there too.
variable_leveling_cutter_clearance_mm: 25.0 ; minimum nozzle distance from both X-min and Y-min for generated leveling/mesh starts, preventing the front-left cutter arm from engaging.
variable_leveling_probe_inset_mm: 20.0 ; physical inset from the visually derived plate edges used for generated QGL/Z-Tilt points and bed-mesh bounds.
# --- MACHINE PROFILE (Step 0) ---
# These two are FALLBACK DEFAULTS ONLY. JWP_SETUP_WIZARD (jwprobe_profile.cfg)
# reads this machine's real stepper_x/stepper_y position_max from Klipper's
# parsed config, persists them, and rewrites these at runtime -- including on
# every restart, via the _JWP_HYDRATE_PROFILE delayed_gcode. The literals below
# are only what the framework falls back to before Step 0 has ever been run,
# and the onboarding tools refuse to move until it has.
variable_bed_max_x:             176.0
variable_bed_max_y:             190.0
# Minimum reachable X. NOT always 0.0 -- machines commonly configure a negative
# stepper_x position_min so the nozzle can reach past the bed's front-left
# origin (the bench machine reports -5.0). Clamping alignment jogs to 0.0 would
# silently refuse that part of the travel envelope. Detected by Step 0.
variable_bed_min_x:               0.0
variable_bed_min_y:               0.0
# Reduced X/Y stepper current used for all low-torque bench-fit dock motion.
# Applied by _JWP_MOTION_CURRENT MODE=LOW on any TMC driver class; the normal
# value is restored from each driver's configured run_current, never from here.
variable_probe_setup_current:     0.550
# How far past the first-contact X an alignment save is still accepted.
# Alignment must persist the first-contact point, because production motion adds
# deploy/retract overtravel on top of it. One nudge of slop is tolerated; more
# than this is rejected with the correct X reported back to the operator.
variable_align_overshoot_tolerance_mm: 1.0
variable_x_homing_pos:         123.0
variable_y_homing_pos:         188.0

# --- MOTION PARAMETERS ---
variable_xy_speed:             100
variable_z_speed:               40
variable_lift_z:                10
variable_verbose_level:            1

# --- STATE TRACKING REGISTERS ---
variable_probe_deployed:       False
variable_homing_bare_nozzle:   False
variable_setup_complete:       True

gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    { action_respond_info("=== JABBERWOCKY PROBE 2.0 VARIABLES ===") }
    { action_respond_info("Use Auto-Z: " ~ V.use_auto_z) }
    { action_respond_info("Bypass Mode: " ~ V.bypass_mode) }
    { action_respond_info("Probe Deployed: " ~ V.probe_deployed) }
    { action_respond_info("Deploy X Strike: " ~ SAVED.get("deploy_x_strike", V.deploy_x_strike)|string ~ " (confirmed: " ~ SAVED.get("actuation_dock_deploy_confirmed", False)|string ~ ")") }
    { action_respond_info("Retract X Strike: " ~ SAVED.get("retract_x_strike", V.retract_x_strike)|string ~ " (confirmed: " ~ SAVED.get("actuation_dock_retract_confirmed", False)|string ~ ")") }

# ===================================================================
# 🎛️ MAINSHELL DASHBOARD INTERACTIVE TOGGLES
# ===================================================================

[gcode_macro TOGGLE_AUTO_Z_HARDWARE]
description: Click-toggle to activate or bypass the physical Auto-Z switch hardware presence flag
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.use_auto_z %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_auto_z VALUE=False
        M118 ⚙️  MAINSAIL: AUTO-Z HARDWARE PLUGIN SWITCH DISABLED
    {% else %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_auto_z VALUE=True
        M118 ⚙️  MAINSAIL: AUTO-Z HARDWARE PLUGIN SWITCH ENABLED
    {% endif %}

[gcode_macro TOGGLE_JWP_GANTRY_LEVELING]
description: Click-toggle to include or skip optional QGL/Z-tilt leveling during JWP print prep
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.use_gantry_leveling %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_gantry_leveling VALUE=False
        M118 JWP: optional QGL/Z-tilt stage DISABLED. Print prep will skip gantry/bed tilt leveling even if configured.
    {% else %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_gantry_leveling VALUE=True
        M118 JWP: optional QGL/Z-tilt stage ENABLED. Print prep will use [quad_gantry_level] first, then [z_tilt] if QGL is absent.
    {% endif %}

[gcode_macro TOGGLE_JWP_BED_MESH]
description: Click-toggle to include or skip optional bed mesh during JWP print prep
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.use_bed_mesh %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_bed_mesh VALUE=False
        M118 JWP: optional bed mesh stage DISABLED. Print prep will skip mesh calibration/profile loading even if [bed_mesh] is configured.
    {% else %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_bed_mesh VALUE=True
        M118 JWP: optional bed mesh stage ENABLED. Print prep will use [bed_mesh] when configured.
    {% endif %}

[gcode_macro TOGGLE_JWP_ADAPTIVE_MESH]
description: Click-toggle to shrink bed mesh to the current print's objects (requires [exclude_object]) instead of always meshing the full bed
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.use_adaptive_mesh %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_adaptive_mesh VALUE=False
        M118 JWP: adaptive mesh DISABLED. Bed mesh will always cover the full configured area.
    {% else %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_adaptive_mesh VALUE=True
        M118 JWP: adaptive mesh ENABLED. Bed mesh will auto-shrink to print objects when [exclude_object] is configured and the slicer defined objects; otherwise it gracefully falls back to a full mesh.
    {% endif %}

[gcode_macro TOGGLE_JWP_REPEAT_PRINT_FAST_PATH]
description: Click-toggle for the optional repeat-print trust window that can skip QGL/mesh after a recent full prep
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.repeat_print_fast_enabled %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeat_print_fast_enabled VALUE=False
        M118 JWP: repeat-print trust window DISABLED. Full-prep decisions will not skip QGL/mesh based on recency.
    {% else %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeat_print_fast_enabled VALUE=True
        M118 JWP: repeat-print trust window ENABLED. Recent full prep may skip QGL/mesh after Auto-Z sanity check.
    {% endif %}

[gcode_macro MODE_AUTO_INTELLIGENCE]
description: Click to enforce smart kinematic delta plate checks during print preparation
gcode:
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bypass_mode VALUE='"Auto"'
    M118 🏎️  MAINSAIL: INTELLIGENT ADAPTIVE SLICING SELECTED ("AUTO")

[gcode_macro MODE_ALWAYS_CALIBRATE]
description: Click to force a comprehensive QGL/Auto-Z/Mesh cycle on every print
gcode:
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bypass_mode VALUE='"Always"'
    M118 🏎️  MAINSAIL: FORCE FRESH CALIBRATION PASS SELECTED ("ALWAYS")