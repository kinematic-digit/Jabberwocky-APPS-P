# =====================================================================
# JABBERWOCKY PROBE 2.0 — KINEMATIC ACTUATION & LOGIC ENGINE
# =====================================================================

[gcode_macro _EXECUTE_DEPLOY_PROBE]
description: High-speed transit with low-torque soft deployment strike. Confirms the pin's LIVE current state via QUERY_PROBE before committing to any motion, rather than trusting the persisted probe_deployed flag alone (the pin is a sliding armature — its real position is state-dependent, not a fixed geometric point, so it could in principle be out of sync with the software flag after a manual nudge, a restart, or an interrupted prior move).
gcode:
    {% set SAVED = printer.save_variables.variables %}
    {% if not SAVED.get("actuation_dock_deploy_confirmed", False) %}
        { action_raise_error("DEPLOY_PROBE: actuation dock has not been aligned yet. Manually raise the gantry/nozzle well clear of the bed and the Auto-Z switch pin, then run JWP_ALIGN_ACTUATION_DOCK MODE=DEPLOY Z_CLEAR=1 (see jwprobe_onboarding.cfg) before first use on a new build.") }
    {% endif %}
    QUERY_PROBE
    _EXECUTE_DEPLOY_PROBE_MOTION

[gcode_macro _EXECUTE_DEPLOY_PROBE_MOTION]
description: Internal — must run immediately after QUERY_PROBE in _EXECUTE_DEPLOY_PROBE (same same-macro Jinja-render-staleness handoff pattern used throughout jwprobe_onboarding.cfg) so it observes the pin's freshly-queried live state rather than a stale pre-query read.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set deploy_x_strike = SAVED.get("deploy_x_strike", V.deploy_x_strike)|float %}
    {% set retract_x_strike = SAVED.get("retract_x_strike", V.retract_x_strike)|float %}
    # Per the §17a Shared Switch Truth Table (pull-up + inverted pin): deployed ==
    # Untriggered, retracted == Triggered. Use this LIVE reading, not the persisted
    # probe_deployed flag, to decide whether motion is actually needed.
    {% set live_deployed = not printer.probe.last_query %}
    {% if V.probe_deployed != live_deployed %}
        { action_respond_info("JWP: probe_deployed flag (" ~ V.probe_deployed|string ~ ") did not match the live QUERY_PROBE state (deployed=" ~ live_deployed|string ~ ") -- correcting to the live state before proceeding.") }
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=probe_deployed VALUE={live_deployed}
    {% endif %}

    {% if not live_deployed %}
        {% set staging_y = V.bed_max_y|float - 30.0 %}
        {% set rear_dock_y = V.bed_max_y|float %}

        G90
        # 1. Staging move in safe free air (lift Z first if below safe lift height)
        {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z|float < V.lift_z|float %}
            G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
            M400
        {% endif %}
        G1 Y{staging_y} F15000
        M400
        G1 X{deploy_x_strike - 15.0} F15000
        M400

        M117 Deploying Jabberwocky Probe...

        # 2. Lower stepper current for safe mechanical engagement
        _JWP_MOTION_CURRENT MODE=LOW

        # 3. Enter rear dock zone axially at low current
        G1 Y{rear_dock_y} F1500
        M400

        # 4. Low-torque strike move: approach from lower X up into tine past trigger point
        {% set deploy_overtravel = V.deploy_overtravel_mm|float %}
        G1 X{deploy_x_strike + deploy_overtravel} F3000
        M400
        G4 P250

        # 5. Back off in X away from tine before Y retreat
        {% set backoff = V.probe_strike_backoff_mm|float %}
        G1 X{deploy_x_strike + deploy_overtravel - backoff} F1500
        M400

        # 6. Retreat Y axially out of rear dock zone
        G1 Y{staging_y} F15000
        M400

        # 7. Restore normal operating currents
        _JWP_MOTION_CURRENT MODE=RESTORE

        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=probe_deployed VALUE=True
    {% endif %}


[gcode_macro _EXECUTE_RETRACT_PROBE]
description: High-speed transit with low-torque soft retraction strike. Confirms the pin's LIVE current state via QUERY_PROBE before committing to any motion (see _EXECUTE_DEPLOY_PROBE for the rationale).
gcode:
    {% set SAVED = printer.save_variables.variables %}
    {% if not SAVED.get("actuation_dock_retract_confirmed", False) %}
        { action_raise_error("RETRACT_PROBE: actuation dock has not been aligned yet. Manually raise the gantry/nozzle well clear of the bed and the Auto-Z switch pin, then run JWP_ALIGN_ACTUATION_DOCK MODE=INSTALL Z_CLEAR=1 first if this is a new or reprinted dock, then MODE=RETRACT Z_CLEAR=1 (see jwprobe_onboarding.cfg) before first use on a new build.") }
    {% endif %}
    QUERY_PROBE
    _EXECUTE_RETRACT_PROBE_MOTION

[gcode_macro _EXECUTE_RETRACT_PROBE_MOTION]
description: Internal — must run immediately after QUERY_PROBE in _EXECUTE_RETRACT_PROBE (same handoff pattern as _EXECUTE_DEPLOY_PROBE_MOTION).
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set deploy_x_strike = SAVED.get("deploy_x_strike", V.deploy_x_strike)|float %}
    {% set retract_x_strike = SAVED.get("retract_x_strike", V.retract_x_strike)|float %}
    # Per the §17a truth table: retracted == Triggered (live_deployed == False means retracted).
    {% set live_deployed = not printer.probe.last_query %}
    {% if V.probe_deployed != live_deployed %}
        { action_respond_info("JWP: probe_deployed flag (" ~ V.probe_deployed|string ~ ") did not match the live QUERY_PROBE state (deployed=" ~ live_deployed|string ~ ") -- correcting to the live state before proceeding.") }
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=probe_deployed VALUE={live_deployed}
    {% endif %}

    {% if live_deployed %}
        {% set staging_y = V.bed_max_y|float - 30.0 %}
        {% set rear_dock_y = V.bed_max_y|float %}

        G90
        # 1. Staging move in safe free air (lift Z first if below safe lift height)
        {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z|float < V.lift_z|float %}
            G1 Z{V.lift_z|float} F{V.z_speed|float * 60}
            M400
        {% endif %}
        G1 Y{staging_y} F15000
        M400
        G1 X{retract_x_strike + 15.0} F15000
        M400

        M117 Retracting Jabberwocky Probe...

        # 2. Lower stepper current for safe mechanical engagement
        _JWP_MOTION_CURRENT MODE=LOW

        # 3. Enter rear dock zone axially at low current
        G1 Y{rear_dock_y} F1500
        M400

        # 4. Low-torque retraction stroke: strike tine moving X DOWN
        {% set retract_overtravel = V.retract_overtravel_mm|float %}
        G1 X{retract_x_strike - retract_overtravel} F1500
        M400
        G4 P300

        # 5. Back off in X away from tine before Y retreat
        {% set backoff = V.probe_strike_backoff_mm|float %}
        G1 X{retract_x_strike - retract_overtravel + backoff} F1500
        M400

        # 6. Retreat Y axially out of rear dock zone
        G1 Y{staging_y} F15000
        M400

        # 7. Restore normal operating currents
        _JWP_MOTION_CURRENT MODE=RESTORE

        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=probe_deployed VALUE=False
        # Only include Z in this parking move if Z is actually homed (e.g. during a
        # normal print). Bench/manual testing often only homes X/Y (G28 X Y), and
        # Klipper correctly rejects a Z move on an unhomed Z axis -- this was
        # tripping on every RETRACT_PROBE call during bench testing without a full
        # G28. XY-only parking is safe either way; Z is skipped when unhomed.
        {% if 'z' in printer.toolhead.homed_axes %}
            G1 X{V.bed_max_x|float / 2} Y{V.bed_max_y|float / 2} Z15 F15000
        {% else %}
            G1 X{V.bed_max_x|float / 2} Y{V.bed_max_y|float / 2} F15000
        {% endif %}
    {% endif %}
    M400


# =====================================================================
# COLLISION DETECTION — HYBRID TIME/LAYER SENSITIVITY DISPATCHER
# User-facing control is a single "Low"/"Medium"/"High" dial
# (variable_collision_sensitivity in jwprobe_globals.cfg). Internally
# each level maps to a time-interval AND a layer-interval; whichever
# threshold is reached first triggers the next scheduled (proactive)
# check. If no slicer layer-change hook is populating
# variable_collision_current_layer, the layer threshold is skipped and
# time alone governs — graceful degradation, matching the QGL
# auto-skip philosophy used elsewhere.
#
# Separately, every poll also performs a cheap REACTIVE read of the
# shared switch. If it reads triggered outside any known macro context
# (not deploying/retracting/calibrating, and no confirmation already
# pending), the exact current toolhead position is recorded immediately
# — this is real, unambiguous trigger data, distinct from the scheduled
# proactive check below (which passes by a recorded position on a timer
# rather than reacting to an actual live trigger).
#
# STATUS:
#   - Reactive trigger capture + M400 + revisit + 2-of-3 confirm:
#     IMPLEMENTED.
#   - Scheduled proactive pass-by check (no trigger yet, just "time/layer
#     is up, go pass by the last print spot"): IMPLEMENTED. XY-only travel
#     move (current Z held, never commanded) back over the last-known
#     in-print position, followed by a no-Z debounce read
#     (_JWP_CONFIRM_COLLISION_PASSBY). Source for "last-printed XY" is
#     toolhead.position, captured every watchdog poll tick.
# =====================================================================

[delayed_gcode JWP_COLLISION_WATCHDOG]
initial_duration: 0
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set poll_interval_sec = 5 %}

    {% if V.collision_check_enabled and printer.idle_timeout.state == "Printing" %}

        # --- REACTIVE PATH: catch an unexpected trigger between queued moves ---
        {% if not V.probe_deployed and not V.collision_pending %}
            QUERY_PROBE
            {% set switch_triggered = printer.probe.last_query %}
            {% if switch_triggered %}
                # Let any in-flight move finish before doing anything else.
                M400
                {% set pos = printer.toolhead.position %}
                SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_pending VALUE=True
                SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_pending_x VALUE={pos.x}
                SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_pending_y VALUE={pos.y}
                SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_pending_z VALUE={pos.z}
                M118 ⚠️ JWP: Unexpected collision-switch trigger recorded at X{"%.3f"|format(pos.x)} Y{"%.3f"|format(pos.y)} Z{"%.3f"|format(pos.z)}. Confirming...
                _JWP_CONFIRM_COLLISION_AT X={pos.x} Y={pos.y} Z={pos.z}
            {% endif %}
        {% endif %}

        # --- PROACTIVE PATH: scheduled time/layer interval XY pass-by check ---
        # Deliberately NEVER commands Z. The collision plunger already rides
        # at a fixed mechanical offset below the nozzle at whatever Z the
        # toolhead currently holds; since print height only ever increases,
        # by the time this fires the current Z is always at or above the Z
        # that spot was actually printed at. A plain XY travel move (no Z
        # term at all, so Klipper holds current Z) passing back over the
        # last-known print position is therefore safe under normal
        # conditions -- it only trips the switch if something is abnormally
        # protruding higher than expected there (warping/spaghetti/collision),
        # which is exactly the defect this is meant to catch.
        {% if not V.probe_deployed %}
            {% set live_pos = printer.toolhead.position %}
            SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_known_x VALUE={live_pos.x}
            SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_known_y VALUE={live_pos.y}
            SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_known_valid VALUE=True
        {% endif %}

        {% set sensitivity_map = {
            'Low':    {'seconds': 180, 'layers': 20},
            'Medium': {'seconds': 90,  'layers': 10},
            'High':   {'seconds': 30,  'layers': 3}
        } %}
        {% set cfg = sensitivity_map.get(V.collision_sensitivity, sensitivity_map['Medium']) %}

        {% set now_t = printer.toolhead.estimated_print_time|default(0.0)|float %}
        {% set elapsed_sec = now_t - (V.collision_last_check_time|float) %}

        {% set layer_now = V.collision_current_layer|int %}
        {% set layer_known = layer_now > 0 %}
        {% set elapsed_layers = layer_now - (V.collision_last_check_layer|int) %}

        {% set time_due = elapsed_sec >= cfg.seconds %}
        {% set layer_due = layer_known and (elapsed_layers >= cfg.layers) %}

        {% if time_due or layer_due %}
            SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_check_time VALUE={now_t}
            SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_check_layer VALUE={layer_now}
            _JWP_RUN_SCHEDULED_COLLISION_CHECK
        {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=JWP_COLLISION_WATCHDOG DURATION={poll_interval_sec}

[gcode_macro _JWP_CONFIRM_COLLISION_AT]
description: Revisits a recorded trigger position and performs a 2-of-3 confirmation touch sequence
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set target_x = params.X|float %}
    {% set target_y = params.Y|float %}
    {% set target_z = params.Z|float %}
    {% set touches = V.collision_confirm_touches|int %}
    {% set required = V.collision_confirm_required|int %}
    {% set safe_lift_z = V.lift_z|float %}

    # Safe Z-before-XY discipline: lift clear before any XY travel.
    {% set current_z = printer.toolhead.position.z|float %}
    {% if current_z < safe_lift_z %}
        G1 Z{safe_lift_z} F{V.z_speed|float * 60}
        M400
    {% endif %}

    G90
    G1 X{target_x} Y{target_y} F{V.xy_speed|float * 60}
    M400

    {% set confirm = namespace(count=0) %}
    {% for i in range(touches) %}
        G1 Z{target_z} F{V.z_speed|float * 60}
        M400
        QUERY_PROBE
        {% if printer.probe.last_query %}
            {% set confirm.count = confirm.count + 1 %}
        {% endif %}
        G1 Z{safe_lift_z} F{V.z_speed|float * 60}
        M400
    {% endfor %}

    M118 JWP Collision Confirm: {confirm.count}/{touches} touches triggered (required {required}).

    {% if confirm.count >= required %}
        M118 🛑 JWP: Collision CONFIRMED at X{"%.3f"|format(target_x)} Y{"%.3f"|format(target_y)}. Pausing print.
        PAUSE
    {% else %}
        M118 ✅ JWP: Collision check was a false positive (vibration/noise). Resuming normal monitoring.
    {% endif %}

    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_pending VALUE=False

[gcode_macro _JWP_RUN_SCHEDULED_COLLISION_CHECK]
description: Proactive scheduled XY pass-by check on a sensitivity-driven time/layer interval. Travels back over the last-known print XY at whatever Z the toolhead already holds (no Z motion at all -- see comment above the capture block) and reads the switch there, debouncing with repeated reads/dwells rather than Z touches.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% if V.probe_deployed %}
        # Collision plunger is mechanically retracted whenever the probe
        # is deployed; skip silently rather than false-fault.
    {% elif V.collision_pending %}
        # A reactive trigger is already pending confirmation; avoid a
        # double-dispatch of the confirm sequence.
    {% elif not V.collision_last_known_valid %}
        # No in-print position captured yet this print; nothing to pass
        # by yet. Skip silently -- the next tick will have one.
    {% else %}
        {% set x = V.collision_last_known_x|float %}
        {% set y = V.collision_last_known_y|float %}
        M118 🔎 JWP: Scheduled collision check due -- passing by last print position X{"%.3f"|format(x)} Y{"%.3f"|format(y)} (no Z change) to confirm switch is clear.
        G90
        G1 X{x} Y{y} F{V.xy_speed|float * 60}
        M400
        _JWP_CONFIRM_COLLISION_PASSBY X={x} Y={y}
    {% endif %}

[gcode_macro _JWP_CONFIRM_COLLISION_PASSBY]
description: No-Z-motion debounce confirmation for the scheduled pass-by check. Assumes the toolhead has already arrived at X/Y (current Z untouched); rereads the switch several times with a short dwell between instead of physically touching Z, since this path must never command Z.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set target_x = params.X|float %}
    {% set target_y = params.Y|float %}
    {% set touches = V.collision_confirm_touches|int %}
    {% set required = V.collision_confirm_required|int %}

    {% set confirm = namespace(count=0) %}
    {% for i in range(touches) %}
        QUERY_PROBE
        {% if printer.probe.last_query %}
            {% set confirm.count = confirm.count + 1 %}
        {% endif %}
        G4 P200
    {% endfor %}

    M118 JWP Collision Pass-by Confirm: {confirm.count}/{touches} reads triggered (required {required}).

    {% if confirm.count >= required %}
        M118 🛑 JWP: Collision CONFIRMED near X{"%.3f"|format(target_x)} Y{"%.3f"|format(target_y)}. Pausing print.
        PAUSE
    {% else %}
        M118 ✅ JWP: Collision check was a false positive (vibration/noise). Resuming normal monitoring.
    {% endif %}

# =====================================================================
# PRINT-PREP ROUTING
# Auto-Z runs first, then the full QGL/Z-Tilt + Bed Mesh path runs by
# default. Probe repeatability is a prerequisite for trusting Auto-Z;
# it is NOT evidence that the gantry is still level or the bed mesh is
# still current, so it must never independently skip those operations.
# The only QGL/mesh skip is the explicit repeat-print fast path in
# _JWP_FULL_PREP_AFTER_AUTOZ, gated by its user toggle, trust window,
# and measured Auto-Z delta.
# =====================================================================
[gcode_macro JWP_PRINT_PREP]
description: Public print-start entry point for JWP intelligent prep routing.
gcode:
    # Fresh print: any last-known XY captured by the collision watchdog
    # during a prior print is now stale. Clear the valid flag so the
    # scheduled pass-by check can't fire against it before this print's
    # first poll tick recaptures a real in-print position.
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=collision_last_known_valid VALUE=False
    _PROCESS_INTELLIGENT_DECISION

[gcode_macro _PROCESS_INTELLIGENT_DECISION]
description: Runs Auto-Z followed by full leveling/mesh; only the explicitly enabled repeat-print fast path may skip fresh QGL/mesh.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set force_full = (V.bypass_mode == "Always") %}
    {% if V.repeat_print_fast_enabled and not force_full %}
        M118 JWP Print Prep: Auto-Z will decide whether the enabled repeat-print trust window can skip fresh QGL/mesh.
    {% else %}
        M118 JWP Print Prep: FULL Auto-Z + leveling + mesh path (repeat-print fast path disabled or bypassed).
    {% endif %}
    {% if V.use_auto_z %}
        CALIBRATE_Z CONTINUE_FULL_PREP=1 CONTINUE_FORCE_FULL={1 if force_full else 0}
    {% else %}
        M118 JWP: use_auto_z disabled — skipping CALIBRATE_Z.
        _JWP_FULL_PREP_AFTER_AUTOZ FORCE_FULL={1 if force_full else 0}
    {% endif %}

[gcode_macro _JWP_FULL_PREP_AFTER_AUTOZ]
description: Internal staged continuation after Auto-Z; applies optional repeat-print QGL/mesh skip or runs full leveling/mesh.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set force_full = params.FORCE_FULL|default(0)|int == 1 %}
    {% set has_qgl = V.use_gantry_leveling and printer["configfile"].settings.get("quad_gantry_level") is not none %}
    {% set has_z_tilt = V.use_gantry_leveling and printer["configfile"].settings.get("z_tilt") is not none %}
    {% set has_bed_mesh = V.use_bed_mesh and printer["configfile"].settings.get("bed_mesh") is not none %}
    {% set now = printer.toolhead.estimated_print_time|float %}
    {% set last_time = V.last_full_prep_time|float %}
    {% set elapsed = now - last_time %}
    {% set current_offset = params.AUTOZ_OFFSET|default(V.last_autoz_offset)|float %}
    {% set previous_offset = V.last_full_prep_autoz_offset|float %}
    {% set offset_delta = current_offset - previous_offset %}
    {% if offset_delta < 0 %}
        {% set offset_delta = 0.0 - offset_delta %}
    {% endif %}
    {% set repeat_window_valid = (last_time >= 0.0 and elapsed >= 0.0 and elapsed <= V.repeat_print_trust_window_s|float) %}
    {% set sanity_ok = (V.use_auto_z and offset_delta <= V.repeat_print_sanity_max_delta|float) %}
    {% set can_skip_level_mesh = V.repeat_print_fast_enabled and not force_full and repeat_window_valid and sanity_ok %}

    {% if can_skip_level_mesh %}
        M118 JWP Repeat Print Fast Path: recent full prep {"%.0f"|format(elapsed)}s ago and Auto-Z delta {"%.4f"|format(offset_delta)}mm <= {"%.4f"|format(V.repeat_print_sanity_max_delta|float)}mm. Skipping QGL/Z-tilt and fresh mesh.
        {% if has_bed_mesh %}
            BED_MESH_PROFILE LOAD=default
        {% elif not V.use_bed_mesh %}
            M118 JWP: optional bed mesh disabled by TOGGLE_JWP_BED_MESH — skipping mesh profile load.
        {% else %}
            M118 JWP: [bed_mesh] not configured — skipping mesh profile load (graceful auto-skip).
        {% endif %}
    {% else %}
        {% if V.repeat_print_fast_enabled and force_full %}
            M118 JWP Repeat Print Fast Path: bypass_mode=Always requested — running full QGL/Z-tilt/mesh.
        {% elif V.repeat_print_fast_enabled and not repeat_window_valid %}
            M118 JWP Repeat Print Fast Path: no recent trusted full prep within {"%.0f"|format(V.repeat_print_trust_window_s|float)}s — running full QGL/Z-tilt/mesh.
        {% elif V.repeat_print_fast_enabled and not sanity_ok %}
            M118 JWP Repeat Print Fast Path: Auto-Z sanity delta {"%.4f"|format(offset_delta)}mm exceeds {"%.4f"|format(V.repeat_print_sanity_max_delta|float)}mm, or Auto-Z is disabled — running full QGL/Z-tilt/mesh.
        {% endif %}
        _JWP_RUN_FULL_LEVEL_MESH
        _JWP_RECORD_FULL_PREP_STATE
    {% endif %}

[gcode_macro _JWP_RUN_FULL_LEVEL_MESH]
description: Internal full optional gantry/bed leveling and mesh pass with graceful skips.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set has_qgl = V.use_gantry_leveling and printer["configfile"].settings.get("quad_gantry_level") is not none %}
    {% set has_z_tilt = V.use_gantry_leveling and printer["configfile"].settings.get("z_tilt") is not none %}
    {% set has_bed_mesh = V.use_bed_mesh and printer["configfile"].settings.get("bed_mesh") is not none %}
    {% if has_qgl %}
        JWP_SMART_QGL
    {% elif has_z_tilt %}
        JWP_Z_TILT_ADJUST
    {% elif not V.use_gantry_leveling %}
        M118 JWP: optional gantry/bed tilt leveling disabled by TOGGLE_JWP_GANTRY_LEVELING — skipping.
    {% else %}
        M118 JWP: no [quad_gantry_level] or [z_tilt] configured — skipping gantry/bed tilt leveling (graceful auto-skip).
    {% endif %}
    {% if has_bed_mesh %}
        JWP_BED_MESH_CALIBRATE
    {% elif not V.use_bed_mesh %}
        M118 JWP: optional bed mesh disabled by TOGGLE_JWP_BED_MESH — skipping.
    {% else %}
        M118 JWP: [bed_mesh] not configured — skipping bed mesh (graceful auto-skip).
    {% endif %}

[gcode_macro _JWP_RECORD_FULL_PREP_STATE]
description: Internal record of the latest trusted full QGL/Z-tilt/mesh prep for repeat-print fast path.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set now = printer.toolhead.estimated_print_time|float %}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=last_full_prep_time VALUE={now}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=last_full_prep_autoz_offset VALUE={V.last_autoz_offset|float}
    M118 JWP: recorded trusted full prep state for repeat-print fast path at t={"%.0f"|format(now)}s, Auto-Z offset={"%.4f"|format(V.last_autoz_offset|float)}mm.

# =====================================================================
# STANDALONE-SAFE LEVELING & MESH WRAPPERS
# These are intentionally JWP-prefixed instead of rename_existing overrides.
# Klipper errors at config load if rename_existing targets a command that does
# not exist, so unconditional QUAD_GANTRY_LEVEL/BED_MESH_CALIBRATE overrides
# cannot be shipped in a standalone framework.
# =====================================================================
[gcode_macro JWP_QUAD_GANTRY_LEVEL]
description: Run native QUAD_GANTRY_LEVEL with automatic probe deployment/retraction; gracefully skips when [quad_gantry_level] is absent.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set has_qgl = printer["configfile"].settings.get("quad_gantry_level") is not none %}
    {% set was_deployed = V.probe_deployed %}
    {% if not has_qgl %}
        M118 JWP: [quad_gantry_level] not configured — skipping QGL.
    {% else %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        # See jwprobe_bed_mesh.cfg for why DEPLOY_PROBE is always called
        # here rather than gated on the possibly-stale was_deployed flag.
        DEPLOY_PROBE
        QUAD_GANTRY_LEVEL {rawparams}
        {% if not was_deployed %}
            RETRACT_PROBE
        {% endif %}
    {% endif %}

[gcode_macro JWP_SMART_QGL]
description: Two-pass QGL wrapper: coarse settling pass followed by native/fine QUAD_GANTRY_LEVEL settings.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set has_qgl = printer["configfile"].settings.get("quad_gantry_level") is not none %}
    {% set was_deployed = V.probe_deployed %}
    {% set coarse_retries = params.COARSE_RETRIES|default(3)|int %}
    {% set coarse_tolerance = params.COARSE_TOLERANCE|default(0.0500)|float %}
    {% if not has_qgl %}
        M118 JWP: [quad_gantry_level] not configured — skipping smart QGL.
    {% else %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        # See jwprobe_bed_mesh.cfg for why DEPLOY_PROBE is always called
        # here rather than gated on the possibly-stale was_deployed flag.
        DEPLOY_PROBE
        M118 JWP Smart QGL: coarse pass (RETRIES={coarse_retries}, RETRY_TOLERANCE={"%.4f"|format(coarse_tolerance)}).
        QUAD_GANTRY_LEVEL RETRIES={coarse_retries} RETRY_TOLERANCE={coarse_tolerance}
        M118 JWP Smart QGL: fine pass using native/final QGL settings.
        QUAD_GANTRY_LEVEL
        {% if not was_deployed %}
            RETRACT_PROBE
        {% endif %}
    {% endif %}

