[gcode_macro JWP_BED_MESH_CALIBRATE]
description: Run native BED_MESH_CALIBRATE with automatic probe deployment/retraction and automatic adaptive meshing; gracefully skips when [bed_mesh] is absent.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set has_bed_mesh = printer["configfile"].settings.get("bed_mesh") is not none %}
    {% set has_exclude_object = printer["configfile"].settings.get("exclude_object") is not none %}
    {% set caller_set_adaptive = params.ADAPTIVE is defined %}
    {% set caller_set_bounds = params.MESH_MIN is defined or params.MESH_MAX is defined %}
    {% set was_deployed = V.probe_deployed %}
    {% if not has_bed_mesh %}
        M118 JWP: [bed_mesh] not configured — skipping bed mesh.
    {% else %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        # See jwprobe_bed_mesh.cfg for why DEPLOY_PROBE is always called
        # here rather than gated on the possibly-stale was_deployed flag.
        DEPLOY_PROBE
        {% if V.use_adaptive_mesh and has_exclude_object and not caller_set_adaptive and not caller_set_bounds %}
            # Native Klipper adaptive meshing (requires [exclude_object] and
            # slicer-issued EXCLUDE_OBJECT_DEFINE commands before this runs).
            # It shrinks the mesh to the actual print objects on its own and
            # gracefully falls back to a full mesh if no objects are defined
            # yet (e.g. manual/idle runs), so this is always safe to send.
            {% if V.adaptive_mesh_margin_mm|float > 0.0 %}
                BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={V.adaptive_mesh_margin_mm|float} {rawparams}
            {% else %}
                BED_MESH_CALIBRATE ADAPTIVE=1 {rawparams}
            {% endif %}
        {% else %}
            BED_MESH_CALIBRATE {rawparams}
        {% endif %}
        {% if not was_deployed %}
            RETRACT_PROBE
        {% endif %}
    {% endif %}
