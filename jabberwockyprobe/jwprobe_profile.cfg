# =====================================================================
# JABBERWOCKY PROBE 2.0 — STEP 0: MACHINE PROFILE & PORTABILITY LAYER
# =====================================================================
# WHY THIS FILE EXISTS
#
# Everything downstream of here (dock alignment, repeatability, Auto-Z)
# assumes it already knows the machine. Before this file existed those
# assumptions were hard-coded to the bench machine (an LDO Micron 180+
# with TMC5160 drivers), which meant:
#
#   * `printer.configfile.settings['tmc5160 stepper_x']` raised a hard
#     Jinja error on ANY build using TMC2209/2130/2240/etc — the single
#     most common failure mode for a non-bench user, and it surfaced as
#     an opaque template error rather than an actionable message.
#   * `bed_max_x`/`bed_max_y` were static 176/190 literals in
#     jwprobe_globals.cfg; on a larger frame every "safe" staging and
#     rear-dock coordinate silently pointed at the wrong place.
#   * Nothing checked kinematics at all, even though the entire
#     actuation model (a fixed rear tine struck by X travel at
#     Y=bed_max_y) presumes a gantry that can reach rear-center with
#     independent X/Y travel.
#
# Step 0 resolves all of that by DETECTING the machine from Klipper's
# own parsed config rather than asking the user to transcribe values
# into a config file by hand, then persisting the result so it survives
# restarts AND survives this framework being updated/reinstalled.
#
# TERMINOLOGY: "profile" here means the detected machine description
# (kinematics, travel limits, driver class, probe wiring) — it is not a
# printer.cfg profile or a slicer profile.
#
# ---------------------------------------------------------------------
# PERSISTENCE MODEL (and why there is a delayed_gcode)
# ---------------------------------------------------------------------
# gcode_macro variables reset to their config-file defaults on every
# Klipper restart, so they cannot by themselves hold a per-build value.
# save_variables persists across restarts but is only written by an
# explicit SAVE_VARIABLE call.
#
# The pattern used here (and the reason _JWP_HYDRATE_PROFILE exists) is:
#   1. JWP_SETUP_WIZARD detects the machine and SAVE_VARIABLEs it.
#   2. On every subsequent startup, the _JWP_HYDRATE_PROFILE
#      delayed_gcode copies those persisted values back into
#      JWProbe_Variables.
#
# The payoff is that every existing `V.bed_max_x` / `V.bed_max_y` read
# throughout the framework keeps working verbatim, but now resolves to
# the detected per-build value instead of a bench literal — and updating
# or reinstalling the framework's .cfg files never destroys a user's
# calibration, because the authoritative copy lives in save_variables on
# the printer, not in these files.
# =====================================================================

[gcode_macro _JWP_MOTION_CURRENT]
description: Internal — sets X/Y stepper current for low-torque bench-fit motion (MODE=LOW) or restores the configured run_current (MODE=RESTORE), on ANY TMC driver class. Replaces the former hard-coded `printer.configfile.settings['tmc5160 stepper_x']` lookups, which raised an unrecoverable Jinja error on every non-TMC5160 build. Detection is done inline on each call rather than cached, because the answer is derived from printer.configfile (always available, never stale) and caching it would reintroduce a restart-ordering dependency for no benefit.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set MODE = params.MODE|default("LOW")|upper %}
    {% set cfg = printer.configfile.settings %}
    {% set ns = namespace(drv_x="", drv_y="") %}
    {% for d in ["tmc2209", "tmc2208", "tmc2130", "tmc2240", "tmc5160", "tmc2660", "tmc2225", "tmc2226"] %}
        {% if (d ~ " stepper_x") in cfg %}
            {% set ns.drv_x = d %}
        {% endif %}
        {% if (d ~ " stepper_y") in cfg %}
            {% set ns.drv_y = d %}
        {% endif %}
    {% endfor %}

    {% if MODE == "LOW" %}
        {% if ns.drv_x == "" or ns.drv_y == "" %}
            # No TMC driver section found for stepper_x and/or stepper_y.
            # This is legitimate (e.g. standalone//step-dir drivers), so it is
            # NOT an error -- but current cannot be lowered, and the operator
            # must know that the dock strike will occur at full torque.
            { action_respond_info("JWP: no TMC driver section detected for stepper_x/stepper_y -- skipping the low-torque current reduction. Dock strikes will run at FULL stepper torque. Verify your dock and probe pin can tolerate this before continuing.") }
        {% else %}
            SET_TMC_CURRENT STEPPER=stepper_x CURRENT={V.probe_setup_current|float}
            SET_TMC_CURRENT STEPPER=stepper_y CURRENT={V.probe_setup_current|float}
            G4 P100
        {% endif %}
    {% else %}
        {% if ns.drv_x != "" and ns.drv_y != "" %}
            SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg[ns.drv_x ~ " stepper_x"].run_current|float}
            SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg[ns.drv_y ~ " stepper_y"].run_current|float}
            G4 P100
        {% endif %}
    {% endif %}


[gcode_macro JWP_SETUP_WIZARD]
description: ONBOARDING STEP 0 (run first, before dock alignment). Detects this machine's kinematics, travel limits, stepper driver class, and probe wiring from Klipper's own parsed config, validates them against JWP's mechanical requirements, and persists the result. Moves no axes.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set cfg = printer.configfile.settings %}
    {% set kinematics = cfg.printer.kinematics %}
    {% set det_max_x = cfg.stepper_x.position_max|float %}
    {% set det_max_y = cfg.stepper_y.position_max|float %}
    {% set det_min_x = cfg.stepper_x.position_min|default(0.0)|float %}
    {% set det_min_y = cfg.stepper_y.position_min|default(0.0)|float %}
    {% set autoz = params.AUTOZ|default(1)|int %}
    {% set SAVED_PREV = printer.save_variables.variables %}

    {% set ns = namespace(drv="") %}
    {% for d in ["tmc2209", "tmc2208", "tmc2130", "tmc2240", "tmc5160", "tmc2660", "tmc2225", "tmc2226"] %}
        {% if (d ~ " stepper_x") in cfg %}
            {% set ns.drv = d %}
        {% endif %}
    {% endfor %}

    { action_respond_info("==================================================\nJWP ONBOARDING - STEP 0: MACHINE PROFILE\n==================================================") }
    { action_respond_info("Kinematics:     " ~ kinematics) }
    { action_respond_info("X travel:       " ~ det_min_x|string ~ " to " ~ det_max_x|string ~ " mm") }
    { action_respond_info("Y travel:       " ~ det_min_y|string ~ " to " ~ det_max_y|string ~ " mm") }
    { action_respond_info("X/Y driver:     " ~ (ns.drv if ns.drv != "" else "none detected (no TMC section)")) }
    { action_respond_info("Probe pin:      " ~ cfg.probe.pin) }
    { action_respond_info("Probe X offset: " ~ cfg.probe.x_offset|string ~ " mm") }
    { action_respond_info("Probe Y offset: " ~ cfg.probe.y_offset|string ~ " mm") }

    # --- Kinematics gate -------------------------------------------------
    # JWP's actuation model requires the toolhead to reach rear-center
    # (X = bed_max_x/2, Y = bed_max_y) and then traverse X independently
    # while parked there. CoreXY and Cartesian both satisfy this.
    # CoreXZ (Voron Switchwire and similar) does not: its Y axis is the
    # moving BED, so "park at rear Y and sweep X" does not place the
    # toolhead against a frame-mounted rear tine at all. That is a
    # mechanical redesign, not a tuning value, so it is refused outright
    # rather than allowed to proceed into a guaranteed collision.
    {% if kinematics not in ["corexy", "cartesian"] %}
        { action_raise_error("JWP_SETUP_WIZARD: kinematics '" ~ kinematics ~ "' is not supported by the current actuation-dock design. JWP requires a frame-mounted rear tine that the toolhead can strike by traversing X while parked at rear Y -- this holds for corexy and cartesian. On bed-slinger-style Y (corexz, e.g. Voron Switchwire) the rear tine cannot be reached this way and the dock requires a mechanical redesign. Do not continue onboarding on this machine.") }
    {% endif %}

    # --- Probe Y offset sanity gate --------------------------------------
    # The probe sits FORWARD of the nozzle by probe.y_offset. When the
    # nozzle is parked at Y=bed_max_y for a dock strike, the probe body is
    # at bed_max_y - y_offset. A zero/negative offset means the probe is at
    # or behind the nozzle, which the rear-approach choreography was never
    # designed for.
    {% if cfg.probe.y_offset|float <= 0.0 %}
        { action_respond_info("JWP WARNING: probe y_offset is " ~ cfg.probe.y_offset|string ~ "mm (expected a positive value placing the probe FORWARD of the nozzle). The rear-dock approach assumes a forward-mounted probe; verify clearance manually before running dock alignment.") }
    {% endif %}

    # --- Rear reachability gate ------------------------------------------
    # Dock alignment stages at bed_max_y - 30 and strikes at bed_max_y, so
    # the machine needs at least that much Y travel to execute the
    # choreography at all.
    {% if det_max_y < 60.0 %}
        { action_raise_error("JWP_SETUP_WIZARD: detected Y travel (" ~ det_max_y|string ~ "mm) is too small for the dock approach choreography, which stages at (bed_max_y - 30) and strikes at bed_max_y. At least 60mm of Y travel is required.") }
    {% endif %}

    SAVE_VARIABLE VARIABLE=bed_min_x VALUE={det_min_x}
    SAVE_VARIABLE VARIABLE=bed_min_y VALUE={det_min_y}
    SAVE_VARIABLE VARIABLE=bed_max_x VALUE={det_max_x}
    SAVE_VARIABLE VARIABLE=bed_max_y VALUE={det_max_y}
    SAVE_VARIABLE VARIABLE=kinematics VALUE='"{kinematics}"'
    SAVE_VARIABLE VARIABLE=use_auto_z VALUE={'True' if autoz == 1 else 'False'}
    SAVE_VARIABLE VARIABLE=profile_confirmed VALUE=True

    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_min_x VALUE={det_min_x}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_min_y VALUE={det_min_y}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_max_x VALUE={det_max_x}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_max_y VALUE={det_max_y}
    SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_auto_z VALUE={'True' if autoz == 1 else 'False'}

    { action_respond_info("PROFILE SAVED\nTravel limits now come from this machine's Klipper configuration.\nJWP will not use its built-in reference-machine limits.") }

    # If the dock was already aligned under DIFFERENT travel limits, the saved
    # strike points were found at a rear-dock Y that has now moved. The strike
    # is made in X, but the Y approach depth determines whether the pin engages
    # the tine at all, so silently carrying the old values forward is unsafe.
    {% set prev_max_y = SAVED_PREV.get("bed_max_y", det_max_y)|float %}
    {% set prev_max_x = SAVED_PREV.get("bed_max_x", det_max_x)|float %}
    {% set prev_min_y = SAVED_PREV.get("bed_min_y", det_min_y)|float %}
    {% set prev_min_x = SAVED_PREV.get("bed_min_x", det_min_x)|float %}
    {% if SAVED_PREV.get("actuation_dock_retract_confirmed", False) or SAVED_PREV.get("actuation_dock_deploy_confirmed", False) %}
        {% if (prev_max_y - det_max_y)|abs > 0.001 or (prev_max_x - det_max_x)|abs > 0.001 %}
            { action_respond_info("JWP WARNING: this dock was aligned when JWP believed the travel limits were " ~ prev_max_x|string ~ " x " ~ prev_max_y|string ~ ", but this machine reports " ~ det_max_x|string ~ " x " ~ det_max_y|string ~ ".") }
            { action_respond_info("The rear-dock approach Y and rear-center X have both shifted, so the saved strike points may no longer engage the tine. Re-run Step 1 (JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT Z_CLEAR=1) and re-confirm both sides before using DEPLOY_PROBE/RETRACT_PROBE.") }
        {% endif %}
    {% endif %}
    {% if SAVED_PREV.get("leveling_bed_envelope_confirmed", False) %}
        {% if (prev_min_x - det_min_x)|abs > 0.001 or (prev_max_x - det_max_x)|abs > 0.001 or (prev_min_y - det_min_y)|abs > 0.001 or (prev_max_y - det_max_y)|abs > 0.001 %}
            SAVE_VARIABLE VARIABLE=leveling_bed_envelope_confirmed VALUE=False
            { action_respond_info("JWP WARNING: machine travel limits changed, so the saved visual bed envelope was invalidated. After Z calibration, re-run JWP_ALIGN_BED_ENVELOPE before generating native leveling/mesh coordinates.") }
        {% endif %}
    {% endif %}
    {% set tine_installed = SAVED_PREV.get("actuation_dock_tine_installed", False) %}
    {% set dock_confirmed = SAVED_PREV.get("actuation_dock_retract_confirmed", False) and SAVED_PREV.get("actuation_dock_deploy_confirmed", False) %}
    {% set switch_confirmed = SAVED_PREV.get("autoz_switch_confirmed", False) %}
    {% set repeat_ok = SAVED_PREV.get("repeatability_validated", False) and SAVED_PREV.get("repeatability_last_spread", 999.0)|float <= V.accuracy_max_spread|float %}
    {% set offset_ok = SAVED_PREV.get("probe_nozzle_z_offset", 0.0)|float != 0.0 and SAVED_PREV.get("probe_nozzle_offset_capture_version", 0)|int >= 2 %}
    {% set envelope_ok = SAVED_PREV.get("leveling_bed_envelope_confirmed", False) %}
    {% if SAVED_PREV.get("repeatability_validated", False) and not repeat_ok %}
        SAVE_VARIABLE VARIABLE=repeatability_validated VALUE=False
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeatability_validated VALUE=False
        { action_respond_info("REPEATABILITY RECHECK REQUIRED\nThe saved spread of " ~ "%.4f"|format(SAVED_PREV.get("repeatability_last_spread", 0.0)|float) ~ "mm exceeds the current 0.0060mm acceptance ceiling.\nRun JWP_TEST_REPEATABILITY and confirm the new exact range.") }
    {% endif %}

    {% if autoz == 1 %}
        { action_respond_info("INSTALL PATH: PROBE + AUTO-Z\nRequired command sequence:\n  Step 2: locate and verify the frame Z switch.\n  Step 3: test and confirm probe repeatability.\n  Step 4: measure the one-time probe/nozzle offset.\n  Step 5: run CALIBRATE_Z, then visually verify the installed bed corners.") }
    {% else %}
        { action_respond_info("Install path: STANDALONE PROBE. Auto-Z macros stay disabled; Z zero comes from PROBE_CALIBRATE instead.") }
    {% endif %}

    # NEXT guidance is conditional on what this machine has actually already
    # confirmed (tine install + strikes, frame Z switch location,
    # repeatability) -- it always points at the one real next action instead
    # of blindly repeating Step 1 regardless of progress already made.
    {% if not dock_confirmed %}
        { action_respond_info("==================================================\n!!! SAFETY ACTION REQUIRED BEFORE STEP 1 !!!\n==================================================\nCreate at least 20mm of physical clearance between the nozzle/probe and the bed.\n\nMoving gantry:\n  Manually RAISE the gantry/nozzle.\n\nMoving bed Z (for example, Trident):\n  Manually LOWER the bed.\n\nAlso clear the nozzle and probe from the Auto-Z switch pin.\nDo this BEFORE typing the dock-scan command.\nJWP will move X/Y only; it will NOT home or move Z.\n==================================================") }
        { action_respond_info("FIRST COMMAND - RELEASE MOTORS\nJWP_RELEASE_FOR_DOCK_CLEARANCE\n\nThis explicit command issues M84 and prints the manual-clearance instructions.\nThe wizard itself does NOT release or move any motor.") }
        {% if tine_installed %}
            { action_respond_info("AFTER CREATING CLEARANCE - STEP 1 OF 5\nJWP_AUTO_ALIGN_DOCK Z_CLEAR=1\n\nThe scan requires the motor-release handshake, checks probe state without motion, and then freshly homes X/Y.") }
        {% else %}
            { action_respond_info("AFTER CREATING CLEARANCE - STEP 1 OF 5\nJWP_AUTO_ALIGN_DOCK Z_CLEAR=1\n\nThe scan requires the motor-release handshake, checks probe state without motion, and then freshly homes X/Y.") }
            { action_respond_info("MANUAL ALTERNATIVE\nJWP_ALIGN_ACTUATION_DOCK MODE=INSTALL Z_CLEAR=1") }
        {% endif %}
    {% elif autoz == 1 and not switch_confirmed %}
        { action_respond_info("Step 1 of 5: DONE (dock alignment confirmed).") }
        # Step 2 is now a pure XY park/jog + a real G28 Z verify -- no
        # force_move/SET_KINEMATIC_POSITION involved at all, so there is
        # nothing to check/report before pointing at the next command.
        {% set switch_saved = SAVED_PREV.get("autoz_switch_x") is not none and SAVED_PREV.get("autoz_switch_y") is not none %}
        {% if switch_saved %}
            { action_respond_info("STEP 2 - AUTO-Z SWITCH\nA location is saved but not physically confirmed.\n\nNEXT COMMAND\nJWP_VERIFY_AUTOZ_SWITCH_LOCATION\n\nThis runs a real G28 Z at the saved XY and marks Step 2 complete only if the switch triggers.") }
        {% else %}
            { action_respond_info("STEP 2 - AUTO-Z SWITCH\n\nVisual alignment path:\n  1. JWP_ALIGN_AUTOZ_SWITCH\n  2. JWP_ALIGN_SWITCH_NUDGE X=<mm> Y=<mm>  (repeat as needed)\n  3. JWP_SAVE_AUTOZ_SWITCH_LOCATION\n  4. JWP_VERIFY_AUTOZ_SWITCH_LOCATION\n\nKnown-coordinate path:\n  1. JWP_SET_AUTOZ_SWITCH_LOCATION X=<mm> Y=<mm>\n  2. JWP_VERIFY_AUTOZ_SWITCH_LOCATION") }
        {% endif %}
    {% elif not repeat_ok %}
        { action_respond_info("Step 1 of 5: DONE (dock alignment confirmed).") }
        {% if autoz == 1 %}
            { action_respond_info("Step 2 of 5: DONE (Auto-Z switch location confirmed).") }
        {% endif %}
        { action_respond_info("STEP 3 - REPEATABILITY\n  1. JWP_TEST_REPEATABILITY\n  2. Copy PROBE_ACCURACY's range value.\n  3. JWP_CONFIRM_REPEATABILITY SPREAD=<range>\n\nTarget: <=0.0030mm is ideal; <=0.0060mm passes.") }
    {% elif autoz == 1 and not offset_ok %}
        { action_respond_info("Steps 1-3: DONE.\n\nNEXT - STEP 4: PROBE/NOZZLE OFFSET\nRemove the build sheet, cool the bed, unload filament, then run:\nJWP_MEASURE_PROBE_NOZZLE_OFFSET\n\nAfter completion, reinstall the sheet and run CALIBRATE_Z.") }
    {% elif autoz == 1 and not V.autoz_session_valid %}
        { action_respond_info("Steps 1-4: DONE.\n\nNEXT - PREPARE STEP 5\nReinstall the build sheet, then run:\nCALIBRATE_Z\n\nSuccessful Auto-Z prints the exact bed-corner command.") }
    {% elif autoz == 0 and not envelope_ok %}
        { action_respond_info("Steps 1-3: DONE.\n\nNEXT - PREPARE STEP 5\nComplete the standalone Z calibration:\n  1. DEPLOY_PROBE\n  2. PROBE_CALIBRATE\n  3. ACCEPT\n  4. SAVE_CONFIG\n  5. Home all axes\n\nThen run:\nJWP_ALIGN_BED_ENVELOPE PLATE_X=<plate_width_mm> PLATE_Y=<plate_depth_mm>") }
    {% elif not envelope_ok %}
        { action_respond_info("CORE CALIBRATION COMPLETE.\n\nNEXT - STEP 5: VERIFY THE INSTALLED BED ENVELOPE\nJWP_ALIGN_BED_ENVELOPE PLATE_X=<plate_width_mm> PLATE_Y=<plate_depth_mm>\n\nExample for a 180mm x 180mm plate:\nJWP_ALIGN_BED_ENVELOPE PLATE_X=180 PLATE_Y=180") }
    {% else %}
        { action_respond_info("STEPS 1-5 COMPLETE. This machine is fully onboarded.\nNEXT: run JWP_STATUS for a health summary or proceed to PRINT_START integration.") }
    {% endif %}
    { action_respond_info("Re-run JWP_SETUP_WIZARD with AUTOZ=0 or AUTOZ=1 at any time to switch install path.") }


[delayed_gcode _JWP_HYDRATE_PROFILE]
# Runs once shortly after every Klipper start. gcode_macro variables reset
# to their config defaults on restart, so without this the framework would
# silently fall back to the built-in bench literals (176/190) after every
# restart even on a machine that had already completed Step 0.
initial_duration: 1.0
gcode:
    {% set SAVED = printer.save_variables.variables %}
    {% if SAVED.get("profile_confirmed", False) %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_min_x VALUE={SAVED.get("bed_min_x", 0.0)|float}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_min_y VALUE={SAVED.get("bed_min_y", 0.0)|float}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_max_x VALUE={SAVED.get("bed_max_x")|float}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=bed_max_y VALUE={SAVED.get("bed_max_y")|float}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=use_auto_z VALUE={SAVED.get("use_auto_z", True)}
    {% endif %}
    {% set saved_spread = SAVED.get("repeatability_last_spread", 999.0)|float %}
    {% if SAVED.get("repeatability_validated", False) and saved_spread <= printer["gcode_macro JWProbe_Variables"].accuracy_max_spread|float %}
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeatability_validated VALUE=True
        SET_GCODE_VARIABLE MACRO=JWProbe_Variables VARIABLE=repeatability_last_spread VALUE={saved_spread}
    {% endif %}


[gcode_macro JWP_CONFIG_AUDIT]
description: First-run parsed-config audit for JWP ownership conflicts, required stepper settings, and optional native leveling/mesh availability.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set C = printer["configfile"].settings %}
    {% set sx = C.get("stepper_x") %}
    {% set sy = C.get("stepper_y") %}
    {% set sz = C.get("stepper_z") %}
    {% set probe = C.get("probe") %}
    {% set extruder = C.get("extruder") %}
    {% set has_nhk = C.get("mcu nhk") is not none %}
    {% set has_qgl = C.get("quad_gantry_level") is not none %}
    {% set has_z_tilt = C.get("z_tilt") is not none %}
    {% set has_bed_mesh = C.get("bed_mesh") is not none %}
    {% set has_legacy_z_calibration = C.get("z_calibration") is not none %}
    {% set ns = namespace(drv_x="", drv_y="", drv_z="") %}
    {% for d in ["tmc2209", "tmc2208", "tmc2130", "tmc2240", "tmc5160", "tmc2660", "tmc2225", "tmc2226"] %}
        {% if (d ~ " stepper_x") in C %}{% set ns.drv_x = d %}{% endif %}
        {% if (d ~ " stepper_y") in C %}{% set ns.drv_y = d %}{% endif %}
        {% if (d ~ " stepper_z") in C %}{% set ns.drv_z = d %}{% endif %}
    {% endfor %}

    { action_respond_info("================ JWP CONFIG AUDIT ================") }
    { action_respond_info("Scope: parsed Klipper config. If Klipper fails before startup with a duplicate command error, comment the named old macro first, restart, then run this audit.") }

    {% if sx is none or sy is none or sz is none %}
        { action_respond_info("ERROR: one or more required native stepper sections are missing. Keep [stepper_x], [stepper_y], and [stepper_z] in printer.cfg; do NOT comment them out for JWP.") }
    {% else %}
        { action_respond_info("KEEP: native [stepper_x], [stepper_y], and [stepper_z] sections in the assembled Klipper configuration. JWP reads their position_min/position_max values for safe travel and dock alignment; do NOT remove these settings.") }
        { action_respond_info("Stepper X: " ~ sx.position_min|default(0.0)|string ~ " to " ~ sx.position_max|string ~ "mm; driver=" ~ (ns.drv_x if ns.drv_x != "" else "none (full configured torque during dock motion)")) }
        { action_respond_info("Stepper Y: " ~ sy.position_min|default(0.0)|string ~ " to " ~ sy.position_max|string ~ "mm; driver=" ~ (ns.drv_y if ns.drv_y != "" else "none (full configured torque during dock motion)")) }
        { action_respond_info("Stepper Z: " ~ sz.position_min|default(0.0)|string ~ " to " ~ sz.position_max|string ~ "mm; driver=" ~ (ns.drv_z if ns.drv_z != "" else "none detected")) }
    {% endif %}
    {% if probe is none %}
        { action_respond_info("ERROR: no native [probe] section is loaded. JWP requires exactly one [probe] section; configure its pin and offsets in jwprobe_hardware.cfg.") }
    {% else %}
        { action_respond_info("KEEP: exactly one parsed [probe] section is present at pin " ~ probe.pin|string ~ " (offsets: X=" ~ probe.x_offset|default(0.0)|string ~ ", Y=" ~ probe.y_offset|default(0.0)|string ~ ").") }
        {% set p_yoff = probe.y_offset|default(0.0)|float %}
        {% set p_xoff = probe.x_offset|default(0.0)|float %}
        {% set sy_min = sy.position_min|default(0.0)|float if sy is not none else 0.0 %}
        {% set sy_max = sy.position_max|float if sy is not none else 0.0 %}
        {% set sx_min = sx.position_min|default(0.0)|float if sx is not none else 0.0 %}
        {% set sx_max = sx.position_max|float if sx is not none else 0.0 %}
        {% if has_bed_mesh %}
            {% set bm = C.get("bed_mesh") %}
            {% if bm.mesh_min is defined %}
                {% set mm_y = bm.mesh_min.split(",")[1]|float %}
                {% if (mm_y - p_yoff) < sy_min %}
                    { action_respond_info("WARN: [bed_mesh] mesh_min Y=" ~ mm_y|string ~ " with probe y_offset=" ~ p_yoff|string ~ " requires nozzle Y=" ~ (mm_y - p_yoff)|string ~ " (outside Y min " ~ sy_min|string ~ "). Increase mesh_min Y to >= " ~ (sy_min + p_yoff + 2.0)|string ~ " to prevent 'Move out of range'.") }
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if extruder is none %}
        { action_respond_info("WARN: no native [extruder] section is loaded. Keep the Nitehawk or printer-owned [extruder] section; JWP does not provide extruder settings.") }
    {% else %}
        { action_respond_info("KEEP: native [extruder] section is present. JWP does not override extruder step/heater/sensor, rotation_distance, gear_ratio, pressure_advance, or temperature settings; retain the Nitehawk wiring and calibrated values.") }
    {% endif %}
    {% if has_nhk %}
        { action_respond_info("OK: Nitehawk MCU [mcu nhk] is loaded. Keep it and any Nitehawk-owned extruder/fan/LED sections; only the duplicate Nitehawk [probe] block must yield to JWP's probe definition.") }
    {% endif %}

    {% if ns.drv_x != "" and ns.drv_y != "" %}
        { action_respond_info("TMC current: JWP temporarily lowers X/Y current only during dock motion, then restores each driver's configured run_current.") }
    {% elif ns.drv_x == "" or ns.drv_y == "" %}
        { action_respond_info("NOTICE: no TMC driver sections were found for both X and Y. JWP will not change current; dock motion uses the native configured stepper torque.") }
    {% endif %}

    {% if C.get("gcode_macro attach_probe") is not none %}
        { action_respond_info("WARN: Found [gcode_macro ATTACH_PROBE]. JWP owns physical probe deployment; comment/remove this legacy wrapper unless it is unrelated to JWP.") }
    {% endif %}
    {% if C.get("gcode_macro dock_probe") is not none %}
        { action_respond_info("WARN: Found [gcode_macro DOCK_PROBE]. JWP uses DEPLOY/RETRACT terminology and owns physical probe motion; comment/remove this legacy wrapper unless it is unrelated to JWP.") }
    {% endif %}
    {% if C.get("gcode_macro undock_probe") is not none %}
        { action_respond_info("WARN: Found [gcode_macro UNDOCK_PROBE]. JWP uses DEPLOY/RETRACT terminology and owns physical probe motion; comment/remove this legacy wrapper unless it is unrelated to JWP.") }
    {% endif %}
    {% if C.get("gcode_macro quad_gantry_level") is not none %}
        { action_respond_info("WARN: Found [gcode_macro QUAD_GANTRY_LEVEL]. JWP does not override native QGL; comment/remove old deploy/retract wrappers around QGL and call JWP_SMART_QGL from print prep instead.") }
    {% endif %}
    {% if C.get("gcode_macro _quad_gantry_level") is not none %}
        { action_respond_info("WARN: Found [gcode_macro _QUAD_GANTRY_LEVEL]. This often means an old rename_existing QGL wrapper is still installed; comment/remove the old wrapper pair.") }
    {% endif %}
    {% if C.get("gcode_macro z_tilt_adjust") is not none %}
        { action_respond_info("WARN: Found [gcode_macro Z_TILT_ADJUST]. JWP does not override native Z_TILT_ADJUST; comment/remove old deploy/retract wrappers and call JWP_Z_TILT_ADJUST instead.") }
    {% endif %}
    {% if C.get("gcode_macro bed_mesh_calibrate") is not none %}
        { action_respond_info("WARN: Found [gcode_macro BED_MESH_CALIBRATE]. JWP does not override native bed mesh; comment/remove old deploy/retract wrappers and call JWP_BED_MESH_CALIBRATE instead.") }
    {% endif %}
    {% if C.get("gcode_macro _mesh_base") is not none %}
        { action_respond_info("WARN: Found [gcode_macro _MESH_BASE]. This often means an old rename_existing bed mesh wrapper is still installed; comment/remove the old wrapper pair.") }
    {% endif %}

    # Check for other probe systems in parsed Klipper config
    {% if C.get("cartographer") is not none %}
        { action_respond_info("WARN: Found active [cartographer] section. If migrating to JWP, remove/uninstall Cartographer includes/plugins and its probe calibration macros.") }
    {% endif %}
    {% if C.get("beacon") is not none %}
        { action_respond_info("WARN: Found active [beacon] section. If migrating to JWP, remove/uninstall Beacon includes/plugins and its probe calibration macros.") }
    {% endif %}
    {% if C.get("bltouch") is not none %}
        { action_respond_info("WARN: Found active [bltouch] section. If migrating to JWP, comment out [bltouch] and related deploy/stow pin configs.") }
    {% endif %}
    {% if C.get("smart_effector") is not none %}
        { action_respond_info("WARN: Found active [smart_effector] section. If migrating to JWP, comment out this probe section.") }
    {% endif %}

    {% if has_legacy_z_calibration %}
        { action_respond_info("NOTICE: Found [z_calibration]. JWP ships its own CALIBRATE_Z macro for the two-verification flow; do not keep a legacy CALIBRATE_Z provider unless you intentionally disable/replace JWP Auto-Z.") }
    {% endif %}

    {% if has_qgl %}
        { action_respond_info("OK: native [quad_gantry_level] is configured. JWP print prep will use JWP_SMART_QGL when optional gantry leveling is enabled.") }
    {% elif has_z_tilt %}
        { action_respond_info("OK: native [z_tilt] is configured and [quad_gantry_level] is absent. JWP print prep will use JWP_Z_TILT_ADJUST when optional gantry leveling is enabled.") }
    {% elif V.use_gantry_leveling %}
        { action_respond_info("OK: no native [quad_gantry_level] or [z_tilt] found. JWP will gracefully skip gantry/bed tilt leveling. After Z calibration, JWP_ALIGN_BED_ENVELOPE can derive safe probe points; physical gantry/Z-pivot coordinates still come from manufacturer/CAD.") }
    {% else %}
        { action_respond_info("OK: optional gantry/bed tilt leveling is disabled by TOGGLE_JWP_GANTRY_LEVELING.") }
    {% endif %}

    {% if has_bed_mesh and V.use_bed_mesh %}
        { action_respond_info("OK: native [bed_mesh] is configured. JWP print prep will use JWP_BED_MESH_CALIBRATE/full calibration and BED_MESH_PROFILE LOAD=default/fast prep.") }
    {% elif has_bed_mesh %}
        { action_respond_info("OK: native [bed_mesh] exists but optional bed mesh is disabled by TOGGLE_JWP_BED_MESH.") }
    {% elif V.use_bed_mesh %}
        { action_respond_info("OK: no native [bed_mesh] found. JWP will gracefully skip bed mesh. After Z calibration, JWP_ALIGN_BED_ENVELOPE can generate verified bounds; do not add an unverified dummy section.") }
    {% else %}
        { action_respond_info("OK: optional bed mesh is disabled by TOGGLE_JWP_BED_MESH.") }
    {% endif %}

    {% if V.repeat_print_fast_enabled %}
        { action_respond_info("OK: repeat-print fast path ENABLED. Trust window=" ~ V.repeat_print_trust_window_s|string ~ "s, Auto-Z sanity threshold=" ~ "%.4f"|format(V.repeat_print_sanity_max_delta|float) ~ "mm.") }
    {% else %}
        { action_respond_info("OK: repeat-print fast path DISABLED. Use TOGGLE_JWP_REPEAT_PRINT_FAST_PATH to allow recent full prep to skip QGL/mesh after Auto-Z sanity check.") }
    {% endif %}

    { action_respond_info("Ownership rule: keep native Klipper sections (bed_mesh, quad_gantry_level, z_tilt, etc.) directly in printer.cfg; remove old deploy/retract and leveling/mesh wrapper macros that duplicate JWP behavior.") }
    { action_respond_info("================================================") }


[gcode_macro JWP_STATUS]
description: Reports overall onboarding progress across all four steps, with the exact next command to run.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set profile_ok = SAVED.get("profile_confirmed", False) %}
    {% set dock_ok = SAVED.get("actuation_dock_deploy_confirmed", False) and SAVED.get("actuation_dock_retract_confirmed", False) %}
    {% set switch_ok = SAVED.get("autoz_switch_confirmed", False) %}
    {% set repeat_ok = SAVED.get("repeatability_validated", False) and SAVED.get("repeatability_last_spread", 999.0)|float <= V.accuracy_max_spread|float %}
    {% set offset_present = SAVED.get("probe_nozzle_z_offset", 0.0)|float != 0.0 %}
    {% set offset_current = SAVED.get("probe_nozzle_offset_capture_version", 0)|int >= 2 %}
    {% set offset_ok = offset_present and offset_current %}
    {% set autoz = SAVED.get("use_auto_z", V.use_auto_z) %}
    {% set has_qgl = printer["configfile"].settings.get("quad_gantry_level") is not none %}
    {% set has_z_tilt = printer["configfile"].settings.get("z_tilt") is not none %}
    {% set has_bed_mesh = printer["configfile"].settings.get("bed_mesh") is not none %}
    {% set envelope_ok = SAVED.get("leveling_bed_envelope_confirmed", False) %}

    { action_respond_info("================ JWP 2.0 STATUS ================") }
    {% if profile_ok %}
        { action_respond_info("Step 0  Machine Profile:  [DONE] " ~ SAVED.get("kinematics", "?") ~ ", bed " ~ SAVED.get("bed_max_x", "?")|string ~ " x " ~ SAVED.get("bed_max_y", "?")|string) }
    {% else %}
        { action_respond_info("Step 0  Machine Profile:  [PENDING] -> run JWP_SETUP_WIZARD") }
    {% endif %}

    {% if dock_ok %}
        { action_respond_info("Step 1  Dock Alignment:   [DONE] deploy X=" ~ SAVED.get("deploy_x_strike")|string ~ ", retract X=" ~ SAVED.get("retract_x_strike")|string) }
    {% else %}
        { action_respond_info("Step 1  Dock Alignment:   [PENDING]\nFIRST: JWP_RELEASE_FOR_DOCK_CLEARANCE\nTHEN: create at least 20mm Z clearance and deploy the probe.\nNEXT: JWP_AUTO_ALIGN_DOCK Z_CLEAR=1") }
    {% endif %}

    {% if not autoz %}
        { action_respond_info("Step 2  Auto-Z Switch:    [SKIPPED] standalone-probe install path") }
    {% elif switch_ok %}
        { action_respond_info("Step 2  Auto-Z Switch:    [DONE] X=" ~ SAVED.get("autoz_switch_x")|string ~ ", Y=" ~ SAVED.get("autoz_switch_y")|string) }
    {% else %}
        {% if SAVED.get("autoz_switch_x") is not none and SAVED.get("autoz_switch_y") is not none %}
            { action_respond_info("Step 2  Auto-Z Switch:    [PENDING] location saved (X=" ~ SAVED.get("autoz_switch_x")|string ~ ", Y=" ~ SAVED.get("autoz_switch_y")|string ~ ") but not yet physically confirmed -> run JWP_VERIFY_AUTOZ_SWITCH_LOCATION") }
        {% else %}
            { action_respond_info("Step 2  Auto-Z Switch:    [PENDING] -> run JWP_ALIGN_AUTOZ_SWITCH (park+jog) or JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] (direct entry), then JWP_VERIFY_AUTOZ_SWITCH_LOCATION to confirm") }
        {% endif %}
    {% endif %}

    {% if repeat_ok %}
        { action_respond_info("Step 3  Repeatability:    [PASSED] spread " ~ "%.4f"|format(SAVED.get("repeatability_last_spread", 0.0)|float) ~ "mm") }
    {% else %}
        { action_respond_info("Step 3  Repeatability:    [PENDING] -> run JWP_TEST_REPEATABILITY") }
    {% endif %}

    {% if not autoz %}
        { action_respond_info("Step 4  Nozzle Offset:    [SKIPPED] standalone-probe install path (use PROBE_CALIBRATE)") }
    {% elif offset_ok %}
        { action_respond_info("Step 4  Nozzle Offset:    [DONE] " ~ "%.4f"|format(SAVED.get("probe_nozzle_z_offset", 0.0)|float) ~ "mm") }
    {% elif offset_present %}
        { action_respond_info("Step 4  Nozzle Offset:    [RECALIBRATE] saved value predates the frame-switch capture fix -> remove sheet/cool bed/unload filament, then run JWP_MEASURE_PROBE_NOZZLE_OFFSET REDO=1") }
    {% else %}
        { action_respond_info("Step 4  Nozzle Offset:    [PENDING] -> run JWP_MEASURE_PROBE_NOZZLE_OFFSET") }
    {% endif %}

    {% if envelope_ok %}
        { action_respond_info("Step 5  Bed Envelope:     [DONE] " ~ "%.3f"|format(SAVED.get("leveling_bed_min_x")|float) ~ "," ~ "%.3f"|format(SAVED.get("leveling_bed_min_y")|float) ~ " to " ~ "%.3f"|format(SAVED.get("leveling_bed_max_x")|float) ~ "," ~ "%.3f"|format(SAVED.get("leveling_bed_max_y")|float)) }
    {% elif has_qgl or has_z_tilt or has_bed_mesh %}
        { action_respond_info("Step 5  Bed Envelope:     [PENDING VERIFICATION]\nNative leveling/mesh config exists, but the installed plate position has not been visually verified.\nAfter CALIBRATE_Z run: JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm>") }
    {% else %}
        { action_respond_info("Step 5  Bed Envelope:     [PENDING]\nAfter CALIBRATE_Z run: JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm>") }
    {% endif %}

    {% set ready = profile_ok and dock_ok and repeat_ok and ((not autoz) or (switch_ok and offset_ok)) %}
    { action_respond_info("Ready to print:           " ~ ("YES" if ready else "NO -- complete the pending steps above")) }
    {% if V.use_gantry_leveling and has_qgl %}
        { action_respond_info("Optional leveling:        [ENABLED] smart QGL via native [quad_gantry_level]") }
    {% elif V.use_gantry_leveling and has_z_tilt %}
        { action_respond_info("Optional leveling:        [ENABLED] Z_TILT_ADJUST via native [z_tilt]") }
    {% elif V.use_gantry_leveling %}
        { action_respond_info("Optional leveling:        [SKIPPED] no [quad_gantry_level] or [z_tilt] configured; calibrate bounds and generate a native section if this machine supports independent Z leveling") }
    {% else %}
        { action_respond_info("Optional leveling:        [DISABLED] TOGGLE_JWP_GANTRY_LEVELING") }
    {% endif %}
    {% if V.use_bed_mesh and has_bed_mesh %}
        { action_respond_info("Optional bed mesh:        [ENABLED] native [bed_mesh]") }
    {% elif V.use_bed_mesh %}
        { action_respond_info("Optional bed mesh:        [SKIPPED] no [bed_mesh] configured; use the optional leveling-envelope workflow to generate safe bounds") }
    {% else %}
        { action_respond_info("Optional bed mesh:        [DISABLED] TOGGLE_JWP_BED_MESH") }
    {% endif %}
    {% if V.repeat_print_fast_enabled %}
        { action_respond_info("Repeat-print fast path:   [ENABLED] " ~ V.repeat_print_trust_window_s|string ~ "s window, Auto-Z sanity <= " ~ "%.4f"|format(V.repeat_print_sanity_max_delta|float) ~ "mm") }
    {% else %}
        { action_respond_info("Repeat-print fast path:   [DISABLED] TOGGLE_JWP_REPEAT_PRINT_FAST_PATH") }
    {% endif %}
    { action_respond_info("================================================") }
