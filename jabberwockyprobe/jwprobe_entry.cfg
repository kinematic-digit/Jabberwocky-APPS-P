# =====================================================================
# JABBERWOCKY PROBE 2.0 — MASTER ENTRY POINT
# Add to printer.cfg: [include jabberwockyprobe/jwprobe_entry.cfg]
# =====================================================================

# 1. Folder Variable Storage
[save_variables]
# Runtime calibration deliberately lives OUTSIDE this deployable code folder.
# Copying/updating the whole jabberwockyprobe directory must never overwrite
# the printer's authoritative profile, dock strikes, or Auto-Z constants.
filename: ~/printer_data/config/jwprobe_runtime_vars.cfg

# 2. Base Configuration & Hardware
[include jwprobe_globals.cfg]
# Machine profile / portability layer. Must load after globals (it writes into
# JWProbe_Variables) and before anything that moves, since it supplies the
# driver-class-agnostic current helper and this machine's real travel limits.
[include jwprobe_profile.cfg]
[include jwprobe_hardware.cfg]

# 3. Kinematic Engine & Self-Contained Homing
[include jwprobe_logic.cfg]
[include jwprobe_homing.cfg]

# 3b. Onboarding & Actuation Dock Alignment (first-time install / rebuild)
[include jwprobe_onboarding.cfg]

# 4. Auto-Z Calibration Integration
[include jwprobe_autoz.cfg]

# =====================================================================
# 5. Optional Web UI Button Overrides (Mainsail / Fluidd)
# Uncomment the override files matching your printer hardware to make
# the standard Mainsail/Fluidd dashboard buttons automatically deploy
# and retract the Jabberwocky Probe.
# =====================================================================
#[include jwprobe_qgl.cfg]         # Uncomment if your printer has [quad_gantry_level]
#[include jwprobe_bed_mesh.cfg]    # Uncomment if your printer has [bed_mesh]
#[include jwprobe_z_tilt.cfg]     # Uncomment if your printer has [z_tilt]