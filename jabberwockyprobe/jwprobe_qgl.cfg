# =====================================================================
# JABBERWOCKY PROBE 2.0 — QUAD GANTRY LEVEL (QGL) BUTTON OVERRIDE
# Include this file ONLY if your printer uses [quad_gantry_level].
# Add to printer.cfg or jwprobe_entry.cfg: [include jwprobe_qgl.cfg]
# =====================================================================

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _JWP_NATIVE_QUAD_GANTRY_LEVEL
description: Intercepts Mainsail/Fluidd QGL button and G-code commands to automatically deploy and retract the Jabberwocky Probe.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set was_deployed = V.probe_deployed %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # See jwprobe_bed_mesh.cfg for why DEPLOY_PROBE is always called here
    # rather than gated on the possibly-stale was_deployed flag.
    DEPLOY_PROBE
    _JWP_NATIVE_QUAD_GANTRY_LEVEL {rawparams}
    {% if not was_deployed %}
        RETRACT_PROBE
    {% endif %}
