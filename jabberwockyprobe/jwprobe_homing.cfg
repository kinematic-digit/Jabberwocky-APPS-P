# =====================================================================
# JABBERWOCKY PROBE 2.0 — BASELINE SAFE Z HOMING
# Target: Physical Frame Z-Switch Pin
# =====================================================================
# [homing_override] (not the native [safe_z_home]) is used here on
# purpose: [safe_z_home] only supports a STATIC, config-time
# home_xy_position, but this build's Auto-Z switch location is
# discovered/refined at runtime by the onboarding Step 2 macros
# (JWP_ALIGN_AUTOZ_SWITCH / JWP_SET_AUTOZ_SWITCH_LOCATION ->
# JWP_SAVE_AUTOZ_SWITCH_LOCATION -> JWP_VERIFY_AUTOZ_SWITCH_LOCATION,
# jwprobe_onboarding.cfg) and persisted via SAVE_VARIABLE as
# autoz_switch_x/autoz_switch_y. A static home_xy_position would silently
# ignore that saved location on every real G28 Z/G28, always traveling to
# whatever fixed XY was typed into this file instead -- this was
# confirmed to be the root cause of intermittent "No trigger on probe
# after full movement" failures during bench testing, since the switch's
# true measured location did not exactly match the old hardcoded guess.
# Klipper's homing_override safely permits calling G28 Z again from
# within its own override gcode (it has recursion protection -- see
# klippy/extras/homing_override.py, the in_script guard -- so this is
# the standard, safe way to inject a dynamic pre-homing XY move); the
# x_homing_pos/y_homing_pos globals below (jwprobe_globals.cfg) are only
# the fallback default before Step 2 has ever saved a real location.
#
# 🎯 axes: xyz (not axes: z): widened to match the reference Klicky-Probe
# implementation (macros/debug/config/Klicky/klicky-macros.cfg), which
# captures every G28 call -- full or partial (G28 X, G28 Y, G28 X Y,
# bare G28) -- instead of only Z-inclusive ones. This gives JWP visibility
# into every homing request, matching Klicky's architecture, and is what
# lets a future partial-home caller be logged/tracked consistently.
# IMPORTANT: this does NOT change what actually gets homed -- exactly
# like Klicky's own override, a request that does not include Z (e.g. a
# bare G28 X Y from Mainsail's heightmap panel) still only homes X/Y here;
# it does not force Z. Forcing Z into every partial home would be wrong
# behavior, not a fix -- see the README for the full comparison.
[gcode_macro _JWP_FRAME_SWITCH_STATE]
description: Internal state for the most recent native frame-switch Z trigger coordinate.
variable_last_trigger_z: 0.0
gcode:

[gcode_macro _JWP_CAPTURE_FRAME_SWITCH_Z]
description: Internal staged capture immediately after native G28 Z and before the post-home safety hop.
gcode:
    SET_GCODE_VARIABLE MACRO=_JWP_FRAME_SWITCH_STATE VARIABLE=last_trigger_z VALUE={printer.toolhead.position.z|float}

[homing_override]
axes: xyz
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set switch_x = SAVED.get("autoz_switch_x", V.x_homing_pos)|float %}
    {% set switch_y = SAVED.get("autoz_switch_y", V.y_homing_pos)|float %}
    {% set travel_speed = 200.0 * 60 %}
    {% set hop = 10.0 %}
    {% set hop_speed = 10.0 * 60 %}

    # A bare G28 (no X/Y/Z params) means "home everything", matching stock
    # G28 semantics. An explicit G28 X / G28 Y / G28 Z / G28 X Y homes only
    # the axes actually named -- same params-parsing approach Klicky uses
    # ('X' in params / 'Y' in params / 'Z' in params) -- while still routing
    # any Z-inclusive request through JWP's real Auto-Z switch-travel
    # sequence below instead of a plain G28 Z.
    {% set explicit = ('X' in params) or ('Y' in params) or ('Z' in params) %}
    {% set home_x = (not explicit) or ('X' in params) %}
    {% set home_y = (not explicit) or ('Y' in params) %}
    {% set home_z = (not explicit) or ('Z' in params) %}

    {% if home_x and home_y %}
        G28 X Y
    {% elif home_x %}
        G28 X
    {% elif home_y %}
        G28 Y
    {% endif %}

    {% if home_z %}
        # This entire override is rendered before its first G28 executes.
        # Treat axes already requested above as "will be homed" rather than
        # rereading the stale pre-G28 homed_axes snapshot and homing them twice.
        {% set z_needs_x = ('x' not in printer.toolhead.homed_axes) and not home_x %}
        {% set z_needs_y = ('y' not in printer.toolhead.homed_axes) and not home_y %}
        {% if z_needs_x and z_needs_y %}
            G28 X Y
        {% elif z_needs_x %}
            G28 X
        {% elif z_needs_y %}
            G28 Y
        {% endif %}
        G90
        {% if 'z' in printer.toolhead.homed_axes %}
            # Already homed from a prior session -- lift clear before traveling,
            # same safety margin the old static [safe_z_home] z_hop provided.
            G1 Z{printer.toolhead.position.z|float + hop} F{hop_speed}
            M400
        {% endif %}
        G1 X{switch_x} Y{switch_y} F{travel_speed}
        M400
        G28 Z
        # Capture in a subsequent macro stage while still at the native
        # frame-switch trigger coordinate. Capturing below after G1 Z{hop}
        # would record the safety hop, not the switch.
        _JWP_CAPTURE_FRAME_SWITCH_Z
        G1 Z{hop} F{hop_speed}
        M400
    {% endif %}
