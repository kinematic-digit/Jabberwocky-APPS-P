# =====================================================================
# JABBERWOCKY PROBE 2.0 — ONBOARDING & ACTUATION DOCK ALIGNMENT
# First-time-install helper: provides a fixed, safe rear-center toolhead
# reference position for physically installing the actuation dock, then
# lets the operator find and persist the deploy/retract strike
# positions. Required once per physical build (or after any mechanical
# rework/reprint of the dock) before DEPLOY_PROBE/RETRACT_PROBE will run
# — see the confirmation guards in _EXECUTE_DEPLOY_PROBE/
# _EXECUTE_RETRACT_PROBE (jwprobe_logic.cfg).
#
# MECHANISM: the actuation dock is a single, FIXED tine mounted behind
# the rear access panel — it never moves once installed. What moves is
# the probe assembly's own protruding pin/sliding armature, which rests
# at one of two positions (deployed or retracted) depending on probe
# state. The toolhead drives that pin against the fixed tine from
# opposite sides of its travel: pushing from the X-max side drives the
# probe to RETRACTED, and pushing from the X-min side drives it to
# DEPLOYED. Because the pin itself is what moves (not the tine),
# deploy_x_strike and retract_x_strike are naturally a few mm apart even
# though there is only one physical tine — this is expected, not a sign
# of two contact points.
#
# ONBOARDING SEQUENCE: this actuation dock alignment is the FIRST
# onboarding step on a brand-new/reprinted build. Auto-Z switch location
# verification (_JWP_TOUCH_NOZZLE_AT_SWITCH wiring/confirmation) is a
# SEPARATE, LATER onboarding step — Z is intentionally NOT homed by this
# tool and must not be assumed homed while running it.
#
# !!! Z CLEARANCE — READ BEFORE RUNNING !!!
# This tool only ever commands X/Y moves; it never homes or moves Z, and
# it cannot know the current Z height or the physical height of the
# Auto-Z touch switch pin (near X=123, Y=188 per safe_z_home — close to
# this tool's rear-center reference point). Before running
# JWP_ALIGN_ACTUATION_DOCK (any MODE), the operator MUST manually raise
# the gantry/nozzle well clear of the bed and the Auto-Z switch pin
# first (e.g. by hand, with steppers disabled, or via a manual jog
# command) — do not assume any prior Z position is safe.
#
# WORKFLOW — MODE=INSTALL (new or reprinted dock only, run once):
#   1. Manually raise the gantry/nozzle clear of the bed and the Auto-Z
#      switch pin (see Z CLEARANCE above).
#   2. Manually move the probe's pin/armature to the DEPLOYED state
#      (extend it by hand) before mounting the tine. On this hardware,
#      deployed sits closer to the middle of the pin's full travel
#      range than retracted does, so mounting the tine while deployed
#      gives more even clearance margin for the first search in either
#      direction (MODE=RETRACT or MODE=DEPLOY).
#   3. Open the rear access panel.
#   4. JWP_ALIGN_ACTUATION_DOCK MODE=INSTALL Z_CLEAR=1 (G28 XY if not
#      already homed, lowers stepper current, moves the toolhead to the
#      fixed rear-center reference position: X=bed_max_x/2, Y=bed_max_y)
#   5. Mount the dock's tine to the frame within the probe pin's X
#      travel path near this reference position, with the pin still
#      manually held/resting in the DEPLOYED state from step 2. No
#      specific left/right orientation is needed -- the SAME tine is
#      contacted from both sides during MODE=RETRACT/MODE=DEPLOY below.
#      Position the tine so it is just touching the pin -- not forced
#      against it hard enough to bend or preload it -- then FULLY
#      SECURE the mounting screws (rigid, torqued down) before
#      proceeding. The search below needs a rigid, non-moving tine to
#      find a repeatable strike point; a loose or finger-tight mount
#      introduces play/wobble that a strike-based search cannot
#      distinguish from an actual trigger position. If the first
#      search below runs out of travel without triggering (see its
#      error message), loosen the screws, reposition the tine, fully
#      re-secure them, and retry -- do not leave it loose "just in
#      case" up front.
#   6. Proceed to MODE=RETRACT below.
#
# RECALIBRATING LATER (tine already installed): once both strikes are
# confirmed, MODE=INSTALL is blocked (actuation_dock_tine_installed) --
# there is no need to reopen the panel or remount the tine to redo
# calibration. Just run MODE=RETRACT directly (skip straight to the
# WORKFLOW — MODE=RETRACT section below). Only pass CONFIRM_REINSTALL=1
# to MODE=INSTALL if the tine was actually physically removed/replaced.
#
# WORKFLOW — MODE=RETRACT (find + confirm + save, do this first each
# time the dock is (re)installed, or to refresh a stale saved value):
#   1. JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT Z_CLEAR=1 — parks the
#      toolhead at a safety head-start above the expected retract
#      trigger (above the previously confirmed retract_x_strike if one
#      exists, otherwise above the rear-center reference position).
#   2. JWP_ALIGN_NUDGE DIST=-1 (repeat with small negative steps) —
#      steps the toolhead toward decreasing X, checking the console
#      after each nudge (auto-runs QUERY_PROBE), until it reports
#      RETRACTED/TRIGGERED.
#   3. STOP as soon as it FIRST reads RETRACTED/TRIGGERED — do not
#      keep nudging further into the fully-seated/locked position.
#      Production RETRACT_PROBE (jwprobe_logic.cfg) adds its own
#      retract_overtravel_mm PAST whatever position you save here for
#      a firm seat, then backs off by probe_strike_backoff_mm — saving
#      the fully-seated position instead of first-trigger would drive
#      it past the mechanism's hard stop.
#   4. JWP_ALIGN_SAVE_POSITION — persists the current X as
#      retract_x_strike, then AUTOMATICALLY backs the toolhead off the
#      tine and retreats clear of the dock before reporting next steps.
#
# WORKFLOW — MODE=DEPLOY (find + confirm + save; requires RETRACT
# confirmed first; the dock is NOT touched again):
#   1. JWP_ALIGN_ACTUATION_DOCK MODE=DEPLOY Z_CLEAR=1 — parks at a
#      head-start guess on the OPPOSITE side of the tine from retract
#      (retract_x_strike - dock_deploy_overtravel_mm).
#   2. JWP_ALIGN_NUDGE DIST=1 (repeat with small positive steps) —
#      steps the toolhead toward increasing X, checking the console
#      after each nudge, until it reports DEPLOYED/UNTRIGGERED.
#   3. JWP_ALIGN_SAVE_POSITION — persists the current X as
#      deploy_x_strike, then automatically backs off and retreats clear
#      of the dock, same as the RETRACT step above.
#
# Then:
#   JWP_ALIGN_FINISH                          (restores normal stepper
#      current; safe to call at any time, including to abandon a
#      session)
#   JWP_ALIGN_STATUS                          (reports persisted values
#      and confirmation state at any time)
#
# SAFETY RULE — rear-zone X-move restriction:
#   The rearmost 10mm of Y travel (Y > bed_max_y - 10) is where the
#   toolhead sits directly at the actuation dock during alignment. No X
#   movement may occur while Y is in this zone outside of this tool's
#   own controlled sequence, or the dock can be struck and damaged
#   (this is exactly how the dock was damaged before this tool existed
#   — see Milestone 6 bench finding in Master Doc 2.md). This is
#   enforced as a macro-level guard (_JWP_ASSERT_CLEAR_OF_REAR_DOCK_ZONE)
#   inside JWP's own motion macros (DEPLOY_PROBE, RETRACT_PROBE,
#   JWP_ALIGN_NUDGE); it cannot intercept a raw G1 typed directly at the
#   console or embedded in slicer custom G-code, so operators must still
#   manually respect this zone outside of JWP's own macros.
#
# BACKOFF-BEFORE-RETREAT RULE: every confirmed strike (RETRACT or
# DEPLOY) must back off the tine in X BEFORE retreating in Y —
# retreating Y while still pressed against the tine risks
# dragging/shearing the pin sideways. JWP_ALIGN_SAVE_POSITION performs
# this automatically (back off probe_strike_backoff_mm, then retreat Y)
# so the operator never has to remember or sequence it manually.
#
# Safe Z-before-XY choreography is unaffected — this tool only moves X/Y
# at bench-fit low torque, and never assumes Z is homed.
# =====================================================================

[gcode_macro _JWP_ALIGN_STATE]
description: Internal — holds the active alignment session's mode. Stepper currents are no longer stashed here; _JWP_MOTION_CURRENT re-derives the configured run_current from printer.configfile on demand, which is driver-class agnostic and cannot go stale.
variable_active:        False
variable_mode:             ""
variable_switch_active: False
# Automated step-scan state tracking
variable_auto_phase:       ""
variable_auto_dir:       -1.0
variable_auto_step_size:  0.5
variable_auto_steps_left:   0
variable_clearance_released: False
# X at which the probe state first flipped during this session, or -999 if it
# has not flipped yet. Used to reject a save made several nudges PAST first
# contact: once the probe trips it stays tripped, so a live state check alone
# cannot tell first contact from deep overshoot.
variable_flip_x:        -999.0
gcode:
    # State-only macro; not intended to be run directly.

[gcode_macro JWP_RELEASE_FOR_DOCK_CLEARANCE]
description: Explicitly releases all steppers so the operator can manually create the required dock-scan Z clearance. The next automated dock scan must still confirm Z_CLEAR=1 and will freshly home X/Y before moving.
gcode:
    {% set SAVED = printer.save_variables.variables %}
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP MOTOR RELEASE BLOCKED\nRun JWP_SETUP_WIZARD first so the machine profile is known.") }
    {% endif %}
    M400
    M84
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=clearance_released VALUE=True
    { action_respond_info("==================================================\nJWP MOTORS RELEASED - MANUAL CLEARANCE REQUIRED\n==================================================\nAll steppers are now OFF.\nSupport the moving gantry or bed while repositioning it.\n\nCreate at least 20mm clearance:\n  - Moving gantry: manually RAISE the gantry/nozzle.\n  - Moving bed Z (for example, Trident): manually LOWER the bed.\n\nAlso clear the nozzle and probe from the Auto-Z switch pin.\nThen manually set the probe to DEPLOYED / open.\n\nNEXT COMMAND\nJWP_AUTO_ALIGN_DOCK Z_CLEAR=1\n\nThe scan will check the probe without motion, then freshly home X/Y.\n==================================================") }

[gcode_macro _JWP_ASSERT_CLEAR_OF_REAR_DOCK_ZONE]
description: Internal — raises an error if the current Y position is inside the rear-most dock danger zone (Y > bed_max_y - 10)
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set rear_zone_y = V.bed_max_y|float - 10.0 %}
    {% set current_y = printer.toolhead.position.y|float %}
    {% if current_y > rear_zone_y %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - X movement inside dock danger zone\nWhere: Y=" ~ current_y|string ~ " is past the rear-most 10mm limit (Y > " ~ rear_zone_y|string ~ ").\nFix: Move Y clear of this zone first, then retry the X move. This protects the actuation dock from being struck.") }
    {% endif %}

[gcode_macro _JWP_ALIGN_SAFE_APPROACH_X]
description: Internal — moves to a new TARGET_X while never side-swiping the dock's tine. Always retreats Y clear of the rear zone FIRST (a pure axial withdrawal at whatever X it currently sits at — this is safe even if the current X is unknown/mid-search), THEN moves X to TARGET_X in free air, THEN returns Y to REAR_Y last at contact-safe speed. Deliberately does NOT attempt to "recenter" X before retreating: an earlier revision tried to return to a computed dock_center_x first, but that computation silently used the unconfirmed deploy_x_strike CONFIG PLACEHOLDER default whenever the deploy side hadn't been confirmed yet (which is exactly the case during the deploy search this helper is used for) — producing a bogus center value and moving X into it while still fully engaged at the rear Y. That caused a real bench collision. Retreating Y first, unconditionally, needs no knowledge of dock geometry at all and is safe by construction. X_FEED/Y_FEED default to full-speed travel (safe for MODE=INSTALL, nothing mounted yet) — callers approaching a possibly-mounted dock (MODE=RETRACT/MODE=DEPLOY head-start moves) MUST pass a slow, cautious feed instead, since TARGET_X is only a computed guess and an actual struck dock during a fast blind move is a real bench-confirmed hazard. SAFETY NET: this helper's own three legs are pure transit -- none of them is ever supposed to trigger the probe. A QUERY_PROBE baseline is captured before the first leg and re-checked after every leg; any unexpected change (dock shifted, tine loose/damaged, stale saved strike position) halts immediately in place instead of finishing the remaining legs blind.
gcode:
    {% set TARGET_X = params.TARGET_X|float %}
    {% set REAR_Y = params.REAR_Y|float %}
    {% set X_FEED = params.X_FEED|default(15000)|float %}
    {% set Y_FEED = params.Y_FEED|default(1500)|float %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set staging_y = V.bed_max_y|float - 30.0 %}
    QUERY_PROBE
    {% set baseline = printer.probe.last_query %}
    {% set baseline_state = ("probe: TRIGGERED  =  RETRACTED" if baseline else "probe: open  =  DEPLOYED") %}
    G90
    G1 Y{staging_y} F15000
    M400
    QUERY_PROBE
    {% if printer.probe.last_query != baseline %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - unexpected probe state change during travel\nWhere: Y-retreat leg, now at X=" ~ printer.toolhead.position.x|string ~ ", Y=" ~ printer.toolhead.position.y|string ~ ".\nExpected: " ~ baseline_state ~ " (unchanged from just before this move started).\nFound: " ~ (("probe: TRIGGERED  =  RETRACTED") if printer.probe.last_query else ("probe: open  =  DEPLOYED")) ~ " -- something struck the switch during a blind move.\nWhy this matters: this transit move is never supposed to touch the dock tine; a strike here means the saved strike position, tine mounting, or dock geometry has shifted since last confirmed.\nFix: do NOT continue blind. Manually inspect the dock tine and mounting screws before retrying.") }
    {% endif %}
    G1 X{TARGET_X} F{X_FEED}
    M400
    QUERY_PROBE
    {% if printer.probe.last_query != baseline %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - unexpected probe state change during travel\nWhere: X-travel leg, now at X=" ~ printer.toolhead.position.x|string ~ ", Y=" ~ printer.toolhead.position.y|string ~ ".\nExpected: " ~ baseline_state ~ " (unchanged from just before this move started).\nFound: " ~ (("probe: TRIGGERED  =  RETRACTED") if printer.probe.last_query else ("probe: open  =  DEPLOYED")) ~ " -- something struck the switch during a blind move.\nWhy this matters: this transit move is never supposed to touch the dock tine; a strike here means the saved strike position, tine mounting, or dock geometry has shifted since last confirmed.\nFix: do NOT continue blind. Manually inspect the dock tine and mounting screws before retrying.") }
    {% endif %}
    G1 Y{REAR_Y} F{Y_FEED}
    M400
    QUERY_PROBE
    {% if printer.probe.last_query != baseline %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - unexpected probe state change during travel\nWhere: Y-return leg, now at X=" ~ printer.toolhead.position.x|string ~ ", Y=" ~ printer.toolhead.position.y|string ~ ".\nExpected: " ~ baseline_state ~ " (unchanged from just before this move started).\nFound: " ~ (("probe: TRIGGERED  =  RETRACTED") if printer.probe.last_query else ("probe: open  =  DEPLOYED")) ~ " -- something struck the switch during a blind move.\nWhy this matters: this transit move is never supposed to touch the dock tine; a strike here means the saved strike position, tine mounting, or dock geometry has shifted since last confirmed.\nFix: do NOT continue blind. Manually inspect the dock tine and mounting screws before retrying.") }
    {% endif %}

[gcode_macro JWP_ALIGN_ACTUATION_DOCK]
description: Onboarding step — homes XY, lowers stepper current, and moves the toolhead to a safe starting position for the requested MODE (INSTALL/RETRACT/DEPLOY). Z is NEVER homed or moved by this macro — operator must manually clear the gantry first. Requires Z_CLEAR=1 to confirm this was done. NOTE on the first-ever RETRACT search after MODE=INSTALL -- the dock's exact physical protrusion is only approximately known right after mounting, so it parks further back (align_first_install_headstart_mm) than the normal re-confirm headstart (bench-confirmed: the dock was struck when this used the smaller margin at full speed). MODE=INSTALL is a ONE-TIME physical step: once actuation_dock_tine_installed is confirmed True, MODE=INSTALL is blocked (recalibrate with MODE=RETRACT directly, no remounting needed) unless CONFIRM_REINSTALL=1 is passed (use only if the tine was actually removed/replaced).
gcode:
    {% set MODE = params.MODE|default("")|upper %}
    {% if MODE not in ["INSTALL", "DEPLOY", "RETRACT"] %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - missing MODE\nFix: pass MODE=INSTALL, MODE=RETRACT, or MODE=DEPLOY.") }
    {% endif %}
    {% if params.Z_CLEAR|default(0)|int != 1 %}
        { action_raise_error("==================================================\nJWP STEP 1 BLOCKED: Z CLEARANCE NOT CONFIRMED\n==================================================\nBefore dock motion, create at least 20mm of physical clearance:\n  - Moving gantry: manually RAISE the gantry/nozzle.\n  - Moving bed Z (for example, Trident): manually LOWER the bed.\nAlso clear the nozzle and probe from the Auto-Z switch pin.\n\nJWP cannot safely home or move Z at this stage.\nRe-run with Z_CLEAR=1 only after physically verifying clearance.\n==================================================") }
    {% endif %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set confirm_reinstall = params.CONFIRM_REINSTALL|default(0)|int == 1 %}
    # Step 0 gate: every coordinate below is derived from bed_max_x/bed_max_y.
    # Until JWP_SETUP_WIZARD has detected this machine's real travel limits,
    # those are only the framework's built-in bench defaults, so the "rear
    # center" this tool drives to could be somewhere else entirely. Refuse
    # rather than move blind.
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - machine profile not set\nFix: run JWP_SETUP_WIZARD first (Step 0) -- it detects this printer's kinematics, travel limits and stepper driver class.\nWhy it matters: without it, the dock approach would use built-in default bed dimensions, which may not match this machine and could drive the toolhead into the frame.") }
    {% endif %}
    # One-time physical step gate: once the tine is confirmed mounted, MODE=INSTALL
    # has no more physical work to do -- a user redoing calibration should never be
    # sent back through the panel-removal/remount instructions. MODE=RETRACT can be
    # run directly (it does not require MODE=INSTALL to have just run).
    {% if MODE == "INSTALL" and SAVED.get("actuation_dock_tine_installed", False) and not confirm_reinstall %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - tine already installed\nWhy: the actuation dock tine was already confirmed installed and does not need remounting.\nFix: run MODE=RETRACT directly to recalibrate the strike positions -- no physical steps needed.\nReinstall: if the tine was actually removed or replaced, run MODE=INSTALL CONFIRM_REINSTALL=1 instead.") }
    {% endif %}
    {% if MODE == "DEPLOY" and not SAVED.get("actuation_dock_retract_confirmed", False) %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - RETRACT side not confirmed yet\nFix: run MODE=RETRACT first, then JWP_ALIGN_SAVE_POSITION, before attempting MODE=DEPLOY.\nWhy: MODE=DEPLOY parks at a head-start guess computed from the confirmed retract position, then still requires your own JWP_ALIGN_NUDGE + QUERY_PROBE confirmation before saving -- it is not auto-verified.") }
    {% endif %}

    {% set homed = printer.toolhead.homed_axes %}
    {% if ('x' not in homed) or ('y' not in homed) %}
        G28 X Y
    {% endif %}

    {% set rear_center_x = V.bed_max_x|float / 2.0 %}
    {% set rear_center_y = V.bed_max_y|float %}
    {% set min_x = V.bed_min_x|float %}
    {% set max_x = V.bed_max_x|float %}
    {% set headstart = V.dock_deploy_overtravel_mm|float %}
    {% set first_install_headstart = V.align_first_install_headstart_mm|default(12.0)|float %}
    {% set deploy_headstart = V.align_deploy_search_headstart_mm|default(16.0)|float %}
    {% set approach_feed = V.align_approach_feed_mm_min|float %}

    _JWP_MOTION_CURRENT MODE=LOW

    {% if MODE == "INSTALL" %}
        {% set target_x = rear_center_x %}
        {% set move_feed = 15000 %}
    {% elif MODE == "RETRACT" %}
        {% if SAVED.get("actuation_dock_retract_confirmed", False) %}
            {% set retract_x_prev = SAVED.get("retract_x_strike")|float %}
            {% set target_x = [[retract_x_prev + headstart, min_x]|max, max_x]|min %}
        {% else %}
            # First-ever search after MODE=INSTALL: park with head-start buffer
            {% set target_x = [[rear_center_x + first_install_headstart, min_x]|max, max_x]|min %}
        {% endif %}
        {% set move_feed = approach_feed %}
    {% else %}
        {% set retract_x = SAVED.get("retract_x_strike")|float %}
        {% set target_x = [[retract_x - deploy_headstart, min_x]|max, max_x]|min %}
        {% set move_feed = approach_feed %}
    {% endif %}

    _JWP_ALIGN_SAFE_APPROACH_X TARGET_X={target_x} REAR_Y={rear_center_y} X_FEED={move_feed} Y_FEED={move_feed}

    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=mode VALUE='"{MODE}"'
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=flip_x VALUE=-999.0

    {% if MODE == "INSTALL" %}
        SAVE_VARIABLE VARIABLE=actuation_dock_retract_confirmed VALUE=False
        SAVE_VARIABLE VARIABLE=actuation_dock_deploy_confirmed VALUE=False
        {% if confirm_reinstall %}
            SAVE_VARIABLE VARIABLE=actuation_dock_tine_installed VALUE=False
            { action_respond_info("JWP [Step 1 of 5] MODE=INSTALL (reinstall confirmed) - toolhead parked at X=" ~ target_x|string ~ ", Y=" ~ rear_center_y|string ~ "\nNote: previous strike positions and confirmations have been cleared.\nStep 1: Remove the rear access panel for full access.\nStep 2: Viewed from behind the printer, manually push the probe pin's slide LEFT-to-RIGHT to drive it to DEPLOYED.\nStep 3: Position the dock tine on the LEFT side of the pin, near this parked position, just touching it -- not forced/bent against it.\nStep 4: Fully secure the mounting screws (rigid, torqued down, not loose) -- the search needs a rigid tine to find a repeatable strike point.\nNext: once mounted, run JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT Z_CLEAR=1\nAbort: run JWP_ALIGN_FINISH to cancel.") }
        {% else %}
            { action_respond_info("JWP [Step 1 of 5] MODE=INSTALL - toolhead parked at X=" ~ target_x|string ~ ", Y=" ~ rear_center_y|string ~ "\nStep 1: Remove the rear access panel for full access.\nStep 2: Viewed from behind the printer, manually push the probe pin's slide LEFT-to-RIGHT to drive it to DEPLOYED.\nStep 3: Position the dock tine on the LEFT side of the pin, near this parked position, just touching it -- not forced/bent against it.\nStep 4: Fully secure the mounting screws (rigid, torqued down, not loose) -- the search needs a rigid tine to find a repeatable strike point.\nNext: once mounted, run JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT Z_CLEAR=1\nAbort: run JWP_ALIGN_FINISH to cancel.") }
        {% endif %}
    {% elif MODE == "RETRACT" %}
        { action_respond_info("JWP [Step 1 of 5] MODE=RETRACT - toolhead parked at X=" ~ target_x|string ~ ", Y=" ~ rear_center_y|string ~ "\nStep 1: Nudge toward the tine in 1mm steps: JWP_ALIGN_NUDGE DIST=-1\nStep 2: Each nudge prints the probe state (Klipper wording: 'probe: open' = DEPLOYED, 'probe: TRIGGERED' = RETRACTED).\nStep 3: STOP on the FIRST nudge that reports TRIGGERED -- do not keep nudging past it. The saved value must be the first-contact point; overtravel is added automatically during normal operation.\nNext: run JWP_ALIGN_SAVE_POSITION\nAbort: run JWP_ALIGN_FINISH when done.") }
    {% else %}
        { action_respond_info("JWP [Step 1 of 5] MODE=DEPLOY - toolhead parked at X=" ~ target_x|string ~ ", Y=" ~ rear_center_y|string ~ "\nStep 1: Nudge toward the tine in 1mm steps: JWP_ALIGN_NUDGE DIST=1\nStep 2: Each nudge prints the probe state (Klipper wording: 'probe: open' = DEPLOYED, 'probe: TRIGGERED' = RETRACTED).\nStep 3: STOP on the FIRST nudge that reports open -- do not keep nudging past it. The saved value must be the first-contact point; overtravel is added automatically during normal operation.\nNext: run JWP_ALIGN_SAVE_POSITION\nAbort: run JWP_ALIGN_FINISH when done.") }
    {% endif %}

[gcode_macro JWP_ALIGN_NUDGE]
description: Onboarding optional step — fine-tunes the toolhead's X position by DIST=[mm] (positive or negative), clamped to the bed's safe travel range
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if not S.active %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - no alignment session active\nFix: run JWP_ALIGN_ACTUATION_DOCK MODE=DEPLOY|RETRACT first.") }
    {% endif %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set DIST = params.DIST|default(0.0)|float %}
    {% set current_x = printer.toolhead.position.x|float %}
    {% set target_x = current_x + DIST %}
    {% set min_x = V.bed_min_x|float %}
    {% set max_x = V.bed_max_x|float %}
    {% set safe_x = [[target_x, min_x]|max, max_x]|min %}
    {% set settle_ms = V.accuracy_settle_ms|default(250)|int %}
    G90
    G1 X{safe_x} F600
    M400
    G4 P{settle_ms}
    QUERY_PROBE
    _JWP_ALIGN_NUDGE_REPORT MODE={S.mode}

[gcode_macro _JWP_ALIGN_NUDGE_REPORT]
description: Internal — reports freshly-queried probe state after a manual nudge, in the same vocabulary Klipper's own QUERY_PROBE uses.
gcode:
    {% set MODE = params.MODE|default("")|upper %}
    # Klipper's QUERY_PROBE prints literally "probe: open" or "probe: TRIGGERED".
    # It has no concept of deployed/retracted, so reporting only JWP's vocabulary
    # left the operator comparing two different words for the same reading and
    # guessing at the mapping. Always print Klipper's word first, then JWP's
    # meaning for it.
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% set triggered = printer.probe.last_query %}
    {% set state = ("probe: TRIGGERED  =  RETRACTED" if triggered else "probe: open  =  DEPLOYED") %}
    {% set x = printer.toolhead.position.x|float %}
    {% set pos = "X=" ~ x|string %}
    # "Struck" means the probe has reached the state this mode is hunting for.
    {% set struck = (not triggered) if MODE == "DEPLOY" else triggered %}
    {% set first_strike = struck and S.flip_x|float < -900.0 %}
    {% if first_strike %}
        SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=flip_x VALUE={x}
    {% endif %}
    {% if MODE == "DEPLOY" or MODE == "RETRACT" %}
        {% set nudge_cmd = "JWP_ALIGN_NUDGE DIST=1" if MODE == "DEPLOY" else "JWP_ALIGN_NUDGE DIST=-1" %}
        {% if not struck %}
            { action_respond_info("JWP [Step 1 of 5] " ~ pos ~ " | " ~ state ~ " -- not there yet, nudge again: " ~ nudge_cmd) }
        {% elif first_strike %}
            { action_respond_info("JWP [Step 1 of 5] " ~ pos ~ " | " ~ state ~ " <-- STOP HERE\nThis is the first-contact point. Do NOT nudge any further.\nNext: run JWP_ALIGN_SAVE_POSITION") }
        {% else %}
            { action_respond_info("JWP [Step 1 of 5] " ~ pos ~ " | " ~ state ~ " ** OVERSHOT **\nFirst contact was X=" ~ S.flip_x|string ~ "; you are " ~ (x - S.flip_x|float)|abs|round(2)|string ~ "mm past it.\nFix: nudge back to X=" ~ S.flip_x|string ~ " before saving.") }
        {% endif %}
    {% else %}
        { action_respond_info("JWP [Step 1 of 5] " ~ pos ~ " | " ~ state ~ ".") }
    {% endif %}

[gcode_macro JWP_ALIGN_SAVE_POSITION]
description: Onboarding step — persists current X as confirmed strike position, backs off, and retreats clear of the dock.
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if not S.active %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - no alignment session active\nFix: run JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT|DEPLOY first.") }
    {% endif %}
    {% if S.mode == "INSTALL" %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - MODE=INSTALL has no strike position to save\nNext: run JWP_ALIGN_ACTUATION_DOCK MODE=RETRACT Z_CLEAR=1.") }
    {% endif %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    # Guard against saving a point that is not actually the first-contact point.
    # The operator is told to stop on the first state change; if the probe is
    # still reading the PRE-strike state, they have not reached the tine yet and
    # saving here would persist a position that never actuates anything.
    {% if S.mode == "DEPLOY" and printer.probe.last_query %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - deploy strike point not reached yet\nReading: probe still shows 'probe: TRIGGERED' (= RETRACTED).\nFix: keep nudging with JWP_ALIGN_NUDGE DIST=1 until it reports 'probe: open' (= DEPLOYED), then save on that FIRST open reading.") }
    {% endif %}
    {% if S.mode == "RETRACT" and not printer.probe.last_query %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - retract strike point not reached yet\nReading: probe still shows 'probe: open' (= DEPLOYED).\nFix: keep nudging with JWP_ALIGN_NUDGE DIST=-1 until it reports 'probe: TRIGGERED' (= RETRACTED), then save on that FIRST triggered reading.") }
    {% endif %}
    # Once the probe trips it stays tripped, so the live state check above cannot
    # distinguish first contact from several nudges past it. Compare against the
    # X recorded when the state actually flipped and refuse a deep save: production
    # motion adds its own overtravel on top, so a point saved 4mm deep would drive
    # 4mm harder into the dock than designed.
    {% set flip_x = S.flip_x|float %}
    {% if flip_x > -900.0 and (printer.toolhead.position.x|float - flip_x)|abs > V.align_overshoot_tolerance_mm|float %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - refusing to save an overshot position\nCurrent X=" ~ printer.toolhead.position.x|string ~ "; first contact was X=" ~ flip_x|string ~ " (" ~ (printer.toolhead.position.x|float - flip_x)|abs|round(2)|string ~ "mm past it, limit " ~ V.align_overshoot_tolerance_mm|string ~ "mm).\nFix: nudge back to X=" ~ flip_x|string ~ " and save there. The saved value must be the first-contact point; normal deploy/retract adds its own overtravel on top of it.") }
    {% endif %}
    {% set current_x = printer.toolhead.position.x|float %}
    {% set min_x = V.bed_min_x|float %}
    {% set max_x = V.bed_max_x|float %}
    {% set backoff = V.probe_strike_backoff_mm|float %}

    {% if S.mode == "DEPLOY" %}
        SAVE_VARIABLE VARIABLE=deploy_x_strike VALUE={current_x}
        SAVE_VARIABLE VARIABLE=actuation_dock_deploy_confirmed VALUE=True
        {% set backoff_x = [[current_x - backoff, min_x]|max, max_x]|min %}
    {% else %}
        SAVE_VARIABLE VARIABLE=retract_x_strike VALUE={current_x}
        SAVE_VARIABLE VARIABLE=actuation_dock_retract_confirmed VALUE=True
        {% set backoff_x = [[current_x + backoff, min_x]|max, max_x]|min %}
    {% endif %}

    # Bench-confirmed sequence: back off the tine BEFORE retreating in Y
    G90
    G1 X{backoff_x} F1500
    M400
    {% set staging_y = V.bed_max_y|float - 30.0 %}
    G1 Y{staging_y} F15000
    M400

    { action_respond_info("JWP [Step 1 of 5] " ~ S.mode ~ " strike saved at X=" ~ current_x|string ~ " -- backed off and retreated.") }
    {% set both_confirmed = (S.mode == "DEPLOY" and printer.save_variables.variables.get("actuation_dock_retract_confirmed", False)) or (S.mode == "RETRACT" and printer.save_variables.variables.get("actuation_dock_deploy_confirmed", False)) %}
    {% if both_confirmed %}
        SAVE_VARIABLE VARIABLE=actuation_dock_tine_installed VALUE=True
        { action_respond_info("JWP [Step 1 of 5] COMPLETE - both dock strike positions confirmed.\nNext: run JWP_ALIGN_FINISH to close out this session and see the Step 2 command.") }
    {% else %}
        # The Z_CLEAR=1 param is not cosmetic: JWP_ALIGN_ACTUATION_DOCK refuses to
        # run without it, because this tool drives the toolhead into the rear dock
        # at a Z height it cannot verify. State the requirement and the physical
        # action together so the printed command works exactly as shown.
        { action_respond_info("JWP [Step 1 of 5] one side saved -- the other side is still needed.\nStep 1: Manually raise the gantry so the nozzle clears the bed and any bed accessories.\nStep 2: Run: JWP_ALIGN_ACTUATION_DOCK MODE=" ~ ("RETRACT" if S.mode == "DEPLOY" else "DEPLOY") ~ " Z_CLEAR=1\nNote: Z_CLEAR=1 is your confirmation that step 1 is done -- without it the command aborts with 'Z clearance not confirmed'.\nAbort: run JWP_ALIGN_FINISH to end the session.") }
    {% endif %}

[gcode_macro JWP_ALIGN_FINISH]
description: Onboarding step — moves clear of the rear dock zone, ends the active alignment session, and restores normal stepper current
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if S.active %}
        {% set V = printer["gcode_macro JWProbe_Variables"] %}
        {% set clear_y = V.bed_max_y|float - 30.0 %}
        G90
        G1 Y{clear_y} F15000
        M400
        _JWP_MOTION_CURRENT MODE=RESTORE
        G4 P100
        SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=False
        { action_respond_info("JWP [Step 1 of 5] session ended -- moved clear of the rear dock zone, normal stepper current restored.") }
        {% set SAVED = printer.save_variables.variables %}
        {% if SAVED.get("actuation_dock_deploy_confirmed", False) and SAVED.get("actuation_dock_retract_confirmed", False) %}
            {% if SAVED.get("use_auto_z", V.use_auto_z) %}
                { action_respond_info("NEXT: JWP_ALIGN_AUTOZ_SWITCH  (Step 2 of 5: parks near the frame-mounted Auto-Z switch to jog into position -- pure XY move, no force_move or Z homing needed for this step)") }
            {% else %}
                { action_respond_info("NEXT: JWP_TEST_REPEATABILITY  (Step 3 of 5)") }
            {% endif %}
        {% endif %}
    {% elif S.switch_active %}
        # JWP_ALIGN_AUTOZ_SWITCH is a pure XY park/jog -- no probe deploy,
        # no Z motion, no force_move to clean up, so ending the session is
        # just clearing the state flag.
        SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=switch_active VALUE=False
        { action_respond_info("JWP [Step 2 of 5] session ended WITHOUT saving.") }
    {% else %}
        { action_respond_info("JWP: no alignment session was active.") }
    {% endif %}

[gcode_macro JWP_AUTO_ALIGN_DOCK]
description: Fully automated dock discovery and alignment. Every run first checks the stationary probe is manually DEPLOYED/open, then explicitly re-homes X/Y, stages 30mm forward of the rear dock, and performs a bounded low-current slow scan for an existing tine. If found, both retract/deploy strikes are saved automatically; if not found, it retreats and tells the operator to install/inspect the tine. INSTALLED=1 and RECOVER=1 remain accepted as backward-compatible no-ops -- presence is determined physically, not from persisted flags.
gcode:
    {% if params.Z_CLEAR|default(0)|int != 1 %}
        { action_raise_error("==================================================\nJWP STEP 1 BLOCKED: Z CLEARANCE NOT CONFIRMED\n==================================================\nBefore the tine scan, create at least 20mm of physical clearance:\n  - Moving gantry: manually RAISE the gantry/nozzle.\n  - Moving bed Z (for example, Trident): manually LOWER the bed.\nAlso clear the nozzle and probe from the Auto-Z switch pin.\n\nJWP cannot safely home or move Z at this stage.\nRe-run JWP_AUTO_ALIGN_DOCK Z_CLEAR=1 only after physically verifying clearance.\n==================================================") }
    {% endif %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP [Step 1 of 5] BLOCKED - machine profile not set\nFix: run JWP_SETUP_WIZARD first (Step 0).") }
    {% endif %}
    {% if not S.clearance_released %}
        { action_raise_error("JWP STEP 1 BLOCKED - MOTOR RELEASE NOT CONFIRMED\n\nRun this first:\n  JWP_RELEASE_FOR_DOCK_CLEARANCE\n\nThen manually create at least 20mm of Z clearance and set the probe to DEPLOYED / open.\nAfter physically checking clearance, run:\n  JWP_AUTO_ALIGN_DOCK Z_CLEAR=1") }
    {% endif %}

    # Query before any motion. The follow-on macro renders after QUERY_PROBE
    # executes, so it sees the fresh physical state rather than this macro's
    # pre-execution Jinja snapshot.
    QUERY_PROBE
    _JWP_AUTO_ALIGN_PREFLIGHT

[gcode_macro _JWP_AUTO_ALIGN_PREFLIGHT]
description: Internal no-motion probe-state gate. If deployed/open, explicitly re-homes X/Y before handing off to the dock scan.
gcode:
    {% set triggered = printer.probe.last_query %}
    {% if triggered %}
        { action_respond_info("==================================================\nJWP STEP 1 PAUSED - NO MOTION PERFORMED\n==================================================\nProbe state:\n  probe: TRIGGERED = RETRACTED\n\nRequired state:\n  probe: open = DEPLOYED\n\nWhy:\n  The scan must begin deployed so the tine approaches the LEFT side of the pin.\n  JWP cannot deploy automatically before the tine location is known.\n\nNext:\n  1. Manually extend the probe pin.\n  2. Run QUERY_PROBE and confirm: probe: open\n  3. Run JWP_AUTO_ALIGN_DOCK Z_CLEAR=1 again.\n==================================================") }
    {% else %}
        { action_respond_info("JWP STEP 1 PREFLIGHT PASSED\nProbe state: DEPLOYED / open\n\nHOMING X/Y NOW\nA fresh X/Y home is required after manual motor release.") }
        SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=clearance_released VALUE=False
        # Always re-home: M84/manual repositioning can invalidate physical X/Y
        # even when Klipper still reports a prior logical homing state.
        G28 X Y
        _JWP_AUTO_ALIGN_START
    {% endif %}

[gcode_macro _JWP_AUTO_ALIGN_START]
description: Internal dock-scan initializer. Runs only after the no-motion probe gate and a fresh X/Y home.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set rear_center_x = V.bed_max_x|float / 2.0 %}
    {% set rear_center_y = V.bed_max_y|float %}
    _JWP_MOTION_CURRENT MODE=LOW
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=mode VALUE='"AUTO"'
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=flip_x VALUE=-999.0

    # Every run begins with the same physical discovery sequence; never trust
    # an installed/not-installed flag to decide whether it is safe to enter.
    {% set first_install_headstart = V.align_first_install_headstart_mm|default(12.0)|float %}
    {% set start_x = [[rear_center_x + first_install_headstart, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set staging_y = rear_center_y - 30.0 %}
    {% set approach_feed = V.align_approach_feed_mm_min|float %}

    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_phase VALUE='"RETRACT"'
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_dir VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_step_size VALUE=0.5
    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_steps_left VALUE=40

    _JWP_ALIGN_SAFE_APPROACH_X TARGET_X={start_x} REAR_Y={staging_y} X_FEED={approach_feed} Y_FEED={approach_feed}
    QUERY_PROBE
    _JWP_AUTO_ALIGN_BEGIN_SCAN START_X={start_x} REAR_Y={rear_center_y}

[gcode_macro _JWP_AUTO_ALIGN_BEGIN_SCAN]
description: Internal installed-tine recovery gate. Starts the automated scan only when the staged live probe state is DEPLOYED/open, ensuring the tine enters on the correct side of the pin.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set triggered = printer.probe.last_query %}
    {% set start_x = params.START_X|float %}
    {% set rear_y = params.REAR_Y|float %}
    {% if triggered %}
        _JWP_MOTION_CURRENT MODE=RESTORE
        SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=False
        { action_respond_info("JWP STEP 1 STOPPED SAFELY\n\nLocation:\n  30mm forward of the rear dock zone\n\nProbe state changed unexpectedly:\n  probe: TRIGGERED = RETRACTED\n\nThe toolhead will not enter the dock zone.\n\nFix:\n  1. Inspect the probe pin; it changed state after preflight.\n  2. Manually restore probe: open.\n  3. Re-run JWP_AUTO_ALIGN_DOCK Z_CLEAR=1.") }
    {% else %}
        { action_respond_info("JWP STEP 1 - DOCK DISCOVERY\nProbe state: DEPLOYED / open\nApproach: slow entry from the correct side\nScan: Phase 1 of 2 - RETRACT strike") }
        G90
        G1 X{start_x} Y{rear_y} F{V.align_approach_feed_mm_min|float}
        M400
        QUERY_PROBE
        UPDATE_DELAYED_GCODE ID=_JWP_AUTO_ALIGN_LOOP DURATION=0.01
    {% endif %}

[delayed_gcode _JWP_AUTO_ALIGN_LOOP]
# Internal — reactor-scheduled step evaluator for the automated dock search.
# Runs via UPDATE_DELAYED_GCODE rather than a direct macro call so each step
# is dispatched outside the invoking call stack, avoiding Klipper's "Macro
# called recursively" guard (a macro calling itself, even indirectly through
# a chain, is rejected while it is still on the call stack; a delayed_gcode
# callback scheduling its own next run via the reactor timer is not on that
# stack). NOTE: [delayed_gcode] sections do not support a `description:`
# option (that is gcode_macro-only) — Klipper rejects it at config-load time
# with "Option 'description' is not valid in section...", hence this is a
# plain comment instead.
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if S.active and S.mode == "AUTO" %}
    {% set PHASE = S.auto_phase %}
    {% set DIR = S.auto_dir|float %}
    {% set STEP_SIZE = S.auto_step_size|float %}
    {% set REMAINING_STEPS = S.auto_steps_left|int %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set triggered = printer.probe.last_query %}
    {% set current_x = printer.toolhead.position.x|float %}
    {% set rear_y = V.bed_max_y|float %}
    {% set staging_y = rear_y - 30.0 %}
    {% set backoff = V.probe_strike_backoff_mm|float %}
    {% set settle_ms = V.accuracy_settle_ms|default(200)|int %}

    # Check if target state achieved
    {% set reached = triggered if PHASE == "RETRACT" else (not triggered) %}

    {% if reached %}
        # Target reached!
        {% if PHASE == "RETRACT" %}
            SAVE_VARIABLE VARIABLE=retract_x_strike VALUE={current_x}
            SAVE_VARIABLE VARIABLE=actuation_dock_retract_confirmed VALUE=True
            { action_respond_info("JWP STEP 1 - PHASE 1 OF 2 COMPLETE\nRETRACT strike: X=" ~ current_x|string ~ "\nProbe state: TRIGGERED\nResult: saved") }
            # Back off in X then retreat in Y
            {% set backoff_x = [[current_x + backoff, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
            G90
            G1 X{backoff_x} F1500
            M400
            G1 Y{staging_y} F15000
            M400
            # Settle dwell: give the compliant tine time to relax back to neutral
            # before immediately reversing direction into the opposite-phase
            # search. The manual (non-auto) flow had this implicitly, since the
            # operator had to type the next command; the auto-scan reverses
            # back-to-back with no such pause, and that timing has not yet been
            # bench-validated on real hardware.
            G4 P{settle_ms}
            # Begin Phase 2: Deploy strike search
            { action_respond_info("JWP STEP 1 - PHASE 2 OF 2\nStarting DEPLOY strike search.") }
            {% set deploy_headstart = V.align_deploy_search_headstart_mm|default(16.0)|float %}
            {% set deploy_start_x = [[current_x - deploy_headstart, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
            SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_phase VALUE='"DEPLOY"'
            SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_dir VALUE=1.0
            SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_steps_left VALUE=40
            _JWP_ALIGN_SAFE_APPROACH_X TARGET_X={deploy_start_x} REAR_Y={rear_y} X_FEED={V.align_approach_feed_mm_min|float} Y_FEED={V.align_approach_feed_mm_min|float}
            QUERY_PROBE
            UPDATE_DELAYED_GCODE ID=_JWP_AUTO_ALIGN_LOOP DURATION=0.01
        {% else %}
            # Deploy phase complete!
            SAVE_VARIABLE VARIABLE=deploy_x_strike VALUE={current_x}
            SAVE_VARIABLE VARIABLE=actuation_dock_deploy_confirmed VALUE=True
            SAVE_VARIABLE VARIABLE=actuation_dock_tine_installed VALUE=True
            { action_respond_info("JWP STEP 1 - PHASE 2 OF 2 COMPLETE\nDEPLOY strike: X=" ~ current_x|string ~ "\nProbe state: open\nResult: saved") }
            {% set backoff_x = [[current_x - backoff, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
            G90
            G1 X{backoff_x} F1500
            M400
            G1 Y{staging_y} F15000
            M400
            _JWP_MOTION_CURRENT MODE=RESTORE
            SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=False
            {% set SAVED = printer.save_variables.variables %}
            {% if SAVED.get("use_auto_z", V.use_auto_z) %}
                { action_respond_info("==================================================\nJWP STEP 1 COMPLETE\nBoth RETRACT and DEPLOY strikes are saved.\n==================================================\nNEXT COMMAND - STEP 2 OF 5\nJWP_ALIGN_AUTOZ_SWITCH\n\nThis parks near the frame-mounted Auto-Z switch using X/Y motion only.") }
            {% else %}
                { action_respond_info("==================================================\nJWP STEP 1 COMPLETE\nBoth RETRACT and DEPLOY strikes are saved.\n==================================================\nNEXT COMMAND - STEP 3 OF 5\nJWP_TEST_REPEATABILITY") }
            {% endif %}
        {% endif %}
    {% else %}
        # State not reached yet, check step bounds
        {% if REMAINING_STEPS <= 0 %}
            # Exceeded steps without tripping
            G90
            G1 Y{staging_y} F15000
            M400
            _JWP_MOTION_CURRENT MODE=RESTORE
            SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=False
            {% if PHASE == "RETRACT" %}
                { action_raise_error("JWP STEP 1 - NO TINE DETECTED\n\nSafe state:\n  Toolhead retreated 30mm from the dock.\n  Normal motor current restored.\n\nIf no tine is installed:\n  JWP_ALIGN_ACTUATION_DOCK MODE=INSTALL Z_CLEAR=1\n\nIf a tine is installed:\n  1. Inspect its position and rigidity.\n  2. Inspect probe-pin movement.\n  3. Manually restore probe: open.\n  4. Re-run JWP_AUTO_ALIGN_DOCK Z_CLEAR=1.") }
            {% else %}
                { action_raise_error("JWP STEP 1 - DEPLOY STRIKE NOT DETECTED\n\nRETRACT contact was found, but the return strike was not.\n\nFix:\n  1. Inspect tine position and rigidity.\n  2. Confirm the probe pin moves freely.\n  3. Manually restore probe: open if needed.\n  4. Re-run JWP_AUTO_ALIGN_DOCK Z_CLEAR=1.") }
            {% endif %}
        {% else %}
            # Take a step
            {% set next_x = current_x + (DIR * STEP_SIZE) %}
            {% if next_x < V.bed_min_x|float or next_x > V.bed_max_x|float %}
                G90
                G1 Y{staging_y} F15000
                M400
                _JWP_MOTION_CURRENT MODE=RESTORE
                SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=active VALUE=False
                { action_raise_error("JWP [Step 1 of 5] BLOCKED - travel limit reached during " ~ PHASE ~ " phase without triggering the probe.") }
            {% else %}
                SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=auto_steps_left VALUE={REMAINING_STEPS - 1}
                G90
                G1 X{next_x} F600
                M400
                G4 P{settle_ms}
                QUERY_PROBE
                UPDATE_DELAYED_GCODE ID=_JWP_AUTO_ALIGN_LOOP DURATION=0.01
            {% endif %}
        {% endif %}
    {% endif %}
    {% endif %}

[gcode_macro JWP_ALIGN_STATUS]
description: Reports the current persisted actuation-dock strike positions and confirmation state
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    { action_respond_info("JWP [Step 1 of 5] STATUS\nDeploy X Strike: " ~ SAVED.get("deploy_x_strike", "not set (using config default)")|string ~ "  |  Confirmed: " ~ SAVED.get("actuation_dock_deploy_confirmed", False)|string ~ "\nRetract X Strike: " ~ SAVED.get("retract_x_strike", "not set (using config default)")|string ~ "  |  Confirmed: " ~ SAVED.get("actuation_dock_retract_confirmed", False)|string) }
    {% if SAVED.get("actuation_dock_deploy_confirmed", False) and SAVED.get("actuation_dock_retract_confirmed", False) %}
        {% set deploy_x = SAVED.get("deploy_x_strike")|float %}
        {% set retract_x = SAVED.get("retract_x_strike")|float %}
        {% set center_x = (deploy_x + retract_x) / 2.0 %}
        {% set measured_travel = (deploy_x - retract_x)|abs %}
        # Under the single-tine model, deploy_x_strike and retract_x_strike are two
        # bench-measured trigger points on the SAME tine, only a few mm apart due to
        # switch compliance/overtravel margin -- there is no fixed "expected" distance
        # to sanity-check against here (an earlier revision compared this against
        # dock_deploy_overtravel_mm, a leftover two-tine-era constant, and produced a
        # false-positive warning on a confirmed-good, repeatable single-tine result).
        # Reported as information only.
        { action_respond_info("Computed Dock Center X: " ~ center_x|string ~ " (midpoint of the two confirmed strikes -- reference only, not used by any motion macro)\nMeasured Deploy/Retract Travel: " ~ measured_travel|string ~ "mm (informational only -- expected to be a small few-mm value on the single-tine mechanism; no fixed target)") }
    {% endif %}


# =====================================================================
# ONBOARDING STEP 2 — AUTO-Z SWITCH LOCATION
# =====================================================================
# Everything in jwprobe_autoz.cfg (nozzle-touch, probe-to-nozzle offset,
# CALIBRATE_Z) needs to drive the NOZZLE precisely over the frame-mounted
# Z switch pin. Previously that location was assumed already known and
# only half-expressed: switch_y_pos existed as a global but switch_x had
# no home at all and defaulted to 0.0 -- i.e. the bed's front-left corner,
# which is essentially never where the switch is.
#
# This step finds it the same way the dock is found: park somewhere safe,
# let the operator jog the nozzle visually until it is centred over the
# pin, then persist that XY. It is deliberately manual. There is no
# sensor that can report "the nozzle is above the switch" in XY -- the
# switch only reports contact in Z -- so an automated search would have
# to blind-probe a grid and risk striking the pin off-centre and bending
# it. Human eyes are the correct instrument here.
#
# Z SAFETY: like the dock tool, this macro never homes or moves Z, and
# requires Z_CLEAR=1 as the operator's explicit confirmation that the
# gantry has been manually raised clear of the bed and the switch. The
# switch is mounted flush with the bed plane, so it is not a tall
# obstacle -- but traversing XY at an unknown low Z still risks dragging
# the nozzle across the bed and into the switch body.
# =====================================================================

[gcode_macro JWP_ALIGN_AUTOZ_SWITCH]
description: ONBOARDING STEP 2 — parks the nozzle at a starting guess for the frame-mounted Auto-Z switch (a previously-saved location if there is one, otherwise a neutral config default) so it can be jogged into position visually. This step never deploys the probe, never touches the bed, and never moves Z -- it is a pure XY move, so it works whether or not Z is homed yet, with no force_move/SET_KINEMATIC_POSITION needed at all. Requires Step 0 (machine profile) confirmed and this build set up for Auto-Z (JWP_SETUP_WIZARD AUTOZ=1). Optional SWITCH_X=[mm] SWITCH_Y=[mm]: if you already know the switch's location (previous build, CAD/build docs), parks there directly -- still only a starting point, never trusted blindly. JWP_ALIGN_SWITCH_NUDGE + JWP_SAVE_AUTOZ_SWITCH_LOCATION + JWP_VERIFY_AUTOZ_SWITCH_LOCATION are still required to confirm it with a real physical trigger test (or skip straight to JWP_SET_AUTOZ_SWITCH_LOCATION if the XY is already known precisely).
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}

    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - machine profile not set\nFix: run JWP_SETUP_WIZARD first (Step 0).") }
    {% endif %}
    {% if not SAVED.get("use_auto_z", V.use_auto_z) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - this build has no Auto-Z switch\nWhy: this build is configured as a STANDALONE PROBE install, so there is no switch to locate.\nFix: re-run JWP_SETUP_WIZARD AUTOZ=1 if this machine does have an Auto-Z switch.") }
    {% endif %}

    {% set homed = printer.toolhead.homed_axes %}
    {% if ('x' not in homed) or ('y' not in homed) %}
        # X/Y homing uses their own real endstops, unrelated to the Auto-Z
        # switch -- always safe to home for real here.
        G28 X Y
    {% endif %}

    # Starting point priority: (1) SWITCH_X/SWITCH_Y passed by the operator
    # this run -- e.g. a known value from a previous build/rebuild or the
    # machine's CAD/build docs, clamped to the bed travel limits for safety;
    # (2) the previously-saved location if there is one (re-alignment after
    # a frame change); (3) a neutral config default (jwprobe_globals.cfg
    # x_homing_pos/y_homing_pos). In ALL cases this is only a STARTING
    # point -- it is never trusted blindly. The operator still looks,
    # nudges as needed, and must run JWP_SAVE_AUTOZ_SWITCH_LOCATION then
    # JWP_VERIFY_AUTOZ_SWITCH_LOCATION to confirm/save; a stale or wrong
    # guess just costs a few extra nudges, never a bad save.
    {% set manual_switch = (params.SWITCH_X is defined) or (params.SWITCH_Y is defined) %}
    {% set default_x = SAVED.get("autoz_switch_x", V.x_homing_pos)|float %}
    {% set default_y = SAVED.get("autoz_switch_y", V.y_homing_pos)|float %}
    {% set raw_x = params.SWITCH_X|default(default_x)|float %}
    {% set raw_y = params.SWITCH_Y|default(default_y)|float %}
    {% set start_x = [[raw_x, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set start_y = [[raw_y, 0.0]|max, V.bed_max_y|float]|min %}
    {% set approach_feed = V.align_approach_feed_mm_min|float %}

    G90
    {% if 'z' in homed %}
        # Already homed from a prior session -- lift a small, safe amount
        # before any XY travel (matches the clearance used elsewhere).
        G1 Z{[printer.toolhead.position.z|float, V.lift_z|float]|max} F{V.z_speed|float * 60}
        M400
    {% endif %}
    G1 X{start_x} Y{start_y} F{approach_feed}
    M400

    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=switch_active VALUE=True

    {% if manual_switch %}
        { action_respond_info("JWP [Step 2 of 5] AUTO-Z SWITCH LOCATION\nNozzle parked at your supplied X=" ~ start_x|string ~ ", Y=" ~ start_y|string ~ ".\nNote: SWITCH_X/SWITCH_Y only set the starting point -- this is NOT saved as confirmed yet.\nJog: look down and confirm the nozzle is centred over the pin. If it's already correct, no nudge is needed -- otherwise JWP_ALIGN_SWITCH_NUDGE X=1 (or X=-1, Y=1, Y=-1, or smaller steps like X=0.2)\nNext: run JWP_SAVE_AUTOZ_SWITCH_LOCATION, then JWP_VERIFY_AUTOZ_SWITCH_LOCATION for a real physical trigger test.\nAbort: run JWP_ALIGN_FINISH to abort without saving.") }
    {% else %}
        { action_respond_info("JWP [Step 2 of 5] AUTO-Z SWITCH LOCATION\nNozzle parked at X=" ~ start_x|string ~ ", Y=" ~ start_y|string ~ " (starting guess -- not a measurement).\nKnow the switch XY already (previous build/CAD)? Re-run with SWITCH_X=[mm] SWITCH_Y=[mm] to start parked right there, or use JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] to save it directly without parking here first.\nJog: look down at the nozzle and the Z switch pin, then jog it centred over the pin -- JWP_ALIGN_SWITCH_NUDGE X=1 (or X=-1, Y=1, Y=-1, or smaller steps like X=0.2)\nNext: when centred over the pin, run JWP_SAVE_AUTOZ_SWITCH_LOCATION, then JWP_VERIFY_AUTOZ_SWITCH_LOCATION for a real physical trigger test.\nAbort: run JWP_ALIGN_FINISH to abort without saving.") }
    {% endif %}

[gcode_macro JWP_ALIGN_SWITCH_NUDGE]
description: ONBOARDING STEP 2 helper — jogs the nozzle by X=[mm] and/or Y=[mm] while locating the Auto-Z switch. Clamped to the machine's travel limits.
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if not S.switch_active %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - no Auto-Z switch alignment session active\nFix: run JWP_ALIGN_AUTOZ_SWITCH first.") }
    {% endif %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set dx = params.X|default(0.0)|float %}
    {% set dy = params.Y|default(0.0)|float %}
    {% set max_x = V.bed_max_x|float %}
    {% set max_y = V.bed_max_y|float %}
    {% set target_x = [[printer.toolhead.position.x|float + dx, V.bed_min_x|float]|max, max_x]|min %}
    {% set target_y = [[printer.toolhead.position.y|float + dy, 0.0]|max, max_y]|min %}
    G90
    G1 X{target_x} Y{target_y} F600
    M400
    { action_respond_info("JWP [Step 2 of 5] nozzle at X=" ~ target_x|string ~ ", Y=" ~ target_y|string ~ " -- nudge again, or run JWP_SAVE_AUTOZ_SWITCH_LOCATION when centred over the switch pin.") }

[gcode_macro JWP_SAVE_AUTOZ_SWITCH_LOCATION]
description: ONBOARDING STEP 2 — persists the current nozzle XY (parked/jogged via JWP_ALIGN_AUTOZ_SWITCH + JWP_ALIGN_SWITCH_NUDGE) as the Auto-Z switch location. NOT yet the final confirmation -- JWP_VERIFY_AUTOZ_SWITCH_LOCATION still needs to run a real physical trigger test before Step 2 counts as done.
gcode:
    {% set S = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% if not S.switch_active %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - no Auto-Z switch alignment session active\nFix: run JWP_ALIGN_AUTOZ_SWITCH first.") }
    {% endif %}
    {% set x = printer.toolhead.position.x|float %}
    {% set y = printer.toolhead.position.y|float %}

    SAVE_VARIABLE VARIABLE=autoz_switch_x VALUE={x}
    SAVE_VARIABLE VARIABLE=autoz_switch_y VALUE={y}
    SAVE_VARIABLE VARIABLE=autoz_switch_confirmed VALUE=False

    SET_GCODE_VARIABLE MACRO=_JWP_ALIGN_STATE VARIABLE=switch_active VALUE=False

    { action_respond_info("JWP [Step 2 of 5] location saved at X=" ~ x|string ~ ", Y=" ~ y|string ~ " -- not yet confirmed.\nNEXT: JWP_VERIFY_AUTOZ_SWITCH_LOCATION -- runs a real G28 Z against this exact spot to physically prove the switch triggers there before Step 2 counts as done.") }

[gcode_macro JWP_SET_AUTOZ_SWITCH_LOCATION]
description: ONBOARDING STEP 2 shortcut — directly saves an already-known Auto-Z switch location (from CAD/build docs, or a previous build) as X=[mm] Y=[mm], skipping the park/jog dance. Still NOT confirmed until JWP_VERIFY_AUTOZ_SWITCH_LOCATION runs a real physical trigger test. Use JWP_ALIGN_AUTOZ_SWITCH instead if you need to park and visually jog into position first.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - machine profile not set\nFix: run JWP_SETUP_WIZARD first (Step 0).") }
    {% endif %}
    {% if not SAVED.get("use_auto_z", V.use_auto_z) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - this build has no Auto-Z switch\nWhy: this build is configured as a STANDALONE PROBE install, so there is no switch to locate.\nFix: re-run JWP_SETUP_WIZARD AUTOZ=1 if this machine does have an Auto-Z switch.") }
    {% endif %}
    {% if (params.X is not defined) or (params.Y is not defined) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - both X= and Y= are required\nFix: JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] (measured/CAD-known switch position).") }
    {% endif %}
    {% set x = [[params.X|float, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set y = [[params.Y|float, 0.0]|max, V.bed_max_y|float]|min %}

    SAVE_VARIABLE VARIABLE=autoz_switch_x VALUE={x}
    SAVE_VARIABLE VARIABLE=autoz_switch_y VALUE={y}
    SAVE_VARIABLE VARIABLE=autoz_switch_confirmed VALUE=False

    { action_respond_info("JWP [Step 2 of 5] location saved at X=" ~ x|string ~ ", Y=" ~ y|string ~ " -- not yet confirmed.\nNEXT: JWP_VERIFY_AUTOZ_SWITCH_LOCATION -- runs a real G28 Z against this exact spot to physically prove the switch triggers there before Step 2 counts as done.") }

[gcode_macro JWP_VERIFY_AUTOZ_SWITCH_LOCATION]
description: ONBOARDING STEP 2 — physically tests the saved Auto-Z switch location with a real G28 Z (via the dynamic [homing_override] in jwprobe_homing.cfg, which always travels to the currently-saved autoz_switch_x/y before homing). Only marks the switch CONFIRMED if the physical trigger actually succeeds -- if Klipper reports "No trigger on probe after full movement" instead, the saved XY is not yet accurate enough; run JWP_ALIGN_AUTOZ_SWITCH + JWP_ALIGN_SWITCH_NUDGE + JWP_SAVE_AUTOZ_SWITCH_LOCATION again to refine it, then re-run this.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - machine profile not set\nFix: run JWP_SETUP_WIZARD first (Step 0).") }
    {% endif %}
    {% if not SAVED.get("use_auto_z", V.use_auto_z) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - this build has no Auto-Z switch\nWhy: this build is configured as a STANDALONE PROBE install, so there is no switch to locate.\nFix: re-run JWP_SETUP_WIZARD AUTOZ=1 if this machine does have an Auto-Z switch.") }
    {% endif %}
    {% if (SAVED.get("autoz_switch_x") is none) or (SAVED.get("autoz_switch_y") is none) %}
        { action_raise_error("JWP [Step 2 of 5] BLOCKED - no Auto-Z switch location saved yet\nFix: run JWP_ALIGN_AUTOZ_SWITCH (park+jog) or JWP_SET_AUTOZ_SWITCH_LOCATION X=[mm] Y=[mm] (direct entry) -- if you used the jog path, run JWP_SAVE_AUTOZ_SWITCH_LOCATION too -- before running this.") }
    {% endif %}

    G28 Z
    SAVE_VARIABLE VARIABLE=autoz_switch_confirmed VALUE=True

    { action_respond_info("JWP [Step 2 of 5] COMPLETE - Auto-Z switch physically triggered and confirmed at X=" ~ SAVED.get("autoz_switch_x")|string ~ ", Y=" ~ SAVED.get("autoz_switch_y")|string ~ ".\nAuto-Z macros (CALIBRATE_Z, JWP_MEASURE_PROBE_NOZZLE_OFFSET) and every future G28 Z now use this confirmed location automatically.") }
    { action_respond_info("NEXT: JWP_TEST_REPEATABILITY  (Step 3 of 5)") }


# =====================================================================
# OPTIONAL LEVELING ENVELOPE — VISUAL BED-EDGE CALIBRATION
#
# Klipper's native [quad_gantry_level]/[z_tilt]/[bed_mesh] sections are
# machine geometry, not JWP defaults. This workflow measures the part JWP
# can safely discover: a conservative physical rectangle over the build
# plate. The operator visually confirms two diagonal NOZZLE positions,
# front-right then rear-left, already inset from the plate edge by the
# requested margin. This diagonal deliberately avoids the front-left cutter
# engagement zone; the transition must never be replaced with an X sweep
# along the front edge. JWP then combines that rectangle with the configured
# [probe] x_offset/y_offset and the detected X/Y travel limits.
#
# QGL/Z-Tilt `points` are nozzle coordinates. [bed_mesh] mesh_min/max are
# probe coordinates. These are deliberately calculated separately.
# QGL gantry_corners and Z-Tilt z_positions describe physical Z-drive
# geometry and cannot be discovered by moving the nozzle; the generator
# therefore requires those values explicitly and never guesses them.
# =====================================================================

[gcode_macro _JWP_BED_ENVELOPE_STATE]
description: Internal state for the two-corner visual bed-envelope workflow.
variable_active: False
variable_phase: ""
variable_plate_x: 0.0
variable_plate_y: 0.0
variable_margin: 5.0
variable_inspection_z: 10.0
variable_front_right_x: -999.0
variable_front_right_y: -999.0
gcode:
    # State-only macro; not intended to be run directly.

[gcode_macro JWP_ALIGN_BED_ENVELOPE]
description: Optional post-calibration setup. Starts a two-corner visual check that discovers conservative leveling/mesh bounds. Requires nominal PLATE_X= and PLATE_Y= dimensions; MARGIN=5 and Z=10 are optional.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_BED_ENVELOPE_STATE"] %}
    {% set A = printer["gcode_macro _JWP_ALIGN_STATE"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% if (params.PLATE_X is not defined) or (params.PLATE_Y is not defined) %}
        # Rough starting estimate from this machine's scanned nozzle travel
        # (Step 0), NOT the confirmed physical plate size -- travel can
        # extend past the plate edges. Only a fill-in-the-blanks starting
        # point; this visual check finds the real corners regardless.
        {% set est_plate_x = (V.bed_max_x|float - V.bed_min_x|float)|round(0)|int %}
        {% set est_plate_y = (V.bed_max_y|float - V.bed_min_y|float)|round(0)|int %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - nominal plate dimensions are required.\nFix: JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm>\nStarting estimate from this machine's scanned nozzle travel (adjust to your actual plate): JWP_ALIGN_BED_ENVELOPE PLATE_X=" ~ est_plate_x|string ~ " PLATE_Y=" ~ est_plate_y|string) }
    {% endif %}
    {% set plate_x = params.PLATE_X|float %}
    {% set plate_y = params.PLATE_Y|float %}
    {% set margin = params.MARGIN|default(5.0)|float %}
    {% set inspection_z = params.Z|default(10.0)|float %}
    {% set travel_x = V.bed_max_x|float - V.bed_min_x|float %}
    {% set travel_y = V.bed_max_y|float - V.bed_min_y|float %}
    {% if not SAVED.get("profile_confirmed", False) %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - run JWP_SETUP_WIZARD first so the real X/Y travel limits are known.") }
    {% endif %}
    {% if not (SAVED.get("actuation_dock_deploy_confirmed", False) and SAVED.get("actuation_dock_retract_confirmed", False)) %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - complete actuation-dock alignment first. The probe must be safely retractable before visual bed-edge checks.") }
    {% endif %}
    {% if A.active or A.switch_active %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - another JWP alignment session is active. Run JWP_ALIGN_FINISH before starting this workflow.") }
    {% endif %}
    {% if S.active %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - a bed-envelope session is already active. Continue with JWP_BED_ENVELOPE_NUDGE/JWP_SAVE_BED_CORNER, or abort with JWP_BED_ENVELOPE_FINISH.") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - X, Y, and Z must already be homed.\nFix: run CALIBRATE_Z (it re-homes automatically), then retry JWP_ALIGN_BED_ENVELOPE.\nThis is expected right after a restart, since Z must be freshly homed and re-verified.\nStandalone (no Auto-Z) installs: run PROBE_CALIBRATE and home all axes manually first.") }
    {% endif %}
    {% if SAVED.get("use_auto_z", V.use_auto_z) and not V.autoz_session_valid %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - Auto-Z has not completed successfully in this Klipper session.\nFix: run CALIBRATE_Z first, then retry JWP_ALIGN_BED_ENVELOPE. This guarantees the inspection Z height is referenced to the calibrated plate plane.") }
    {% endif %}
    {% if plate_x <= (margin * 2.0) or plate_y <= (margin * 2.0) %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - PLATE_X/PLATE_Y must each be greater than twice MARGIN.") }
    {% endif %}
    {% if plate_x > (travel_x + 10.0) or plate_y > (travel_y + 10.0) %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - the entered plate size (" ~ plate_x|string ~ " x " ~ plate_y|string ~ "mm) is implausibly larger than detected nozzle travel (" ~ travel_x|string ~ " x " ~ travel_y|string ~ "mm). Verify PLATE_X/PLATE_Y.") }
    {% endif %}
    {% if margin < 2.0 %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - MARGIN must be at least 2mm. A smaller visual inset leaves inadequate edge tolerance.") }
    {% endif %}
    {% if inspection_z < 5.0 or inspection_z > 30.0 %}
        { action_raise_error("JWP LEVELING ENVELOPE BLOCKED - inspection Z must be between 5mm and 30mm.") }
    {% endif %}

    {% set start_x = [[V.bed_max_x|float - margin, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set start_y = [[V.bed_min_y|float + margin, V.bed_min_y|float]|max, V.bed_max_y|float]|min %}

    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=phase VALUE='"FRONT_RIGHT"'
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=plate_x VALUE={plate_x}
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=plate_y VALUE={plate_y}
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=margin VALUE={margin}
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=inspection_z VALUE={inspection_z}
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=front_right_x VALUE=-999.0
    SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=front_right_y VALUE=-999.0

    RETRACT_PROBE
    G90
    G1 Z{inspection_z} F{V.z_speed|float * 60.0}
    # Route to front-right without crossing the front-left cutter zone and
    # without making an X move in the rear actuation-dock zone: withdraw Y
    # to mid-travel, move X to the right, then approach the front in Y.
    {% set transit_y = (V.bed_min_y|float + V.bed_max_y|float) / 2.0 %}
    G1 Y{transit_y} F{V.xy_speed|float * 60.0}
    G1 X{start_x} F{V.xy_speed|float * 60.0}
    G1 Y{start_y} F{V.xy_speed|float * 60.0}
    M400
    { action_respond_info("JWP LEVELING ENVELOPE - CORNER 1/2: FRONT-RIGHT\nNozzle staged at X=" ~ "%.3f"|format(start_x) ~ ", Y=" ~ "%.3f"|format(start_y) ~ ", Z=" ~ "%.3f"|format(inspection_z) ~ ".\nVisually place the NOZZLE " ~ "%.1f"|format(margin) ~ "mm inside both the front and right plate edges.\nJog with JWP_BED_ENVELOPE_NUDGE X=<mm> and/or Y=<mm> (small values such as 1 or 0.2).\nWhen verified, run JWP_SAVE_BED_CORNER. Abort with JWP_BED_ENVELOPE_FINISH.") }

[gcode_macro JWP_BED_ENVELOPE_NUDGE]
description: Jogs the nozzle during the active bed-envelope visual check. X/Y increments are limited to 10mm per command and clamped to machine travel.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_BED_ENVELOPE_STATE"] %}
    {% if not S.active %}
        { action_raise_error("JWP BED ENVELOPE BLOCKED - no session is active. Start with JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm>.") }
    {% endif %}
    {% set dx = params.X|default(0.0)|float %}
    {% set dy = params.Y|default(0.0)|float %}
    {% if dx|abs > 10.0 or dy|abs > 10.0 %}
        { action_raise_error("JWP BED ENVELOPE BLOCKED - each nudge is limited to 10mm per axis. Use repeated small moves while watching the nozzle and plate edge.") }
    {% endif %}
    {% set target_x = [[printer.toolhead.position.x|float + dx, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set target_y = [[printer.toolhead.position.y|float + dy, V.bed_min_y|float]|max, V.bed_max_y|float]|min %}
    {% set rear_zone_y = V.bed_max_y|float - 10.0 %}
    {% if dx != 0.0 and (printer.toolhead.position.y|float > rear_zone_y or target_y > rear_zone_y) %}
        { action_raise_error("JWP BED ENVELOPE BLOCKED - X cannot be nudged inside the rear 10mm actuation-dock zone. Nudge Y forward first, adjust X, then approach the rear edge with Y-only movement.") }
    {% endif %}
    G90
    G1 X{target_x} Y{target_y} F600
    M400
    { action_respond_info("JWP bed-envelope " ~ S.phase ~ ": nozzle at X=" ~ "%.3f"|format(target_x) ~ ", Y=" ~ "%.3f"|format(target_y) ~ ". Continue nudging or run JWP_SAVE_BED_CORNER when visibly verified over the plate.") }

[gcode_macro JWP_SAVE_BED_CORNER]
description: Saves the current visually verified bed-envelope corner and advances to the second corner or completes the envelope.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_BED_ENVELOPE_STATE"] %}
    {% if not S.active %}
        { action_raise_error("JWP BED ENVELOPE BLOCKED - no session is active. Start with JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm>.") }
    {% endif %}
    {% set x = printer.toolhead.position.x|float %}
    {% set y = printer.toolhead.position.y|float %}
    {% if S.phase == "FRONT_RIGHT" %}
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=front_right_x VALUE={x}
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=front_right_y VALUE={y}
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=phase VALUE='"REAR_LEFT"'
        _JWP_BED_ENVELOPE_STAGE_REAR
    {% elif S.phase == "REAR_LEFT" %}
        {% set visual_min_x = x %}
        {% set visual_min_y = S.front_right_y|float %}
        {% set visual_max_x = S.front_right_x|float %}
        {% set visual_max_y = y %}
        {% if visual_min_x >= visual_max_x or visual_min_y >= visual_max_y %}
            { action_raise_error("JWP BED ENVELOPE BLOCKED - the two verified corners do not form FRONT-RIGHT and REAR-LEFT bounds.\nSaved front-right: X=" ~ visual_max_x|string ~ ", Y=" ~ visual_min_y|string ~ "; current rear-left: X=" ~ visual_min_x|string ~ ", Y=" ~ visual_max_y|string ~ ".\nCorrect the current location or abort and restart the workflow.") }
        {% endif %}
        {% set min_x = visual_min_x - S.margin|float %}
        {% set min_y = visual_min_y - S.margin|float %}
        {% set max_x = visual_max_x + S.margin|float %}
        {% set max_y = visual_max_y + S.margin|float %}
        {% set measured_x = max_x - min_x %}
        {% set measured_y = max_y - min_y %}
        {% if measured_x < 20.0 or measured_y < 20.0 %}
            { action_raise_error("JWP BED ENVELOPE BLOCKED - verified envelope is smaller than 20mm on one or both axes. Check corner selection before saving.") }
        {% endif %}
        {% if (measured_x - S.plate_x|float)|abs > 20.0 or (measured_y - S.plate_y|float)|abs > 20.0 %}
            { action_raise_error("JWP BED ENVELOPE BLOCKED - the derived plate size (" ~ "%.3f"|format(measured_x) ~ " x " ~ "%.3f"|format(measured_y) ~ "mm) differs from the entered nominal size (" ~ "%.3f"|format(S.plate_x|float) ~ " x " ~ "%.3f"|format(S.plate_y|float) ~ "mm) by more than 20mm. Recheck both visual corner saves or restart with the correct PLATE_X/PLATE_Y.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=leveling_bed_min_x VALUE={min_x}
        SAVE_VARIABLE VARIABLE=leveling_bed_min_y VALUE={min_y}
        SAVE_VARIABLE VARIABLE=leveling_bed_max_x VALUE={max_x}
        SAVE_VARIABLE VARIABLE=leveling_bed_max_y VALUE={max_y}
        SAVE_VARIABLE VARIABLE=leveling_bed_margin VALUE={S.margin|float}
        SAVE_VARIABLE VARIABLE=leveling_bed_envelope_confirmed VALUE=True
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=active VALUE=False
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=phase VALUE='""'
        { action_respond_info("JWP LEVELING ENVELOPE COMPLETE\nEstimated physical plate edges (derived from the two verified " ~ "%.1f"|format(S.margin|float) ~ "mm inset positions):\n  min X,Y = " ~ "%.3f"|format(min_x) ~ ", " ~ "%.3f"|format(min_y) ~ "\n  max X,Y = " ~ "%.3f"|format(max_x) ~ ", " ~ "%.3f"|format(max_y) ~ "\nJWP will apply a separate probing inset and cutter clearance when generating coordinates.\nNEXT: generate a native config block with JWP_GENERATE_LEVELING_CONFIG MODE=QGL, MODE=Z_TILT, or MODE=MESH. Run the command without geometry parameters first for exact required syntax.") }
    {% else %}
        { action_raise_error("JWP BED ENVELOPE BLOCKED - internal phase is invalid. Abort with JWP_BED_ENVELOPE_FINISH and restart.") }
    {% endif %}

[gcode_macro _JWP_BED_ENVELOPE_STAGE_REAR]
description: Internal diagonal handoff to the rear-left visual corner after the front-right coordinate has been saved, deliberately avoiding the front-left cutter engagement zone.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set S = printer["gcode_macro _JWP_BED_ENVELOPE_STATE"] %}
    {% set rear_zone_y = V.bed_max_y|float - 10.0 %}
    {% set target_x = [[V.bed_min_x|float + S.margin|float, V.bed_min_x|float]|max, V.bed_max_x|float]|min %}
    {% set target_y = [[V.bed_min_y|float + S.plate_y|float - S.margin|float, V.bed_min_y|float]|max, rear_zone_y]|min %}
    G90
    # One diagonal front-right -> rear-left move avoids the front-left cutter
    # actuator. Do not decompose this into a front-edge X move.
    G1 X{target_x} Y{target_y} F{V.xy_speed|float * 60.0}
    M400
    { action_respond_info("JWP LEVELING ENVELOPE - CORNER 2/2: REAR-LEFT\nFront-right saved at X=" ~ "%.3f"|format(S.front_right_x|float) ~ ", Y=" ~ "%.3f"|format(S.front_right_y|float) ~ ".\nNozzle staged at X=" ~ "%.3f"|format(target_x) ~ ", Y=" ~ "%.3f"|format(target_y) ~ ".\nVisually place the NOZZLE " ~ "%.1f"|format(S.margin|float) ~ "mm inside both the rear and left plate edges.\nUse JWP_BED_ENVELOPE_NUDGE, then JWP_SAVE_BED_CORNER when verified.") }

[gcode_macro JWP_BED_ENVELOPE_FINISH]
description: Aborts an active bed-envelope session without changing previously confirmed bounds.
gcode:
    {% set S = printer["gcode_macro _JWP_BED_ENVELOPE_STATE"] %}
    {% if S.active %}
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=active VALUE=False
        SET_GCODE_VARIABLE MACRO=_JWP_BED_ENVELOPE_STATE VARIABLE=phase VALUE='""'
        { action_respond_info("JWP bed-envelope session ended WITHOUT saving. Previously confirmed bounds, if any, were left unchanged.") }
    {% else %}
        { action_respond_info("JWP: no bed-envelope session was active.") }
    {% endif %}

[gcode_macro JWP_GENERATE_LEVELING_CONFIG]
description: Prints a copy-ready native Klipper leveling/mesh configuration from the verified bed envelope and configured probe offsets. MODE=QGL requires GANTRY_MIN_X/Y and GANTRY_MAX_X/Y. MODE=Z_TILT requires STEPPERS=2..4 and matching Z0_X/Y... coordinates. MODE=MESH emits mesh only.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set SAVED = printer.save_variables.variables %}
    {% set C = printer.configfile.settings %}
    {% set mode = params.MODE|default("")|upper %}
    {% if not SAVED.get("leveling_bed_envelope_confirmed", False) %}
        { action_raise_error("JWP LEVELING CONFIG BLOCKED - no visually verified bed envelope exists.\nFix: run JWP_ALIGN_BED_ENVELOPE PLATE_X=<mm> PLATE_Y=<mm> and save both corners first.") }
    {% endif %}
    {% if mode not in ["QGL", "Z_TILT", "MESH"] %}
        { action_raise_error("JWP LEVELING CONFIG BLOCKED - MODE must be QGL, Z_TILT, or MESH.") }
    {% endif %}

    {% set env_min_x = SAVED.get("leveling_bed_min_x")|float %}
    {% set env_min_y = SAVED.get("leveling_bed_min_y")|float %}
    {% set env_max_x = SAVED.get("leveling_bed_max_x")|float %}
    {% set env_max_y = SAVED.get("leveling_bed_max_y")|float %}
    {% set probe_x = C.probe.x_offset|default(0.0)|float %}
    {% set probe_y = C.probe.y_offset|default(0.0)|float %}
    {% set cutter_clearance = V.leveling_cutter_clearance_mm|float %}
    {% set probe_inset = V.leveling_probe_inset_mm|float %}
    {% set safe_min_x = env_min_x + probe_inset %}
    {% set safe_min_y = env_min_y + probe_inset %}
    {% set safe_max_x = env_max_x - probe_inset %}
    {% set safe_max_y = env_max_y - probe_inset %}

    # QGL/Z-Tilt points are nozzle coordinates whose offset probe must remain
    # inside the inset physical plate rectangle. The minimum corner is also
    # held clear of the JWP toolhead's front-left cutter engagement zone.
    {% set point_min_x = [V.bed_min_x|float + cutter_clearance, safe_min_x - probe_x]|max %}
    {% set point_min_y = [V.bed_min_y|float + cutter_clearance, safe_min_y - probe_y]|max %}
    {% set point_max_x = [V.bed_max_x|float, safe_max_x - probe_x]|min %}
    {% set point_max_y = [V.bed_max_y|float - 10.0, safe_max_y - probe_y]|min %}

    # Bed-mesh bounds are probe coordinates whose corresponding nozzle
    # coordinate (probe minus offset) must remain within machine travel and
    # keep the nozzle clear of the same front-left cutter engagement zone.
    {% set mesh_min_x = [safe_min_x, V.bed_min_x|float + cutter_clearance + probe_x]|max %}
    {% set mesh_min_y = [safe_min_y, V.bed_min_y|float + cutter_clearance + probe_y]|max %}
    {% set mesh_max_x = [safe_max_x, V.bed_max_x|float + probe_x]|min %}
    {% set mesh_max_y = [safe_max_y, V.bed_max_y|float + probe_y]|min %}
    {% set autoz_ref_x = V.bed_max_x|float / 2.0 %}
    {% set autoz_ref_y = V.bed_max_y|float / 2.0 %}

    {% if point_min_x >= point_max_x or point_min_y >= point_max_y %}
        { action_raise_error("JWP LEVELING CONFIG BLOCKED - configured probe offsets leave no valid leveling-point rectangle inside the verified plate envelope. Verify [probe] x_offset/y_offset and repeat the envelope calibration.") }
    {% endif %}
    {% if mesh_min_x >= mesh_max_x or mesh_min_y >= mesh_max_y %}
        { action_raise_error("JWP LEVELING CONFIG BLOCKED - configured probe offsets leave no valid bed-mesh rectangle reachable by the nozzle. Verify [probe] x_offset/y_offset and repeat the envelope calibration.") }
    {% endif %}

    { action_respond_info("=== JWP VERIFIED LEVELING CONFIG ===\nProbe offsets used: X=" ~ "%.3f"|format(probe_x) ~ ", Y=" ~ "%.3f"|format(probe_y) ~ "\nEstimated physical plate edges: " ~ "%.3f"|format(env_min_x) ~ "," ~ "%.3f"|format(env_min_y) ~ " to " ~ "%.3f"|format(env_max_x) ~ "," ~ "%.3f"|format(env_max_y) ~ "\nPhysical probing inset: " ~ "%.3f"|format(probe_inset) ~ "mm\nFront-left cutter clearance applied to nozzle coordinates: " ~ "%.3f"|format(cutter_clearance) ~ "mm") }

    {% if mode == "QGL" %}
        {% set have_geometry = params.GANTRY_MIN_X is defined and params.GANTRY_MIN_Y is defined and params.GANTRY_MAX_X is defined and params.GANTRY_MAX_Y is defined %}
        {% if have_geometry %}
            {% set gc_min_x = params.GANTRY_MIN_X|float %}
            {% set gc_min_y = params.GANTRY_MIN_Y|float %}
            {% set gc_max_x = params.GANTRY_MAX_X|float %}
            {% set gc_max_y = params.GANTRY_MAX_Y|float %}
            { action_respond_info("[quad_gantry_level]\ngantry_corners:\n   " ~ "%.3f"|format(gc_min_x) ~ "," ~ "%.3f"|format(gc_min_y) ~ "\n   " ~ "%.3f"|format(gc_max_x) ~ "," ~ "%.3f"|format(gc_max_y) ~ "\npoints:\n   " ~ "%.3f"|format(point_min_x) ~ "," ~ "%.3f"|format(point_min_y) ~ "\n   " ~ "%.3f"|format(point_min_x) ~ "," ~ "%.3f"|format(point_max_y) ~ "\n   " ~ "%.3f"|format(point_max_x) ~ "," ~ "%.3f"|format(point_max_y) ~ "\n   " ~ "%.3f"|format(point_max_x) ~ "," ~ "%.3f"|format(point_min_y) ~ "\nspeed: 200\nhorizontal_move_z: 10\nretries: 5\nretry_tolerance: 0.0075\nmax_adjust: 10") }
        {% else %}
            { action_respond_info("QGL probe points calculated safely, but gantry_corners cannot be measured from bed edges.\nRe-run with the two physical gantry corners from the printer manufacturer/CAD:\nJWP_GENERATE_LEVELING_CONFIG MODE=QGL GANTRY_MIN_X=<x> GANTRY_MIN_Y=<y> GANTRY_MAX_X=<x> GANTRY_MAX_Y=<y>\nCalculated QGL points:\n   " ~ "%.3f"|format(point_min_x) ~ "," ~ "%.3f"|format(point_min_y) ~ "\n   " ~ "%.3f"|format(point_min_x) ~ "," ~ "%.3f"|format(point_max_y) ~ "\n   " ~ "%.3f"|format(point_max_x) ~ "," ~ "%.3f"|format(point_max_y) ~ "\n   " ~ "%.3f"|format(point_max_x) ~ "," ~ "%.3f"|format(point_min_y)) }
        {% endif %}
    {% elif mode == "Z_TILT" %}
        {% set steppers = params.STEPPERS|default(0)|int %}
        {% set have_z0 = params.Z0_X is defined and params.Z0_Y is defined %}
        {% set have_z1 = params.Z1_X is defined and params.Z1_Y is defined %}
        {% set have_z2 = params.Z2_X is defined and params.Z2_Y is defined %}
        {% set have_z3 = params.Z3_X is defined and params.Z3_Y is defined %}
        {% if steppers < 2 or steppers > 4 or not have_z0 or not have_z1 or (steppers >= 3 and not have_z2) or (steppers == 4 and not have_z3) %}
            { action_respond_info("Z-Tilt probe range calculated safely, but z_positions cannot be measured from bed edges.\nRe-run with physical bed-pivot/Z-stepper positions in Klipper stepper order:\n2 motors: JWP_GENERATE_LEVELING_CONFIG MODE=Z_TILT STEPPERS=2 Z0_X=<x> Z0_Y=<y> Z1_X=<x> Z1_Y=<y>\nAdd Z2_X/Z2_Y for 3 motors or Z2_X/Z2_Y Z3_X/Z3_Y for 4 motors.\nValid nozzle-point rectangle: " ~ "%.3f"|format(point_min_x) ~ "," ~ "%.3f"|format(point_min_y) ~ " to " ~ "%.3f"|format(point_max_x) ~ "," ~ "%.3f"|format(point_max_y)) }
        {% else %}
            {% set z0x = params.Z0_X|float %}{% set z0y = params.Z0_Y|float %}
            {% set z1x = params.Z1_X|float %}{% set z1y = params.Z1_Y|float %}
            {% set p0x = [[z0x, point_min_x]|max, point_max_x]|min %}{% set p0y = [[z0y, point_min_y]|max, point_max_y]|min %}
            {% set p1x = [[z1x, point_min_x]|max, point_max_x]|min %}{% set p1y = [[z1y, point_min_y]|max, point_max_y]|min %}
            {% if steppers == 2 %}
                { action_respond_info("[z_tilt]\nz_positions:\n   " ~ "%.3f"|format(z0x) ~ "," ~ "%.3f"|format(z0y) ~ "\n   " ~ "%.3f"|format(z1x) ~ "," ~ "%.3f"|format(z1y) ~ "\npoints:\n   " ~ "%.3f"|format(p0x) ~ "," ~ "%.3f"|format(p0y) ~ "\n   " ~ "%.3f"|format(p1x) ~ "," ~ "%.3f"|format(p1y) ~ "\nspeed: 200\nhorizontal_move_z: 10\nretries: 5\nretry_tolerance: 0.0075") }
            {% elif steppers == 3 %}
                {% set z2x = params.Z2_X|float %}{% set z2y = params.Z2_Y|float %}
                {% set p2x = [[z2x, point_min_x]|max, point_max_x]|min %}{% set p2y = [[z2y, point_min_y]|max, point_max_y]|min %}
                { action_respond_info("[z_tilt]\nz_positions:\n   " ~ "%.3f"|format(z0x) ~ "," ~ "%.3f"|format(z0y) ~ "\n   " ~ "%.3f"|format(z1x) ~ "," ~ "%.3f"|format(z1y) ~ "\n   " ~ "%.3f"|format(z2x) ~ "," ~ "%.3f"|format(z2y) ~ "\npoints:\n   " ~ "%.3f"|format(p0x) ~ "," ~ "%.3f"|format(p0y) ~ "\n   " ~ "%.3f"|format(p1x) ~ "," ~ "%.3f"|format(p1y) ~ "\n   " ~ "%.3f"|format(p2x) ~ "," ~ "%.3f"|format(p2y) ~ "\nspeed: 200\nhorizontal_move_z: 10\nretries: 5\nretry_tolerance: 0.0075") }
            {% else %}
                {% set z2x = params.Z2_X|float %}{% set z2y = params.Z2_Y|float %}
                {% set z3x = params.Z3_X|float %}{% set z3y = params.Z3_Y|float %}
                {% set p2x = [[z2x, point_min_x]|max, point_max_x]|min %}{% set p2y = [[z2y, point_min_y]|max, point_max_y]|min %}
                {% set p3x = [[z3x, point_min_x]|max, point_max_x]|min %}{% set p3y = [[z3y, point_min_y]|max, point_max_y]|min %}
                { action_respond_info("[z_tilt]\nz_positions:\n   " ~ "%.3f"|format(z0x) ~ "," ~ "%.3f"|format(z0y) ~ "\n   " ~ "%.3f"|format(z1x) ~ "," ~ "%.3f"|format(z1y) ~ "\n   " ~ "%.3f"|format(z2x) ~ "," ~ "%.3f"|format(z2y) ~ "\n   " ~ "%.3f"|format(z3x) ~ "," ~ "%.3f"|format(z3y) ~ "\npoints:\n   " ~ "%.3f"|format(p0x) ~ "," ~ "%.3f"|format(p0y) ~ "\n   " ~ "%.3f"|format(p1x) ~ "," ~ "%.3f"|format(p1y) ~ "\n   " ~ "%.3f"|format(p2x) ~ "," ~ "%.3f"|format(p2y) ~ "\n   " ~ "%.3f"|format(p3x) ~ "," ~ "%.3f"|format(p3y) ~ "\nspeed: 200\nhorizontal_move_z: 10\nretries: 5\nretry_tolerance: 0.0075") }
            {% endif %}
        {% endif %}
    {% endif %}

    {% if SAVED.get("use_auto_z", V.use_auto_z) %}
        { action_respond_info("[bed_mesh]\nspeed: 200\nhorizontal_move_z: 10\nzero_reference_position: " ~ "%.3f"|format(autoz_ref_x) ~ "," ~ "%.3f"|format(autoz_ref_y) ~ "\nmesh_min: " ~ "%.3f"|format(mesh_min_x) ~ "," ~ "%.3f"|format(mesh_min_y) ~ "\nmesh_max: " ~ "%.3f"|format(mesh_max_x) ~ "," ~ "%.3f"|format(mesh_max_y) ~ "\nprobe_count: 5,5\nalgorithm: bicubic\n\nIn printer.cfg: replace the existing [bed_mesh] (and [quad_gantry_level]/[z_tilt] if shown above) section(s) with the emitted text above -- do not keep both old and new copies. Enable the matching optional JWP wrapper include(s), then RESTART and run JWP_CONFIG_AUDIT.") }
    {% else %}
        { action_respond_info("[bed_mesh]\nspeed: 200\nhorizontal_move_z: 10\nmesh_min: " ~ "%.3f"|format(mesh_min_x) ~ "," ~ "%.3f"|format(mesh_min_y) ~ "\nmesh_max: " ~ "%.3f"|format(mesh_max_x) ~ "," ~ "%.3f"|format(mesh_max_y) ~ "\nprobe_count: 5,5\nalgorithm: bicubic\n\nStandalone install: zero_reference_position was intentionally omitted because JWP does not know where your PROBE_CALIBRATE paper reference was taken.\nIn printer.cfg: replace the existing [bed_mesh] (and [quad_gantry_level]/[z_tilt] if shown above) section(s) with the emitted text above -- do not keep both old and new copies. Enable the matching optional JWP wrapper include(s), then RESTART and run JWP_CONFIG_AUDIT.") }
    {% endif %}
