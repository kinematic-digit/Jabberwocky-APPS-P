## PCB Activity Light
[output_pin act_led]
pin: !nhk:gpio8


#####################################################################
#   Print Start Idle Fade
#####################################################################

[gcode_macro PRINT_START]
gcode:
    STOP_IDLE_FADE                   # <--- KILL THE FADE COUNTER IMMEDIATELY
    ASSERT_PROBE_DOCKED
    # ... rest of your print start parameters ...


#####################################################################
#   Idle Timeout
#####################################################################

[idle_timeout]
timeout: 600                        # Keeps steppers and warm currents held for 10 minutes of complete silence
gcode:
    # 1. Standard low-level safe shutdown commands
    TURN_OFF_HEATERS
    M107                             ; Turn off cooling fans
    M18                              ; Disable stepper motor currents to prevent cook heat
    
    # 2. FIXED: Triggers your new 30-minute fading rainbow sunset sequence
    START_IDLE_RAINBOW

#####################################################################
#   Accelerometer
#####################################################################

[adxl345]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345
probe_points: 87.5, 87.5, 20


