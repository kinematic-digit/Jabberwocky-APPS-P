# =====================================================================
# JABBERWOCKY APPS — DASHBOARD SYNC BRIDGE (jwt_sync_bridge.cfg) v5.8.0
# Included only when the gcode_shell_command Klipper extension is present.
# Placeholders are filled in by the installer; do not edit paths by hand.
# =====================================================================
[gcode_shell_command jws_sync_core]
command: sh -c "PRINTER_CONFIG_DIR='/home/tlam/printer_data/config' '/usr/bin/python3' '/home/tlam/Jabberwocky-APPS/software/macro_manager/jws_core.py' --sync && curl -s -X POST http://localhost:7125/printer/firmware_restart"
timeout: 60.0
verbose: True

[gcode_macro JABBERWOCKY_SYNC_NOW]
description: Apply jwt_macro_manager.conf toggles to the config, then restart firmware.
gcode:
    {action_respond_info("JABBERWOCKY: applying dashboard toggles, firmware will restart if the sync succeeds...")}
    RUN_SHELL_COMMAND CMD=jws_sync_core
