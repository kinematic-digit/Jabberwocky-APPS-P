[gcode_macro JWP_SG_TEST]
description: TMC2209 StallGuard4 velocity test
gcode:
    M83

    RESPOND MSG="=== JWP SG TEST: 5 mm/s - SAMPLE NOW ==="
    G1 E200 F300

    RESPOND MSG="=== JWP SG TEST: 10 mm/s - SAMPLE NOW ==="
    G1 E200 F600

    RESPOND MSG="=== JWP SG TEST: 15 mm/s - SAMPLE NOW ==="
    G1 E200 F900

    RESPOND MSG="=== JWP SG TEST: 20 mm/s - SAMPLE NOW ==="
    G1 E200 F1200

    RESPOND MSG="=== JWP SG TEST: 30 mm/s - SAMPLE NOW ==="
    G1 E200 F1800

    RESPOND MSG="=== JWP SG TEST: 40 mm/s - SAMPLE NOW ==="
    G1 E200 F2400

    RESPOND MSG="=== JWP SG TEST COMPLETE ==="



    [gcode_macro JWP_SG_VELOCITY_TEST]
description: Unloaded StallGuard4 velocity characterization
gcode:
    M83

    RESPOND MSG="=== JWP SG VELOCITY TEST ==="
    RESPOND MSG="0.80A | TBL1 TOFF3 HSTRT0 HEND3 | NO FILAMENT"

    SET_TMC_CURRENT STEPPER=extruder CURRENT=0.80
    SET_TMC_FIELD STEPPER=extruder FIELD=TBL VALUE=1
    SET_TMC_FIELD STEPPER=extruder FIELD=TOFF VALUE=3
    SET_TMC_FIELD STEPPER=extruder FIELD=HSTRT VALUE=0
    SET_TMC_FIELD STEPPER=extruder FIELD=HEND VALUE=3

    G4 P1000

    RESPOND MSG="=== 10 mm/s ==="
    G1 E300 F600
    G4 P500

    RESPOND MSG="=== 20 mm/s ==="
    G1 E300 F1200
    G4 P500

    RESPOND MSG="=== 30 mm/s ==="
    G1 E300 F1800
    G4 P500

    RESPOND MSG="=== 40 mm/s ==="
    G1 E300 F2400
    G4 P500

    RESPOND MSG="=== 50 mm/s ==="
    G1 E300 F3000
    G4 P500

    RESPOND MSG="=== TEST COMPLETE ==="