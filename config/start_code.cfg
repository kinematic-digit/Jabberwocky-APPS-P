[gcode_macro PRINT_START]
description: Universal production launch sequence coordinating status LEDs, heating, leveling, and Auto-Z
gcode:
    # --- Setup guard: real onboarding macro is JWP_SETUP_WIZARD ---
    {% if not printer["gcode_macro JWProbe_Variables"].setup_complete %}
        { action_raise_error("ABORT LOCKED: You cannot print until JWP_SETUP_WIZARD (and the full onboarding sequence in the JWP README) has been run successfully!") }
    {% endif %}

    # 1. Fetch slicer-passed variables safely (defaults to safe PLA target values)
    {% set BED = params.BED_TEMP|default(50)|int %}
    {% set EXTRUDER = params.HOTEND_TEMP|default(190)|int %}
    {% set V = printer["gcode_macro JWProbe_Variables"] %}

    # 2. Initialize hardware states and chamber preheating
    {% if 'set_case_light_on' in printer %} set_case_light_on {% endif %}
    M107                             # Turn off parts cooling fan to prevent uneven heating

    {% if 'status_heating' in printer %} status_heating {% endif %}
    M140 S{BED}                      # Command target bed heater threshold without waiting
    {% if 'SET_FAN_SPEED' in printer %} SET_FAN_SPEED FAN=BedFans SPEED=0.8 {% endif %}
    M104 S150                        # Preheat nozzle to safe non-oozing 150C -- Auto-Z touches the nozzle to
                                      # a frame switch inside JWP_PRINT_PREP; a full-temp nozzle would ooze onto it.

    # 3. Synchronize bed temperature fully before any mechanical checks begin
    M190 S{BED}                      # Wait for complete physical bed thermal stabilization to fight warping

    # 4. JWP: homing + Auto-Z + QGL/Z-Tilt + Bed Mesh, all in one call, nozzle still cool
    JWP_PRINT_PREP

    # 5. Commit final hotend thermal values for active printing execution
    {% if 'status_heating' in printer %} status_heating {% endif %}
    M109 S{EXTRUDER}                 # NOW bring hotend to target -- all switch/bed touches are already done

	UPDATE_DELAYED_GCODE ID=JWP_COLLISION_WATCHDOG DURATION=5


    # 6. Launch print run via your standalone corner purge routine
    {% if 'status_printing' in printer %} status_printing {% endif %}
    PURGE_BLOB
    M117 Printing...



[gcode_macro _MOVE_AWAY]
description: Rapid transit toolhead clearance escape path macro
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
      
    G90                              
    G0 X{x_safe} Y{y_safe} Z{z_safe} F10000  

[gcode_macro _CQGL]
description: Conditional Quad Gantry Leveling checker
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 
        {% endif %}
        {% if 'status_leveling' in printer %} status_leveling {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}
    {% if 'status_ready' in printer %} status_ready {% endif %}

[gcode_macro _CHOME]
description: Conditional Homing matrix checker
gcode:
    {% if 'status_homing' in printer %} status_homing {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    {% if 'status_ready' in printer %} status_ready {% endif %}

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; Wait for move buffer to clear completely
    G92 E0                         ; Zero the extruder map
    G1 E-10.0 F1800                ; Retract molten filament to prevent nozzle blobs

    TURN_OFF_HEATERS

    {% if 'mmu' in printer or 'MMU_END' in printer %}
        MMU_END
    {% endif %}

    G90                                      ; Absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; Quick wipe move to break wispy strings

    PRINT_END_CELEBRATION

    M107                                     ; Turn off cooling fans safely
    M18                                      ; Disable stepper motors
    BED_MESH_CLEAR                           ; Flush bed mesh offsets from background memory
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END