# JWStall_Test Stage 0 Observation Logger: host-side, read-only collection
# and reporting.
#
# Install klipper_extension/stage0_observation.py and
# klipper_extension/stage0_observation_core.py in Klipper's klippy/extras/
# directory, then include this file from printer.cfg and restart Klipper.
#
# This module registers no movement, temperature, current, pause, or
# configuration commands. Its only commands start/stop/status a local report.
[stage0_observation]
# This folder appears in Mainsail/Fluidd's Moonraker file browser. The report
# records only a print filename, not this host path.
output_directory: ~/printer_data/config/JWStall_results
driver_section: tmc2209 extruder
sample_rate_hz: 25
summary_interval_s: 1
max_samples: 36000
sg_result_capture_mode: internal_experimental
sg_result_max_rate_hz: 25


[jwstall_benchmark]
enabled: true
target_temperature: 200
filament_diameter: 1.75
extrusion_velocity: 5
measured_run_s: 60
segment_distance: 10
max_total_distance: 300
thermal_soak_s: 60
temperature_tolerance: 2
filament_brand: Elegoo
filament_type: PLA
filament_color: Lime
nozzle: 0.4
