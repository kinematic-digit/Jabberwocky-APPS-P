# =====================================================================
# JABBERWOCKY PROBE 2.0 — BED MESH CALIBRATE BUTTON OVERRIDE
# The APPS JWP installer manages this include after native sections in printer.cfg.
# =====================================================================

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _JWP_NATIVE_BED_MESH_CALIBRATE
description: Intercepts Mainsail/Fluidd Bed Mesh button and G-code commands to automatically deploy and retract the Jabberwocky Probe.
gcode:
    {% set V = printer["gcode_macro JWProbe_Variables"] %}
    {% set was_deployed = V.probe_deployed %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # 🎯 Always call DEPLOY_PROBE (not gated on the persisted was_deployed
    # flag): DEPLOY_PROBE itself re-checks the LIVE physical pin state via
    # QUERY_PROBE and only moves if actually needed, so this is a cheap,
    # safe no-op when truly already deployed. Skipping it here on a stale
    # was_deployed=True flag let a genuinely-triggered probe reach native
    # BED_MESH_CALIBRATE unchecked, producing "Probe triggered prior to
    # movement" the moment probing started.
    DEPLOY_PROBE
    _JWP_NATIVE_BED_MESH_CALIBRATE {rawparams}
    {% if not was_deployed %}
        RETRACT_PROBE
    {% endif %}
