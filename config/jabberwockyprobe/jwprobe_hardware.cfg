# =====================================================================
# JABBERWOCKY PROBE 2.0 — HARDWARE BINDINGS & PIN DEFINITIONS
# =====================================================================

[probe]
# --- CORE PROBE CONFIGURATION ---
# NOTE: Pin inversion (!) added after bench testing (Milestone 6) proved the
# raw GPIO10 signal reads inverted relative to a standard non-inverted
# pull-up input: physical continuity to GND (switch closed) was reported by
# QUERY_PROBE as "open", and no continuity was reported as "TRIGGERED" —
# confirmed empirically across 4 isolated test states via direct multimeter
# continuity checks at the mainboard connector vs. QUERY_PROBE output.
pin: ^!nhk:gpio10
x_offset: 0.0
y_offset: 26.0
z_offset: 0.0
speed: 7.0
# 🎯 Multi-sample averaging + outlier rejection for QGL/BED_MESH_CALIBRATE/
# any native PROBE call. With samples: 1 (the old value), a single noisy or
# bounced touch became a permanent point value with nothing to catch it --
# this is what produced isolated multi-mm spikes scattered across an
# otherwise flat heightmap (not a real physical bed tilt/warp). samples: 3
# plus samples_tolerance/samples_tolerance_retries makes Klipper retry a
# point (up to the retry budget) whenever the samples at that point disagree
# by more than the tolerance, instead of accepting a bad single touch.
samples: 3
samples_tolerance: 0.0100
samples_tolerance_retries: 3
# Reduced from 2.0mm: with 3 samples now taken per point instead of 1, a
# smaller retract between repeats keeps the added per-point time in check
# while still giving the switch enough clearance to fully reset between
# touches.
sample_retract_dist: 1.0
lift_speed: 40.0
activate_gcode:
    G4 P100

[jwp_probe_accel_test]
pin: ^!nhk:gpio10

# ===================================================================
# 🎛️ PHYSICAL ACTUATION HOOK ALIASES
# ===================================================================

[gcode_macro DEPLOY_PROBE]
description: Executes physical deployment of the probe carriage
gcode:
    _EXECUTE_DEPLOY_PROBE

[gcode_macro RETRACT_PROBE]
description: Executes physical retraction and stowing of the probe carriage
gcode:
    _EXECUTE_RETRACT_PROBE

[jwp_probe_accel_test]
pin: ^!nhk:gpio10